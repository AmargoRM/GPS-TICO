/* --- Consulta por radio en metros: busca TODOS los features en un círculo --- */
function metrosAPixeles(lat, metros){
  // Un grado de latitud ≈ 111.32 km en el WGS84. Convertimos metros a grados y
  // luego a píxeles usando la escala del último dibujo (ultimoT).
  const gLat = metros / 111320;
  if(!ultimoT) return 30;
  const p1 = latlonAPantalla(lat, 0);
  const p2 = latlonAPantalla(lat + gLat, 0);
  if(!p1 || !p2) return 30;
  return Math.abs(p2.y - p1.y);
}
function consultarPorRadio(px, py, radioM){
  const ll = pantallaALatLon(px, py); if(!ll) return;
  const radioPx = Math.max(30, metrosAPixeles(ll.lat, radioM));
  // Margen en grados para el filtro previo por bbox.
  const p1 = pantallaALatLon(px - radioPx, py - radioPx);
  const p2 = pantallaALatLon(px + radioPx, py + radioPx);
  const loMar = p1&&p2 ? Math.abs(p2.lon-p1.lon) : 0.01;
  const laMar = p1&&p2 ? Math.abs(p1.lat-p2.lat) : 0.01;
  // Recolectar todos los features que caen dentro del radio.
  const encontrados = [];   // {capa, feature, dist}
  for(let i=S.capas.length-1;i>=0;i--){
    const c = S.capas[i];
    if(!c.visible || c.tipo==='wms' || c.consultable===false || !c.geojson) continue;
    const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : c.geojson.type==='Feature' ? [c.geojson] : [];
    for(const f of feats){
      if(!f || !f.geometry) continue;
      if(featureOculto(c, f)) continue;
      if(!f._bbox){ try{ f._bbox = bboxGeom(f.geometry); }catch(e){ continue; } }
      const b = f._bbox;
      if(!b || b[2]<ll.lon-loMar || b[0]>ll.lon+loMar || b[3]<ll.lat-laMar || b[1]>ll.lat+laMar) continue;
      let d = Infinity;
      try{ d = distGeomPx(f.geometry, px, py, ll); }catch(e){}
      if(d <= radioPx) encontrados.push({ capa:c, feature:f, dist:d });
    }
  }
  encontrados.sort((a,b)=> a.dist - b.dist);
  if(encontrados.length === 0){
    // Consulta WMS como respaldo si hay capas WMS visibles y consultables.
    for(let i=S.capas.length-1;i>=0;i--){
      const c = S.capas[i];
      if(!c.visible || c.tipo!=='wms' || c.consultable===false) continue;
      consultarWMS(c, px, py); return;
    }
    toast('No hay elementos consultables en un radio de '+radioM+' m.');
    return;
  }
  if(encontrados.length === 1){
    mostrarAtributos(encontrados[0].capa, [encontrados[0].feature]);
    return;
  }
  mostrarTablaLateral(encontrados);
}

// Distancia mínima (px) del toque a una polilínea (segmentos, no solo vértices).
function distSegAny(px, py, pts){
  let m = Infinity;
  for(let i=1;i<pts.length;i++){ if(pts[i-1] && pts[i]){ const d = distSegPx(px,py,pts[i-1],pts[i]); if(d<m) m=d; } }
  if(pts.length===1 && pts[0]) m = Math.hypot(px-pts[0].x, py-pts[0].y);
  return m;
}
// Distancia en px del toque a una geometría (0 si el toque cae dentro de un polígono).
function distGeomPx(g, px, py, ll){
  if(!g) return Infinity;
  const P = c=> latlonAPantalla(c[1],c[0]);
  switch(g.type){
    case 'Point': { const p=P(g.coordinates); return p?Math.hypot(px-p.x,py-p.y):Infinity; }
    case 'MultiPoint': return Math.min(...g.coordinates.map(c=>{ const p=P(c); return p?Math.hypot(px-p.x,py-p.y):Infinity; }));
    case 'LineString': return distSegAny(px,py,g.coordinates.map(P));
    case 'MultiLineString': return Math.min(...g.coordinates.map(l=> distSegAny(px,py,l.map(P))));
    case 'Polygon': return puntoEnPolig(ll.lon,ll.lat,g.coordinates) ? 0 : Math.min(...g.coordinates.map(r=> distSegAny(px,py,r.map(P))));
    case 'MultiPolygon': return g.coordinates.some(poly=> puntoEnPolig(ll.lon,ll.lat,poly)) ? 0
                              : Math.min(...g.coordinates.map(poly=> Math.min(...poly.map(r=> distSegAny(px,py,r.map(P))))));
    case 'GeometryCollection': return Math.min(...(g.geometries||[]).map(gg=> distGeomPx(gg,px,py,ll)));
  }
  return Infinity;
}
function geomEsPoligono(g){
  if(!g) return false;
  if(g.type==='Polygon' || g.type==='MultiPolygon') return true;
  if(g.type==='GeometryCollection') return (g.geometries||[]).some(geomEsPoligono);
  return false;
}
function consultarEnPantalla(px,py){
  const ll = pantallaALatLon(px,py); if(!ll) return;
  // Radios de acierto (píxeles). Puntos son objetos pequeños y el dedo cubre
  // ~80 px; se aceptan más lejos que líneas/polígonos.
  const TOL = 44;         // radio efectivo para líneas y polígonos
  const TOL_PT = 80;      // radio para PUNTOS
  // Margen del filtro previo por bbox: 3x la tolerancia del dedo, para que
  // ningún punto cercano se descarte prematuramente por conversiones px→lat/lon.
  const TOL_FILT = Math.max(TOL, TOL_PT) * 3;
  const p1 = pantallaALatLon(px-TOL_FILT, py-TOL_FILT), p2 = pantallaALatLon(px+TOL_FILT, py+TOL_FILT);
  const loMar = p1&&p2 ? Math.abs(p2.lon-p1.lon) : 0.01;
  const laMar = p1&&p2 ? Math.abs(p1.lat-p2.lat) : 0.01;

  // 1) Elemento vectorial consultable MÁS CERCANO (punto, línea o polígono).
  let mejor=null, mejorDist=Infinity, mejorCapa=null;
  let respaldo=null, respaldoArea=Infinity, respaldoCapa=null;
  // Diagnóstico: si nada matchea, sabemos por qué (cuántas capas, features cerca, distancia mínima real).
  let capasConsult=0, capasVisibleNoConsult=0, capasOcultas=0, featsCerca=0, minDistReal=Infinity;
  for(let i=S.capas.length-1;i>=0;i--){
    const c = S.capas[i];
    if(!c.visible){ capasOcultas++; continue; }
    if(c.tipo==='wms') continue;
    if(c.consultable===false){ capasVisibleNoConsult++; continue; }
    if(!c.geojson) continue;
    capasConsult++;
    const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : c.geojson.type==='Feature' ? [c.geojson] : [];
    for(const f of feats){
      if(!f || !f.geometry) continue;
      if(featureOculto(c, f)) continue;
      if(!f._bbox){ try{ f._bbox = bboxGeom(f.geometry); }catch(e){ continue; } }
      const b = f._bbox;
      if(!b || b[2]<ll.lon-loMar || b[0]>ll.lon+loMar || b[3]<ll.lat-laMar || b[1]>ll.lat+laMar) continue;
      featsCerca++;
      // Respaldo SOLO para polígonos: ¿el toque cae dentro de su caja?
      if(geomEsPoligono(f.geometry) && ll.lon>=b[0] && ll.lon<=b[2] && ll.lat>=b[1] && ll.lat<=b[3]){
        const area = Math.max(1e-12, (b[2]-b[0])*(b[3]-b[1]));
        if(area < respaldoArea){ respaldoArea = area; respaldo = f; respaldoCapa = c; }
      }
      let d = Infinity;
      try{ d = distGeomPx(f.geometry, px, py, ll); }catch(e){ d = Infinity; }
      if(d < minDistReal) minDistReal = d;
      // Tolerancia por tipo: puntos aceptan hasta TOL_PT (80), líneas/polígonos hasta TOL (44).
      const gt = f.geometry.type;
      const tolFeat = (gt==='Point' || gt==='MultiPoint') ? TOL_PT : TOL;
      if(d <= tolFeat && d < mejorDist){ mejorDist = d; mejor = f; mejorCapa = c; if(d===0) break; }
    }
    if(mejor && mejorDist===0) break;
  }
  if(mejor){ mostrarAtributos(mejorCapa, [mejor]); return; }
  // Fallback: si hay un feature dentro del bbox filtrado (featsCerca>0) pero
  // ninguno cumplió la tolerancia estricta, tomar el MÁS CERCANO hasta 140 px.
  // Así el usuario no queda mudo cuando toca cerca pero no exactamente encima.
  if(featsCerca>0 && minDistReal < 140){
    // segunda pasada: solo comparar distancias sin exigir tolerancia estricta
    let mm=null, mmC=null, mmD=Infinity;
    for(let i=S.capas.length-1;i>=0;i--){
      const c = S.capas[i];
      if(!c.visible || c.tipo==='wms' || c.consultable===false || !c.geojson) continue;
      const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : c.geojson.type==='Feature' ? [c.geojson] : [];
      for(const f of feats){
        if(!f || !f.geometry) continue;
        if(featureOculto(c, f)) continue;
        const b = f._bbox; if(!b) continue;
        if(b[2]<ll.lon-loMar || b[0]>ll.lon+loMar || b[3]<ll.lat-laMar || b[1]>ll.lat+laMar) continue;
        let d = Infinity;
        try{ d = distGeomPx(f.geometry, px, py, ll); }catch(e){}
        if(d < mmD){ mmD = d; mm = f; mmC = c; }
      }
    }
    if(mm){ mostrarAtributos(mmC, [mm]); return; }
  }
  // 1b) Capas grandes (motor compacto).
  const bh = bigHitTest(px, py, ll, TOL);
  if(bh){ mostrarAtributosBig(bh.capa, bh.fi); return; }
  if(respaldo){ mostrarAtributos(respaldoCapa, [respaldo]); return; }
  // 2) Punto del proyecto (marcado o promediado).
  let mejorP=null, mejorD=30;
  for(const p of S.puntos){ const s=latlonAPantalla(p.lat,p.lon); if(!s) continue; const d=Math.hypot(px-s.x,py-s.y); if(d<mejorD){ mejorD=d; mejorP=p; } }
  if(mejorP){ mostrarPunto(mejorP); return; }
  // 3) WMS: preguntar al servidor.
  for(let i=S.capas.length-1;i>=0;i--){
    const c = S.capas[i];
    if(!c.visible || c.tipo!=='wms' || c.consultable===false) continue;
    consultarWMS(c, px, py); return;
  }
  // 4) Nada cerca: dar retroalimentación en vez de quedarse mudo.
  const hayConsultables = S.capas.some(c=> c.visible && c.consultable!==false);
  if(S.capas.length && !hayConsultables) toast('Activá la lupa 🔍 en la capa para poder consultarla.');
  else if(hayConsultables) toast('No hay ningún elemento consultable en ese punto.');
}
function mostrarPunto(p){
  const f = fmtCoord(p.lat, p.lon, S.modo);
  const rows = [
    ['Nombre', p.nom], ['Descripción', p.desc||''],
    [PROY[S.modo].nom, f.a+'  '+f.b],
    ['Exactitud', (p.exac!=null?p.exac.toFixed(1)+' m':'—')],
    ['Altura orto', (p.altOrto!=null?p.altOrto.toFixed(1)+' m':'—')],
    ['Altura elip', (p.altElip!=null?p.altElip.toFixed(1)+' m':(p.alt!=null?p.alt.toFixed(1)+' m':'—'))],
    ['Fuente', p.fuente||'fused'],
    ['Tipo', p.promediado?('promediado · '+(p.muestras||'?')+' muestras · σ'+(p.desvStd!=null?p.desvStd.toFixed(2):'?')+'m'):'instantáneo'],
    ['Fecha', new Date(p.t).toLocaleString('es-CR')]
  ];
  // Datos de plantilla, si el punto los tiene.
  if(p.datos && Object.keys(p.datos).length){
    for(const [k,v] of Object.entries(p.datos)) rows.push([k, v==null?'':String(v)]);
  }
  let html = rows.map(([k,v])=>`<div class="res"><div class="k">${escHtml(k)}</div><div class="v" style="font-size:12px;word-break:break-word">${escHtml(v)}</div></div>`).join('');
  // Fotos georreferenciadas.
  if(p.fotos && p.fotos.length){
    html += `<label>Fotos (${p.fotos.length})</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">` +
      p.fotos.map((src,i)=>`<img src="${src}" data-foto="${i}" style="width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--cauce)">`).join('') + `</div>`;
  }
  abrirPanel('Punto · '+p.nom, html);
  document.querySelectorAll('[data-foto]').forEach(im=> im.onclick = ()=>{
    // Ver la foto a pantalla completa (overlay simple).
    const ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;align-items:center;justify-content:center';
    ov.innerHTML = `<img src="${p.fotos[im.dataset.foto]}" style="max-width:96vw;max-height:92vh;object-fit:contain">`;
    ov.onclick = ()=> ov.remove();
    document.body.appendChild(ov);
  });
}

/* =======================================================================
   SINCRONIZACIÓN A LA NUBE (Neon vía proxy propio — opción B)
   El proxy (Cloudflare Worker) guarda el secreto de Neon; la app solo conoce
   la URL del proxy y un token. Cola offline: sube lo que tenga sincronizado:false.
   ======================================================================= */
let syncCfg = { url:'', token:'', auto:true };
async function cargarSyncCfg(){ try{ const c = await dbGet('conf','syncCfg'); if(c) syncCfg = Object.assign(syncCfg, c); }catch(e){} }
async function guardarSyncCfg(){ await dbPut('conf', syncCfg, 'syncCfg'); }
// Formato del punto para enviar al proxy. Coincide con la tabla `puntos`
// que arma el Worker: id, proy, nombre, detalle, fecha, lat, lon, alt_orto, exac.
function puntoParaNube(p){
  return { id:p.id, proy:p.proy||null,
           nombre: p.nom || '',
           detalle: p.desc || '',
           fecha: new Date(p.t || Date.now()).toISOString(),
           lat: p.lat, lon: p.lon,
           alt_orto: p.altOrto!=null ? p.altOrto : null,
           exac: p.exac!=null ? p.exac : null };
}
// Formato del track para enviar al proxy: la geometría LineString viaja en `geojson`.
function trackParaNube(t){
  return { id:t.id, proy:t.proy||null,
           nombre: t.nom || '',
           detalle: t.desc || '',
           fecha: new Date(t.ini || t.t || Date.now()).toISOString(),
           distancia_m: t.dist!=null ? t.dist : null,
           n_puntos: (t.pts && t.pts.length) || 0,
           geojson: t.geojson || (t.pts ? { type:'Feature', geometry:{ type:'LineString', coordinates: t.pts.map(pt=>[pt.lon, pt.lat]) }, properties:{ nom:t.nom, dist:t.dist } } : null) };
}
// POST al proxy con validación ESTRICTA: solo consideramos éxito si HTTP 2xx
// y el JSON trae ok:true. Cualquier otra cosa (Worker viejo, error de red,
// error de Neon) es error → NO se marca como sincronizado.
async function postNube(ruta, body){
  if(!syncCfg.url) throw new Error('Falta la URL del proxy');
  const base = syncCfg.url.replace(/\/+$/,'');
  const r = await fetch(base + ruta, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+(syncCfg.token||'') },
    body: JSON.stringify(body)
  });
  const txt = await r.text();
  let data = {}; try{ data = JSON.parse(txt); }catch(e){}
  if(!r.ok){
    let hint = '';
    if(r.status===401) hint = ' — token incorrecto';
    else if(r.status===404) hint = ' — ¿hiciste Deploy del Worker nuevo?';
    else if(r.status>=500) hint = ' — error en Neon (revisá tabla)';
    throw new Error('HTTP '+r.status+hint+': '+(data.error||txt.slice(0,120)));
  }
  // Solo aceptamos éxito real. Un Worker viejo devuelve {success:true,...} sin
  // el campo ok → lo tratamos como error para no falsear "sincronizado".
  if(data.ok !== true){
    throw new Error('El proxy no confirmó éxito. Respuesta: '+txt.slice(0,180));
  }
  return data;
}
// GET del proxy con validación estricta (mismo criterio que postNube).
async function getNube(ruta){
  if(!syncCfg.url) throw new Error('Falta la URL del proxy');
  const base = syncCfg.url.replace(/\/+$/,'');
  const r = await fetch(base + ruta, {
    headers:{ 'Authorization':'Bearer '+(syncCfg.token||'') }
  });
  const txt = await r.text();
  let data = {}; try{ data = JSON.parse(txt); }catch(e){}
  if(!r.ok) throw new Error('HTTP '+r.status);
  if(data.ok !== true) throw new Error('El proxy no confirmó éxito');
  return data;
}
// Consulta la papelera del servidor y borra localmente los puntos/tracks
// que ya fueron eliminados en Neon (por el usuario en QGIS o en el SQL Editor).
// Así no vuelven a subirse y la app libera espacio.
async function purgarBorradosDesdeNube(){
  try{
    const data = await getNube('/borrados');
    const setP = new Set(data.puntos||[]);
    const setT = new Set(data.tracks||[]);
    let np = 0, nt = 0;
    for(const p of S.puntos.slice()){
      if(setP.has(p.id)){
        S.puntos = S.puntos.filter(x=> x.id !== p.id);
        try{ await dbDel('puntos', p.id); }catch(e){}
        np++;
      }
    }
    for(const t of (S.tracks||[]).slice()){
      if(setT.has(t.id)){
        S.tracks = S.tracks.filter(x=> x.id !== t.id);
        try{ await dbDel('tracks', t.id); }catch(e){}
        nt++;
      }
    }
    if(np || nt) dibujar();
    return { np, nt };
  }catch(e){ return { np:0, nt:0, error:e.message||String(e) }; }
}
let syncEnCurso = false;   // evita reentradas del auto-sync
async function sincronizarNube(manual){
  if(syncEnCurso){ if(manual) toast('Ya hay una sincronización en curso.'); return; }
  if(!syncCfg.url){ if(manual) toast('Configurá la URL del proxy primero.'); return; }
  if(!navigator.onLine){ if(manual) toast('Sin conexión; se subirá cuando haya internet.'); return; }
  syncEnCurso = true;
  if(manual) mostrarCargando('Preparando…', true);
  try{
    // 1) Purga: si algo se borró en Neon, sacarlo local primero.
    if(manual) actualizarProgreso(5, 'Consultando borrados…');
    const purga = await purgarBorradosDesdeNube();
    const puntosPend = S.puntos.filter(p=> p.sincronizado!==true);
    const tracksPend = (S.tracks||[]).filter(t=> t.sincronizado!==true);
    const puntosConFotosPend = S.puntos.filter(p=> p.fotos && p.fotos.length && p.fotosSincronizadas!==true);
    // Pasos totales para la barra de progreso.
    const totalFotos = puntosConFotosPend.reduce((s,p)=> s + Math.ceil(p.fotos.length/5), 0);
    const pasos = 1 /* purga */ + (puntosPend.length?1:0) + (tracksPend.length?1:0) + totalFotos;
    if(!puntosPend.length && !tracksPend.length && !puntosConFotosPend.length){
      if(manual){ ocultarCargando(); toast(purga.np||purga.nt ? 'Nada pendiente. Purgados '+purga.np+' punto(s) y '+purga.nt+' track(s).' : 'No hay nada pendiente de subir.'); }
      syncEnCurso = false; return;
    }
    let paso = 1, nP=0, nT=0, nF=0;
    const avance = (extraTxt)=>{
      if(!manual) return;
      const pct = 5 + Math.round((paso/pasos) * 95);
      actualizarProgreso(pct, extraTxt);
    };
    if(puntosPend.length){
      if(manual) actualizarProgreso(Math.round((paso/pasos)*95)+5, 'Subiendo '+puntosPend.length+' punto(s)…');
      const rr = await postNube('/puntos', { puntos: puntosPend.map(puntoParaNube) });
      for(const p of puntosPend){ p.sincronizado = true; await dbPut('puntos', p); }
      nP = rr.recibidos || puntosPend.length;
      paso++; avance();
    }
    if(tracksPend.length){
      if(manual) actualizarProgreso(Math.round((paso/pasos)*95)+5, 'Subiendo '+tracksPend.length+' track(s)…');
      const rr = await postNube('/tracks', { tracks: tracksPend.map(trackParaNube) });
      for(const t of tracksPend){ t.sincronizado = true; await dbPut('tracks', t); }
      nT = rr.recibidos || tracksPend.length;
      paso++; avance();
    }
    if(puntosConFotosPend.length){
      const LOTE = 5;
      for(const p of puntosConFotosPend){
        const paquete = [];
        for(let i=0;i<p.fotos.length;i++){
          const raw = String(p.fotos[i]||'');
          const b64 = raw.includes(',') ? raw.slice(raw.indexOf(',')+1) : raw;
          paquete.push({
            id: p.id+'_'+i, punto_id: p.id, ord: i, data_base64: b64,
            // Metadatos: cada foto queda ubicable en QGIS por la geometría
            // del punto donde se tomó.
            lat: p.lat, lon: p.lon, nombre_punto: p.nom,
            tomada_en: new Date(p.t || Date.now()).toISOString()
          });
        }
        for(let i=0;i<paquete.length;i+=LOTE){
          if(manual) actualizarProgreso(Math.round((paso/pasos)*95)+5,
            'Subiendo fotos ('+paso+'/'+pasos+')…');
          const rr = await postNube('/fotos', { fotos: paquete.slice(i, i+LOTE) });
          nF += rr.recibidas || 0;
          paso++;
        }
        p.fotosSincronizadas = true;
        await dbPut('puntos', p);
      }
    }
    if(manual) actualizarProgreso(100, 'Listo');
    if(manual) toast('Subidos '+nP+' punto(s), '+nT+' track(s) y '+nF+' foto(s).');
  }catch(e){
    if(manual) toast('No se pudo subir: '+(e.message||e));
  }finally{
    if(manual) setTimeout(ocultarCargando, 400);
    syncEnCurso = false;
  }
}
// Auto-sync que corre cada N segundos si está activo y hay internet.
// Además se dispara al hacer visible la app y al recuperar internet.
function programarAutoSync(){
  // Cada 60 segundos, si está activo el auto-sync, intentar subir pendientes.
  setInterval(()=>{
    if(syncCfg && syncCfg.auto && syncCfg.url && navigator.onLine && !syncEnCurso){
      const pend = S.puntos.filter(p=>p.sincronizado!==true).length
                 + (S.tracks||[]).filter(t=>t.sincronizado!==true).length
                 + S.puntos.filter(p=>p.fotos&&p.fotos.length&&p.fotosSincronizadas!==true).length;
      if(pend > 0) sincronizarNube(false);
    }
  }, 60000);
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && syncCfg && syncCfg.auto && syncCfg.url && navigator.onLine){
      setTimeout(()=> sincronizarNube(false), 2000);
    }
  });
}
// Se llama después de marcar un punto o guardar un track para intentar
// subirlo enseguida (silenciosa) si hay internet y auto-sync activado.
function disparoAutoSync(){
  if(syncCfg && syncCfg.auto && syncCfg.url && navigator.onLine && !syncEnCurso){
    setTimeout(()=> sincronizarNube(false), 500);
  }
}

  document.getElementById('syProbar').onclick = async ()=>{

      if(ok) diag = '✅ Conexión OK con el Worker nuevo';
      else if(r.status===401) diag = '⚠ El Worker responde 401 en /ping — todavía tenés el código VIEJO. Pegá el nuevo worker.js en Cloudflare y tocá "Deploy".';
      else if(r.status===404) diag = '⚠ 404 — la URL está mal o el Worker no está publicado. Verificá la URL en Cloudflare.';
      else if(j.success!==undefined && j.ok===undefined) diag = '⚠ El Worker responde en formato viejo (success). Necesitás pegar el nuevo worker.js y hacer Deploy.';
      else diag = 'Respondió HTTP '+r.status;
    }
    catch(e){ diag = '❌ No respondió: '+(e.message||e); }
    finally{ ocultarCargando(); }
    // Panel con el detalle completo para diagnosticar.
    abrirPanel('Prueba de conexión', `
      <div class="res"><div class="k">Resultado</div><div class="v">${escHtml(diag)}</div></div>
      <div class="res"><div class="k">HTTP status</div><div class="v">${escHtml(String(st))}</div></div>
      <div class="res"><div class="k">Respuesta cruda</div><div class="v" style="font-size:11px;white-space:pre-wrap;word-break:break-word">${escHtml(txt.slice(0,600) || '(vacío)')}</div></div>
      <div class="nota">Si dice que el Worker es viejo o responde 401 en /ping: en Cloudflare → Workers & Pages → tu worker → <b>Edit code</b>, pegá el contenido nuevo de worker.js, y tocá <b>Deploy</b> (botón azul arriba a la derecha). Después probá otra vez.</div>
      <button class="ancho" id="pcVolver">Volver</button>`);
    document.getElementById('pcVolver').onclick = panelSync;
  };
  document.getElementById('sySubir').onclick = async ()=>{ await sincronizarNube(true); panelSync(); };
  document.getElementById('syReset').onclick = async ()=>{
    if(!confirm('¿Marcar TODOS los puntos, tracks y fotos como pendientes de subir? La próxima sincronización los mandará de nuevo.')) return;
    for(const p of S.puntos){ p.sincronizado = false; p.fotosSincronizadas = false; await dbPut('puntos', p); }
    for(const t of (S.tracks||[])){ t.sincronizado = false; await dbPut('tracks', t); }
    toast('Todo marcado como pendiente.'); panelSync();
  };
}

// Reduce una imagen a JPEG ~1024px. Opcionalmente le imprime un watermark
// con nombre del punto, coord WGS84, coord CRTM05 y fecha/hora (para que
// la foto sea auto-documentada aunque se saque de la base de datos).
function comprimirImagen(file, info){
  return new Promise((resolve)=>{
    const img = new Image();
    const rd = new FileReader();
    rd.onload = ()=>{ img.onload = ()=>{
      const max = 1024; let w = img.width, hh = img.height;
      if(w>hh && w>max){ hh = hh*max/w; w = max; } else if(hh>max){ w = w*max/hh; hh = max; }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = hh;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, hh);
      if(info) pintarWatermark(ctx, w, hh, info);
      resolve(cv.toDataURL('image/jpeg', 0.72));
    }; img.src = rd.result; };
    rd.readAsDataURL(file);
  });
}
// Re-abre una imagen ya guardada (dataURL) y le imprime un watermark.
// Se usa al momento de GUARDAR el punto (así el nombre final queda estampado).
function aplicarWatermarkAFoto(dataUrl, info){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const cv = document.createElement('canvas');
      cv.width = img.width; cv.height = img.height;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0);
      pintarWatermark(ctx, img.width, img.height, info);
      resolve(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}
function pintarWatermark(ctx, w, h, info){
  const lines = [];
  if(info.nombre) lines.push('📍 ' + info.nombre);
  if(info.lat!=null && info.lon!=null) lines.push('WGS84  ' + Number(info.lat).toFixed(6) + ', ' + Number(info.lon).toFixed(6));
  if(info.crtmE!=null && info.crtmN!=null) lines.push('CRTM05  E ' + Math.round(info.crtmE) + '   N ' + Math.round(info.crtmN));
  if(info.fecha) lines.push(info.fecha);
  if(!lines.length) return;
  const escala = Math.max(1, w/1024);
  const fs = Math.round(14 * escala);
  const lh = Math.round(fs * 1.35);
  const pad = Math.round(10 * escala);
  const boxH = pad*2 + lh*lines.length;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.62)';
  ctx.fillRect(0, h - boxH, w, boxH);
  // Borde superior amarillo sutil.
  ctx.fillStyle = 'rgba(242,201,76,.9)';
  ctx.fillRect(0, h - boxH, w, Math.max(1, Math.round(escala)));
  ctx.font = '600 ' + fs + 'px system-ui, sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  for(let i=0;i<lines.length;i++){
    ctx.fillText(lines[i], pad, h - boxH + pad + i*lh);
  }
  ctx.restore();
}
// Lee los valores de la plantilla elegida desde el panel Marcar punto.
async function recolectarDatosPlantilla(id){
  id = id || plantillaActiva;
  const datos = {}, fotos = [];
  if(!id) return { datos, fotos };
  const t = plantillas.find(x=>x.id===id); if(!t) return { datos, fotos };
  for(let i=0;i<t.campos.length;i++){
    const c = t.campos[i];
    if(c.tipo==='foto'){
      const inp = document.querySelector('[data-pf="'+i+'"]');
      if(inp && inp.files){ for(const file of inp.files){ try{ fotos.push(await comprimirImagen(file)); }catch(e){} } }
    } else {
      const el = document.querySelector('[data-pd="'+i+'"]');
      const v = el ? el.value.trim() : '';
      if(c.req && !v){ toast('Falta el campo obligatorio: '+c.clave); return null; }
      if(v) datos[c.clave || ('campo'+i)] = v;
    }
  }
  return { datos, fotos };
}

let alertas = [];   // [{id, nombre, lat, lon, radio, activa, _dentro}]

function chequearAlertas(pos){
  if(!alertas.length || !pos || !pos.coords) return;
  const c = pos.coords;
  for(const a of alertas){
    if(!a.activa){ a._dentro = false; continue; }
    const d = distM(c.latitude, c.longitude, a.lat, a.lon);
    const dentro = d <= (a.radio||50);
    if(dentro && !a._dentro){
      // Entró al radio: avisar una sola vez hasta que salga y vuelva.
      if(navigator.vibrate){ try{ navigator.vibrate([120,60,120]); }catch(e){} }
      toast('📍 '+(a.nombre||'Alerta')+' · a '+d.toFixed(0)+' m');
    }
    a._dentro = dentro;
  }
}

function lon2merc(lon){ return lon*MERC_MAX/180; }
function lat2merc(lat){ const y = Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180); return y*MERC_MAX/180; }
function wmsFeatureInfoUrl(layer, w, h, iPx, jPx, bbox){
  const v = layer.version || '1.3.0';
  const base = layer.url.split('?')[0];
  const p = new URLSearchParams({
    SERVICE:'WMS', VERSION:v, REQUEST:'GetFeatureInfo',
    LAYERS: layer.capa||'', QUERY_LAYERS: layer.capa||'', STYLES:'',
    FORMAT: layer.format||'image/png', INFO_FORMAT:'application/json',
    FEATURE_COUNT:'5', WIDTH:String(w), HEIGHT:String(h)
  });
  const crs = (v==='1.3.0') ? 'CRS=EPSG:3857' : 'SRS=EPSG:3857';
  const ij  = (v==='1.3.0') ? `I=${iPx}&J=${jPx}` : `X=${iPx}&Y=${jPx}`;
  return `${base}?${p.toString()}&${crs}&BBOX=${bbox}&${ij}`;
}
async function consultarWMS(capa, px, py){
  if(!ultimoT){ return; }
  mostrarCargando('Consultando capa…');
  try{
    const t = ultimoT;
    const oLon = px2lon(t.x0, t.zi), eLon = px2lon(t.x0 + W/t.esc, t.zi);
    const nLat = px2lat(t.y0, t.zi), sLat = px2lat(t.y0 + H/t.esc, t.zi);
    const bbox = `${lon2merc(oLon)},${lat2merc(sLat)},${lon2merc(eLon)},${lat2merc(nLat)}`;
    const url = wmsFeatureInfoUrl(capa, Math.round(W), Math.round(H), Math.round(px), Math.round(py), bbox);
    const r = await httpGet(url);
    const txt = bytesATexto(r.bytes);
    let gj = null; try{ gj = JSON.parse(txt); }catch(e){}
    if(gj && gj.features && gj.features.length){
      mostrarAtributos(capa, gj.features);
    } else {
      const limpio = txt.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      if(limpio && limpio.length > 2 && !/ServiceException|error/i.test(limpio.slice(0,80))){
        abrirPanel('Info · '+capa.nombre, `<div class="res"><div class="v" style="font-size:12px;white-space:pre-wrap;word-break:break-word">${escHtml(limpio.slice(0,1500))}</div></div>`);
      } else {
        toast('Sin datos en ese punto (o el servidor no soporta consulta).');
      }
    }
  }catch(e){ toast('No se pudo consultar la capa.'); }
  finally{ ocultarCargando(); }
}
function escHtml(s){ return String(s==null?'':s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function fmtVal(v){ if(v==null) return ''; if(typeof v==='object') return JSON.stringify(v); return String(v); }
function mostrarAtributos(capa, feats){
  // Preferir un elemento que tenga atributos.
  const f = feats.find(x=> x && x.properties && Object.keys(x.properties).length) || feats[0];
  const props = (f && f.properties) || {};
  const claves = Object.keys(props);
  let filas = claves.map(k=>`<div class="res"><div class="k">${escHtml(k)}</div><div class="v" style="font-size:12px;word-break:break-word">${escHtml(fmtVal(props[k]))}</div></div>`).join('');
  // Siempre mostrar la geometría, aunque no haya atributos.
  const g = f && f.geometry;
  if(g){
    let coordTxt = '';
    if(g.type==='Point' && g.coordinates) coordTxt = g.coordinates[1].toFixed(6)+', '+g.coordinates[0].toFixed(6);
    filas += `<div class="res"><div class="k">Geometría</div><div class="v" style="font-size:12px">${escHtml(g.type)}${coordTxt?' · '+coordTxt:''}</div></div>`;
  }
  if(!claves.length) filas = `<div class="nota">Este elemento no trae atributos; abajo su geometría.</div>` + filas;
  const conTabla = capa.tipo!=='big' && capa.tipo!=='wms';
  abrirPanel('Atributos · '+capa.nombre, `
    ${feats.length>1?`<div class="nota">${feats.length} elementos aquí; se muestra uno.</div>`:''}
    ${filas}
    ${conTabla?`<button class="ancho borde" id="atTabla">Ver tabla completa de la capa</button>`:''}
  `);
  if(conTabla){ const bt=document.getElementById('atTabla'); if(bt) bt.onclick = ()=> tablaAtributos(capa.id); }
}
function tablaAtributos(capaId){
  const c = S.capas.find(x=>x.id===capaId); if(!c||!c.geojson) return;
  const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : c.geojson.type==='Feature' ? [c.geojson] : [];
  const claves = [];
  for(const f of feats){ const p=f.properties||{}; for(const k of Object.keys(p)) if(!claves.includes(k)) claves.push(k); if(claves.length>=8) break; }
  const rows = feats.slice(0,500).map((f,i)=>{ const p=f.properties||{}; return `<tr><td>${i+1}</td>${claves.map(k=>`<td>${escHtml(fmtVal(p[k]))}</td>`).join('')}</tr>`; }).join('');
  abrirPanel('Tabla · '+c.nombre, `
    <div style="overflow:auto;max-height:70vh"><table class="atbl"><thead><tr><th>#</th>${claves.map(k=>`<th>${escHtml(k)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
    <div class="nota">${feats.length} elementos${feats.length>500?' (mostrando 500)':''}. Tocá un elemento en el mapa para ver todos sus atributos.</div>
  `);
}
async function toggleConsultable(id){ const c=S.capas.find(x=>x.id===id); if(!c) return; c.consultable = c.consultable===false; await dbPut('capas',c); panelCapas(); }
// Campos disponibles de una capa vectorial (unión de propiedades).
function camposDeCapa(c){
  const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : c.geojson.type==='Feature' ? [c.geojson] : [];
  const claves = [];
  for(const f of feats){ const p=f&&f.properties||{}; for(const k of Object.keys(p)) if(!claves.includes(k)) claves.push(k); if(claves.length>=40) break; }
  return claves;
}

function valoresDistintos(c, campo){
  const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : [c.geojson];
  const vals = [];
  for(const f of feats){ const v = String((f.properties||{})[campo]); if(!vals.includes(v)) vals.push(v); if(vals.length>=60) break; }
  return vals;
}

// Devuelve las capas agrupadas por c.grupo (o "Sin grupo"), preservando el orden.
function capasPorGrupo(){
  const grupos = new Map();
  for(const c of S.capas){
    const g = c.grupo || 'Sin grupo';
    if(!grupos.has(g)) grupos.set(g, []);
    grupos.get(g).push(c);
  }
  return grupos;
}
// Estado de colapso de cada grupo en el panel (se conserva mientras el panel viva).
let grupoColapsado = {};
// Lista de nombres de grupos existentes (para el selector).
function gruposExistentes(){
  const set = new Set();
  for(const c of S.capas) if(c.grupo) set.add(c.grupo);
  return [...set].sort();
}

// Renombra un grupo completo: cambia c.grupo en todas las capas que lo tengan.
async function renombrarGrupo(nombreActual){
  const nuevo = prompt('Nuevo nombre del grupo (vacío para eliminar el grupo y dejar las capas sueltas):', nombreActual);
  if(nuevo===null) return;
  const n = nuevo.trim();
  let cambiadas = 0;
  for(const c of S.capas){
    if((c.grupo||'') === nombreActual){
      c.grupo = n || null;
      await dbPut('capas', c);
      cambiadas++;
    }
  }
  // Mantener el estado de colapso bajo el nuevo nombre.
  if(n){ grupoColapsado[n] = grupoColapsado[nombreActual]; }
  delete grupoColapsado[nombreActual];
  toast(cambiadas+' capa(s) actualizadas.');
  panelCapas();
}
// Mueve una capa arriba/abajo dentro de S.capas y persiste.
// Optimizado: solo persiste las 2 capas afectadas por el swap (rápido con
// muchas capas), y reasigna el orden en memoria a las demás.
async function moverCapa(id, dir){
  const i = S.capas.findIndex(x=>x.id===id); if(i<0) return;
  const j = i + dir;
  if(j<0 || j>=S.capas.length) return;
  const tmp = S.capas[i]; S.capas[i] = S.capas[j]; S.capas[j] = tmp;
  // Renumerar todas en memoria, pero solo persistir las 2 que cambiaron.
  for(let k=0;k<S.capas.length;k++) S.capas[k].orden = k;
  await dbPut('capas', S.capas[i]);
  await dbPut('capas', S.capas[j]);
  dibujar(); panelCapas();
}

        <button class="ancho" id="capAdd">Descargar y agregar</button>`;
      document.getElementById('capAdd').onclick = ()=> agregarCapaURL(document.getElementById('capNom').value.trim(), document.getElementById('capUrl').value.trim());
    } else if(sel.value==='wfs'){
      cf.innerHTML = `<label>URL del servicio WFS</label><input id="capUrl" placeholder="https://.../wfs o /ows">
        <button class="ancho borde" id="capScan">Escanear capas</button>
        <div id="capLista"></div>`;
      document.getElementById('capScan').onclick = ()=> escanearYListar('wfs');
    } else {
      cf.innerHTML = `<label>URL del servicio WMS</label><input id="capUrl" placeholder="https://.../wms o /ows">
        <button class="ancho borde" id="capScan">Escanear capas</button>
        <div id="capLista"></div>`;
      document.getElementById('capScan').onclick = ()=> escanearYListar('wms');
    }
  };
  sel.onchange = render; render();
}
async function escanearYListar(tipo){
  const url = document.getElementById('capUrl').value.trim();
  if(!url){ toast('Pegá la URL del servicio.'); return; }
  const cont = document.getElementById('capLista');
  cont.innerHTML = '<div class="k" style="margin-top:8px"><span class="spin" style="width:14px;height:14px;border-width:2px"></span> Escaneando el servicio…</div>';
  mostrarCargando('Escaneando '+tipo.toUpperCase()+'…');
  try{
    const capas = tipo==='wms' ? await escanearWMS(url) : await escanearWFS(url);
    if(!capas.length){ cont.innerHTML = '<div class="nota" style="border-color:var(--sangre)">No se encontraron capas. ¿La URL es del servicio '+tipo.toUpperCase()+'?</div>'; return; }
    cont.innerHTML = `<label>Capas disponibles (${capas.length})</label>
      <select id="capSel">${capas.map(c=>`<option value="${c.name.replace(/"/g,'&quot;')}">${(c.title||c.name).slice(0,60)}</option>`).join('')}</select>
      <button class="ancho" id="capAddSel">Agregar capa seleccionada</button>`;
    document.getElementById('capAddSel').onclick = ()=>{
      const name = document.getElementById('capSel').value;
      const title = document.getElementById('capSel').selectedOptions[0].textContent;
      if(tipo==='wms') agregarCapaWMS(title, url, name, '1.3.0');
      else agregarCapaWFS(title, url, name);
    };
  }catch(e){
    cont.innerHTML = '<div class="nota" style="border-color:var(--sangre)">No se pudo escanear: '+((e&&e.message)||e)+'. Verificá la URL del servicio.</div>';
  }finally{ ocultarCargando(); }
}

/* --- diagnosticos gnss (F0) --- */
// Constelaciones GnssStatus: 1=GPS 2=SBAS 3=GLONASS 4=QZSS 5=BEIDOU 6=GALILEO 7=IRNSS
const CONSTEL = {
  1:{n:'GPS',c:'#4FD1C5'}, 2:{n:'SBAS',c:'#8899AA'}, 3:{n:'GLONASS',c:'#C75146'},
  4:{n:'QZSS',c:'#B07CC6'}, 5:{n:'BeiDou',c:'#6FCF6F'}, 6:{n:'Galileo',c:'#E0A458'},
  7:{n:'IRNSS',c:'#E06AA0'}, 0:{n:'?',c:'#6E8B86'}
};
// Clasifica la frecuencia portadora (Hz) en banda GNSS.
function bandDe(freqHz){
  if(!freqHz) return null;
  const m = freqHz/1e6;
  if(Math.abs(m-1176.45)<10) return 'L5';   // GPS L5 / Galileo E5a / BeiDou B2a
  if(Math.abs(m-1207.14)<8)  return 'E5b';  // Galileo E5b / BeiDou B2b
  if(Math.abs(m-1202.025)<5) return 'L3';   // GLONASS L3
  if(Math.abs(m-1227.60)<10) return 'L2';   // GPS L2C
  if(Math.abs(m-1575.42)<10) return 'L1';   // GPS L1 / Galileo E1 / BeiDou B1C
  if(Math.abs(m-1561.098)<5) return 'B1I';  // BeiDou B1I
  if(m>1592 && m<1615)       return 'G1';   // GLONASS L1 (FDMA)
  if(m>1240 && m<1256)       return 'G2';   // GLONASS L2 (FDMA)
  return m.toFixed(0);
}
let gnssState = { satellites: [], location: null, dop: {}, gga: {}, listening: false };
let diagSamples = [];
let diagInterval = null;
let diagCleanup = null;

async function panelDiagnosticos(){
  abrirPanel('Diagnóstico GNSS (Fase 0)', `
    <div id="gnssStatus">
      <div class="grid2">
        <div class="res"><div class="k">Satélites totales</div><div class="v" id="gnssTotal">—</div></div>
        <div class="res"><div class="k">En fix</div><div class="v" id="gnssUsed">—</div></div>
        <div class="res"><div class="k">L5 detectados</div><div class="v" id="gnssL5">—</div></div>
        <div class="res"><div class="k">Proveedor</div><div class="v" id="gnssProv" style="font-size:11px">—</div></div>
        <div class="res"><div class="k">Exactitud horiz.</div><div class="v" id="gnssAccuracy">—</div></div>
        <div class="res"><div class="k">Exactitud vert.</div><div class="v" id="gnssVAccuracy">—</div></div>
        <div class="res"><div class="k">HDOP</div><div class="v" id="gnssHdop">—</div></div>
        <div class="res"><div class="k">VDOP</div><div class="v" id="gnssVdop">—</div></div>
        <div class="res"><div class="k">PDOP</div><div class="v" id="gnssPdop">—</div></div>
        <div class="res"><div class="k">Sep. geoide</div><div class="v" id="gnssGeoid">—</div></div>
      </div>
      <div class="res" style="margin-top:8px"><div class="k">Bandas de frecuencia vistas</div><div class="v" id="gnssBandas" style="font-size:12px">—</div></div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:10px">
        <div class="k" style="flex:1">Muestras: <span id="diagCount">0</span></div>
        <button class="mini verde" id="diagExport">Exportar CSV</button>
      </div>
      <div id="gnssSatList" style="margin-top:12px;font-size:11px;max-height:260px;overflow-y:auto;border:1px solid var(--cauce);border-radius:6px;padding:8px;"></div>
      <div class="nota">HDOP/VDOP vienen de NMEA (sentencia GSA). Si quedan en "—", tu chip no emite NMEA a la app; la exactitud en metros sí es fiable. Parate quieto ~1 min y exportá el CSV para comparar contra el Garmin.</div>
    </div>
  `);
  diagSamples = [];
  document.getElementById('diagExport').onclick = exportarDiagCSV;

  if(pluginGnss()){
    try {
      const Gnss = pluginGnss();
      diagAbierto = true;
      await gnssStart();               // compartido con GPS puro del app
      gnssState.listening = true;
      const hSat = await Gnss.addListener('gnssStatus', (d)=> updateGnssUI(d.data));
      const hLoc = await Gnss.addListener('location',   (d)=> updateLocationUI(d.data));
      const hDop = await Gnss.addListener('dop',        (d)=> updateDopUI(d.data));
      const hGga = await Gnss.addListener('gga',        (d)=> updateGgaUI(d.data));
      // muestreo 1 Hz para el CSV
      diagInterval = setInterval(tomarMuestraDiag, 1000);
      // limpieza al cerrar el panel
      diagCleanup = async ()=>{
        if(diagInterval){ clearInterval(diagInterval); diagInterval = null; }
        try{ hSat && hSat.remove(); hLoc && hLoc.remove(); hDop && hDop.remove(); hGga && hGga.remove(); }catch(e){}
        diagAbierto = false;
        await gnssStopSiOcioso();       // solo detiene si el app no usa GPS puro
        gnssState.listening = false;
      };
    } catch(e){
      console.log('GNSS plugin error:', e);
      document.getElementById('gnssStatus').innerHTML = '<div class="nota" style="border-color:var(--sangre);">Plugin GNSS no disponible. Requiere API 24+ (Android 7+) y permiso de ubicación.</div>';
    }
  } else {
    document.getElementById('gnssStatus').innerHTML = '<div class="nota" style="border-color:var(--sangre);">Capacitor no disponible. Ejecutá desde el APK, no desde el navegador.</div>';
  }
}
function updateGnssUI(data){
  gnssState.satellites = data.satellites || [];
  const total = data.count || 0;
  const used = data.usedInFix || 0;
  // Conteo de bandas por frecuencia portadora.
  const tally = {};
  for(const s of gnssState.satellites){
    const b = bandDe(s.carrierFreq);
    if(b) tally[b] = (tally[b]||0) + 1;
  }
  const l5count = tally['L5'] || 0;
  document.getElementById('gnssTotal').textContent = total;
  document.getElementById('gnssUsed').textContent = used;
  document.getElementById('gnssL5').textContent = l5count;
  // Mostrar bandas ordenadas por cantidad, resaltando si hay L5.
  const orden = Object.keys(tally).sort((a,b)=> tally[b]-tally[a]);
  const bandasTxt = orden.length
    ? orden.map(b=> `${b}×${tally[b]}`).join('  ·  ')
    : 'sin datos de frecuencia';
  const bEl = document.getElementById('gnssBandas');
  if(bEl){ bEl.textContent = bandasTxt; bEl.style.color = l5count>0 ? 'var(--fix)' : 'var(--niebla)'; }

  // ordenar por C/N0 desc para leer los más fuertes primero
  const sats = gnssState.satellites.slice().sort((a,b)=> (b.cn0||0)-(a.cn0||0));
  let satHtml = '';
  for(const s of sats){
    const con = CONSTEL[s.constellation] || CONSTEL[0];
    const cn0 = s.cn0 || 0;
    const w = Math.max(2, Math.min(100, cn0*2)); // 0-50 dBHz -> 0-100%
    const freq = s.carrierFreq ? `${(s.carrierFreq/1e6).toFixed(0)}` : '';
    const l5 = s.isL5 ? ' L5' : '';
    const fixMark = s.usedInFix ? '●' : '○';
    satHtml += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-family:var(--mono);font-size:10px">
      <span style="color:${con.c};width:14px">${fixMark}</span>
      <span style="width:58px">${con.n.slice(0,3)}${String(s.svid).padStart(2,'0')}</span>
      <span style="flex:1;background:var(--cauce);height:8px;border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${w}%;background:${con.c}"></i></span>
      <span style="width:34px;text-align:right">${cn0?cn0.toFixed(0):'—'}</span>
      <span style="width:30px;text-align:right;color:var(--musgo)">${freq}${l5}</span>
    </div>`;
  }
  document.getElementById('gnssSatList').innerHTML = satHtml || '<div style="color:var(--musgo);">Buscando satélites… (el primer fix GPS puro puede tardar 30-60s)</div>';
}
function updateLocationUI(data){
  gnssState.location = data;
  document.getElementById('gnssAccuracy').textContent = data.accuracy!=null ? `${data.accuracy.toFixed(1)}m` : '—';
  document.getElementById('gnssVAccuracy').textContent = data.verticalAccuracy ? `${data.verticalAccuracy.toFixed(1)}m` : '—';
  document.getElementById('gnssProv').textContent = data.provider || '—';
}
function updateDopUI(d){
  gnssState.dop = d;
  if(d.hdop!=null) document.getElementById('gnssHdop').textContent = d.hdop.toFixed(2);
  if(d.vdop!=null) document.getElementById('gnssVdop').textContent = d.vdop.toFixed(2);
  if(d.pdop!=null) document.getElementById('gnssPdop').textContent = d.pdop.toFixed(2);
}
function updateGgaUI(d){
  gnssState.gga = d;
  if(d.geoidSeparation!=null) document.getElementById('gnssGeoid').textContent = d.geoidSeparation.toFixed(1)+'m';
  if(d.hdop!=null && document.getElementById('gnssHdop').textContent==='—') document.getElementById('gnssHdop').textContent = d.hdop.toFixed(2);
}
function tomarMuestraDiag(){
  const loc = gnssState.location; if(!loc) return;
  const sats = gnssState.satellites || [];
  const cn0s = sats.filter(s=> s.cn0>0).map(s=> s.cn0);
  const tally = {};
  for(const s of sats){ const b = bandDe(s.carrierFreq); if(b) tally[b]=(tally[b]||0)+1; }
  const bandas = Object.keys(tally).sort((a,b)=> tally[b]-tally[a]).map(b=> `${b}x${tally[b]}`).join(' ');
  const row = {
    t: new Date().toISOString(),
    lat: loc.latitude, lon: loc.longitude,
    alt: loc.altitude, accH: loc.accuracy, accV: loc.verticalAccuracy,
    total: sats.length, usados: sats.filter(s=> s.usedInFix).length,
    l5: tally['L5'] || 0,
    cn0min: cn0s.length? Math.min(...cn0s):null, cn0max: cn0s.length? Math.max(...cn0s):null,
    hdop: gnssState.dop.hdop, vdop: gnssState.dop.vdop, pdop: gnssState.dop.pdop,
    geoid: gnssState.gga.geoidSeparation, prov: loc.provider, bandas: bandas
  };
  diagSamples.push(row);
  document.getElementById('diagCount').textContent = diagSamples.length;
}
function exportarDiagCSV(){
  if(!diagSamples.length){ toast('Sin muestras todavía. Esperá unos segundos.'); return; }
  const enc = ['timestamp','lat','lon','altura_elip_m','exac_h_m','exac_v_m','sats_total','sats_usados','l5','cn0_min','cn0_max','hdop','vdop','pdop','geoide_m','proveedor','bandas'];
  const num = (v,d=6)=> v==null?'':(typeof v==='number'? v.toFixed(d):v);
  const filas = diagSamples.map(r=> [
    r.t, num(r.lat,7), num(r.lon,7), num(r.alt,1), num(r.accH,1), num(r.accV,1),
    r.total??'', r.usados??'', r.l5??'', num(r.cn0min,1), num(r.cn0max,1),
    num(r.hdop,2), num(r.vdop,2), num(r.pdop,2), num(r.geoid,1), r.prov||'', r.bandas||''
  ].join(','));
  bajar('diagnostico_gnss_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.csv',
        enc.join(',')+'\n'+filas.join('\n'), 'text/csv');
}

/* =======================================================================
   9. ARRANQUE
   ======================================================================= */
(async ()=>{
  await abrirDB();
  await migrarAGeoJSON();
  S.modo = await dbGet('conf','modo') || 'geo';
  S.capa = await dbGet('conf','capa') || 'sat';
  const filtGuardados = await dbGet('conf','filtros');
  if(filtGuardados) S.filtros = Object.assign(S.filtros, filtGuardados);
  try{
    S.capas = await dbAll('capas') || [];
    // Respetar orden manual guardado (c.orden). Capas sin orden van al final.
    S.capas.sort((a,b)=> ((a.orden??1e9) - (b.orden??1e9)));
  }catch(e){ S.capas = []; }
  await cargarPlantillas();
  await cargarAlertas();
  await cargarSyncCfg();
  // Última ubicación conocida: evita arrancar en una zona random (Quepos por defecto).
  const uc = await dbGet('conf','ultimoCentro');
  if(uc && uc.lat!=null){ S.centro.lat = uc.lat; S.centro.lon = uc.lon; if(uc.zoom) S.zoom = uc.zoom; }
  document.querySelectorAll('#modo button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.m===S.modo));
  document.getElementById('btnCapa').textContent = CAPAS[S.capa].nom;
  document.getElementById('coordSys').textContent = PROY[S.modo].nom;
  const pa = await dbGet('conf','proyActivo');
  if(pa && await dbGet('proyectos', pa)) await cargarProyecto(pa);
  // Recuperar track en progreso si la app se cerró/mató mientras grababa.
  try{
    const grabId = await dbGet('conf','trackEnCurso');
    if(grabId){
      const t = await dbGet('tracks', grabId);
      if(t && t.pts && t.pts.length){
        S.grabando = t;
        const b = document.getElementById('btnTrack');
        if(b){ b.dataset.on='1'; b.textContent='Detener'; }
        toast(`Track recuperado: ${t.pts.length} puntos · ${t.dist.toFixed(0)} m`);
        // Reactivar servicio de grabación en segundo plano.
        try{ await mantenerPantalla(); }catch(e){}
        try{ await iniciarServicioTrack(); }catch(e){}
      } else {
        await dbDel('conf','trackEnCurso');
      }
    }
  }catch(e){ console.log('No pude recuperar track en curso:', e); }
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
  // Mostrar "buscando GPS" hasta el primer fix.
  document.getElementById('cargaGps').classList.add('on');
  document.getElementById('cargaGpsCerrar').onclick = ()=> document.getElementById('cargaGps').classList.remove('on');
  medir(); dibujarAnillo(null);
  window.addEventListener('resize', medir);
  window.addEventListener('online',  ()=>{ dibujar(); if(syncCfg.auto) sincronizarNube(false); });
  window.addEventListener('offline', ()=>{ document.getElementById('estadoRed').textContent = 'SIN RED · MAPA CACHÉ'; });
  // Capacitor: pedir permiso de ubicación nativo ANTES de arrancar la fuente
  // (el GPS puro nativo también requiere ACCESS_FINE_LOCATION).
  try{
    const Geo = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
    if(Geo) await Geo.requestPermissions();
  }catch(e){}
  await arrancarGPS();
  // Buscar actualización en silencio al arrancar (si hay red).
  pintarBadgeActualizacion();
  if(navigator.onLine){ setTimeout(()=> buscarActualizacion(false), 4000); }
  // Re-chequear cada 30 min por si el user deja la app abierta.
  setInterval(()=>{ if(navigator.onLine) buscarActualizacion(false); }, 30*60*1000);
  // Subir a la nube lo pendiente al arrancar (si está configurado y en auto).
  if(navigator.onLine && syncCfg.auto && syncCfg.url){ setTimeout(()=> sincronizarNube(false), 6000); }
  // Auto-sync periódico + al volver de background + al recuperar internet.
  programarAutoSync();
})();
