    <div class="grid2">
      <div><label id="cvLA">Latitud</label><input id="cvA" inputmode="decimal" placeholder="9.431800"></div>
      <div><label id="cvLB">Longitud</label><input id="cvB" inputmode="decimal" placeholder="-84.162000"></div>
    </div>
    <button class="ancho" id="cvOk">Convertir</button>
    <button class="ancho borde" id="cvAqui">Usar mi posición actual</button>
    <div id="cvRes"></div>
  `);
  const sel = document.getElementById('cvIn');
  sel.onchange = ()=>{
    const g = sel.value==='geo';
    document.getElementById('cvLA').textContent = g ? 'Latitud' : 'Este (E)';
    document.getElementById('cvLB').textContent = g ? 'Longitud' : 'Norte (N)';
    document.getElementById('cvA').placeholder = g ? '9.431800' : '486123.45';
    document.getElementById('cvB').placeholder = g ? '-84.162000' : '1042876.10';
  };
  const correr = ()=>{
    const a = parseFloat(document.getElementById('cvA').value);
    const b = parseFloat(document.getElementById('cvB').value);
    if(isNaN(a)||isNaN(b)){ toast('Faltan números válidos.'); return; }
    const m = sel.value;
    const w = m==='geo' ? {lat:a, lon:b} : haciaWgs(a, b, m);
    if(Math.abs(w.lat)>90 || w.lon<-180 || w.lon>180){ toast('Esas coordenadas no caen en la Tierra. Revisá el orden E/N.'); return; }
    const c05 = tmFwd(w.lat, w.lon, CRTM05);
    const o = wgsToOco(w.lat, w.lon);
    const ln = lccFwd(o.lat, o.lon, LAM_N), ls = lccFwd(o.lat, o.lon, LAM_S);
    const fuera = w.lat<5 || w.lat>12 || w.lon<-88 || w.lon>-81;
    document.getElementById('cvRes').innerHTML = `
      <div class="res"><div class="k">Geográficas · WGS84</div><div class="v">${w.lat.toFixed(7)}, ${w.lon.toFixed(7)}<br>${gms(w.lat,true)}<br>${gms(w.lon,false)}</div></div>
      <div class="res"><div class="k">CRTM05 · EPSG:5367</div><div class="v">E ${c05.e.toFixed(3)}<br>N ${c05.n.toFixed(3)}</div></div>
      <div class="res"><div class="k">Lambert Norte · EPSG:5456</div><div class="v">E ${ln.e.toFixed(3)}<br>N ${ln.n.toFixed(3)}</div></div>
      <div class="res"><div class="k">Lambert Sur · EPSG:5457</div><div class="v">E ${ls.e.toFixed(3)}<br>N ${ls.n.toFixed(3)}</div></div>
      ${fuera ? '<div class="nota">Este punto queda fuera de Costa Rica. Las proyecciones se calculan igual, pero los valores no tienen sentido práctico.</div>' : ''}
      <div class="nota">Lambert usa Helmert de 7 parámetros (Ocotepeque→CR05, EPSG:6890), igual que QGIS por defecto. El método oficial del IGN pasa por polinomios CRTM90→CRTM98→CRTM05 y da un resultado distinto, típicamente de 1 a varios metros. Para topografía legal, verificá contra la herramienta oficial.</div>
    `;
  };
  document.getElementById('cvOk').onclick = correr;
  document.getElementById('cvAqui').onclick = ()=>{
    if(!S.fix){ toast('Sin posición todavía.'); return; }
    sel.value = 'geo'; sel.onchange();
    document.getElementById('cvA').value = S.fix.coords.latitude.toFixed(7);
    document.getElementById('cvB').value = S.fix.coords.longitude.toFixed(7);
    correr();
  };
}

/* --- offline (por zonas / parches) --- */
// Recuadro geográfico de la vista actual.
function boundsVista(){
  return {
    w: px2lon(lon2px(S.centro.lon,S.zoom) - W/2, S.zoom),
    e: px2lon(lon2px(S.centro.lon,S.zoom) + W/2, S.zoom),
    n: px2lat(lat2px(S.centro.lat,S.zoom) - H/2, S.zoom),
    s: px2lat(lat2px(S.centro.lat,S.zoom) + H/2, S.zoom)
  };
}
// Lista de tiles [z,x,y] que cubre un recuadro entre zMin y zMax.
function tilesDeBounds(b, zMin, zMax){
  const lista = [];
  for(let z=zMin; z<=zMax; z++){
    let x0 = Math.floor(lon2px(b.w,z)/256), x1 = Math.floor(lon2px(b.e,z)/256);
    let y0 = Math.floor(lat2px(b.n,z)/256), y1 = Math.floor(lat2px(b.s,z)/256);
    if(x0>x1) [x0,x1]=[x1,x0]; if(y0>y1) [y0,y1]=[y1,y0];
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) lista.push([z,x,y]);
  }
  return lista;
}
function tilesDelArea(zMin, zMax){ return tilesDeBounds(boundsVista(), zMin, zMax); }  // vista actual
// ¿Un tile cae dentro de una zona guardada? (para borrar sin dañar parches vecinos)
function zonaCubreTile(zona, z, x, y){
  if(z < zona.zMin || z > zona.zMax) return false;
  const b = zona.bounds;
  let x0 = Math.floor(lon2px(b.w,z)/256), x1 = Math.floor(lon2px(b.e,z)/256);
  let y0 = Math.floor(lat2px(b.n,z)/256), y1 = Math.floor(lat2px(b.s,z)/256);
  if(x0>x1) [x0,x1]=[x1,x0]; if(y0>y1) [y0,y1]=[y1,y0];
  return x>=x0 && x<=x1 && y>=y0 && y<=y1;
}
// Borra los tiles de una zona salvo los que otra zona de la misma capa comparta.
async function borrarZona(id){
  const zonas = await dbAll('zonas');
  const zona = zonas.find(z=>z.id===id); if(!zona) return;
  const otras = zonas.filter(z=> z.id!==id && z.capa===zona.capa);
  for(const [z,x,y] of tilesDeBounds(zona.bounds, zona.zMin, zona.zMax)){
    if(otras.some(o=> zonaCubreTile(o,z,x,y))) continue;
    await dbDel('tiles', `${zona.capa}/${z}/${x}/${y}`);
  }
  await dbDel('zonas', id);
  memTiles.clear();
}

          if(!r.ok) throw 0;
          await dbPut('tiles', await r.blob(), k); guardados++;
        }catch(e){ fallos++; }
        finally{ hechos++; }
      }));
      bar.style.width = (hechos/lista.length*100) + '%';
      btn.textContent = `Descargando ${hechos}/${lista.length}`;
    }
    // Registrar la zona (parche) aunque falten algunos tiles.
    await dbPut('zonas', { id:nid(), nom, capa, bounds, zMin, zMax, tiles:guardados, t:Date.now() });
    toast(fallos ? `Zona "${nom}" guardada con ${fallos} tiles fallidos.` : `Zona "${nom}" guardada: ${guardados} tiles.`);
    dibujar(); panelOffline();
  };
}

async function bajar(nom, txt, tipo){
  const safe = nom.replace(/[^\w\-. áéíóúñÁÉÍÓÚÑ]/g,'_');
  const P = window.Capacitor && window.Capacitor.Plugins;
  // En el APK, <a download> con blob NO funciona en el WebView de Android.
  // Escribimos el archivo con Filesystem y abrimos el menú Compartir.
  if(P && P.Filesystem){
    try{
      const res = await P.Filesystem.writeFile({
        path: safe,
        data: txt,
        directory: 'CACHE',
        encoding: 'utf8'
      });
      if(P.Share){
        // IMPORTANTE: compartir SOLO el archivo (url). Si se manda 'text'
        // junto, con extensiones que Android no reconoce (.gpx/.geojson) el
        // menú prioriza el texto y descarta el archivo.
        await P.Share.share({ title: safe, url: res.uri, dialogTitle: 'Guardar o compartir ' + safe });
      } else {
        toast('Guardado en caché: ' + safe);
      }
      return;
    }catch(e){
      console.log('Filesystem/Share error:', e);
      toast('No se pudo guardar el archivo: ' + (e && e.message ? e.message : e));
      return;
    }
  }
  // Navegador de escritorio: descarga clásica.
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:tipo}));
  a.download = safe;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
  toast('Archivo descargado.');
}

function blobABase64(blob){ return new Promise((ok,mal)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=mal; r.readAsDataURL(blob); }); }
async function bajarBlob(nom, blob){
  const safe = nom.replace(/[^\w\-. áéíóúñÁÉÍÓÚÑ]/g,'_');
  const P = window.Capacitor && window.Capacitor.Plugins;
  if(P && P.Filesystem){
    try{
      const b64 = await blobABase64(blob);
      const res = await P.Filesystem.writeFile({ path:safe, data:b64, directory:'CACHE' });   // sin encoding = binario
      if(P.Share) await P.Share.share({ title:safe, url:res.uri, dialogTitle:'Guardar o compartir '+safe });
      else toast('Guardado en caché: '+safe);
      return;
    }catch(e){ toast('No se pudo guardar: '+(e && e.message?e.message:e)); return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=safe; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('Archivo descargado.');
}
// Paso de grilla "redondo" adaptado al rango, para no saturar (5–8 líneas).
function pasoGrilla(rango){
  const objetivo = Math.max(1e-6, rango/6);
  const p10 = Math.pow(10, Math.floor(Math.log10(objetivo)));
  for(const m of [1,2,2.5,5,10]) if(p10*m >= objetivo) return p10*m;
  return p10*10;
}
function fmtMetrosGrid(v){ v=Math.round(v); const s=Math.abs(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); return (v<0?'-':'')+s; }

// Renderiza la vista actual a un canvas con marco, grilla CRTM05 exterior,
// norte, barra de escala, leyenda y fecha. Devuelve {canvas, geo}.
function renderarMapaExport(opts){
  dibujar();                              // asegurar que el mapa vivo esté al día
  if(!ultimoT){ toast('Abrí el mapa primero.'); return null; }
  const k = 2;                            // supersampling para nitidez
  const mW = Math.round(W*k), mH = Math.round(H*k);
  // Esquinas geográficas EXACTAS de lo dibujado.
  const tl = pantallaALatLon(0,0), br = pantallaALatLon(W,H);
  const lonW=tl.lon, latN=tl.lat, lonE=br.lon, latS=br.lat;

  // Márgenes (px de página).
  const padL=84, padT=72, padR=34;
  const leg = opts.leyenda||[];
  const legCols = 2, legRows = Math.ceil(leg.length/legCols);
  const stripH = 118 + legRows*34;
  const pageW = padL + mW + padR;
  const pageH = padT + mH + stripH;

  const cvE = document.createElement('canvas');
  cvE.width = pageW; cvE.height = pageH;
  const g = cvE.getContext('2d');
  g.fillStyle = '#FFFFFF'; g.fillRect(0,0,pageW,pageH);
  // Mapa (instantánea del canvas vivo).
  g.imageSmoothingEnabled = true;
  g.drawImage(cv, 0,0,cv.width,cv.height, padL, padT, mW, mH);
  // Marco.
  g.strokeStyle='#111'; g.lineWidth=2; g.strokeRect(padL, padT, mW, mH);

  // --- Grilla exterior CRTM05 (solo marcas y números en el marco) ---
  const c = [tmFwd(latN,lonW,CRTM05),tmFwd(latN,lonE,CRTM05),tmFwd(latS,lonW,CRTM05),tmFwd(latS,lonE,CRTM05)];
  let Emin=Infinity,Emax=-Infinity,Nmin=Infinity,Nmax=-Infinity;
  for(const q of c){ Emin=Math.min(Emin,q.e);Emax=Math.max(Emax,q.e);Nmin=Math.min(Nmin,q.n);Nmax=Math.max(Nmax,q.n); }
  const paso = pasoGrilla(Math.max(Emax-Emin, Nmax-Nmin));
  const lonParaE=(lat,E)=>{ let a=lonW,b=lonE; for(let i=0;i<38;i++){ const m=(a+b)/2; (tmFwd(lat,m,CRTM05).e<E)?a=m:b=m; } return (a+b)/2; };
  const latParaN=(lon,N)=>{ let a=latS,b=latN; for(let i=0;i<38;i++){ const m=(a+b)/2; (tmFwd(m,lon,CRTM05).n<N)?a=m:b=m; } return (a+b)/2; };
  const PX = cx => padL + cx*k, PY = cy => padT + cy*k;   // css -> página
  g.fillStyle='#111'; g.strokeStyle='#111'; g.lineWidth=1.5;
  g.font='600 18px ui-monospace, monospace';
  const TIC=11;
  // Eastings (marcas arriba y abajo).
  g.textAlign='center';
  for(let E=Math.ceil(Emin/paso)*paso; E<=Emax; E+=paso){
    const xt = latlonAPantalla(latN, lonParaE(latN,E)).x;
    const xb = latlonAPantalla(latS, lonParaE(latS,E)).x;
    if(xt>=0 && xt<=W){ const X=PX(xt); g.beginPath(); g.moveTo(X,padT); g.lineTo(X,padT-TIC); g.stroke();
      g.textBaseline='bottom'; g.fillText(fmtMetrosGrid(E), X, padT-TIC-3); }
    if(xb>=0 && xb<=W){ const X=PX(xb); g.beginPath(); g.moveTo(X,padT+mH); g.lineTo(X,padT+mH+TIC); g.stroke();
      g.textBaseline='top'; g.fillText(fmtMetrosGrid(E), X, padT+mH+TIC+3); }
  }
  // Northings (marcas izquierda y derecha, texto rotado).
  for(let N=Math.ceil(Nmin/paso)*paso; N<=Nmax; N+=paso){
    const yl = latlonAPantalla(latParaN(lonW,N), lonW).y;
    const yr = latlonAPantalla(latParaN(lonE,N), lonE).y;
    if(yl>=0 && yl<=H){ const Y=PY(yl); g.beginPath(); g.moveTo(padL,Y); g.lineTo(padL-TIC,Y); g.stroke();
      g.save(); g.translate(padL-TIC-4, Y); g.rotate(-Math.PI/2); g.textAlign='center'; g.textBaseline='bottom'; g.fillText(fmtMetrosGrid(N),0,0); g.restore(); }
    if(yr>=0 && yr<=H){ const Y=PY(yr); g.beginPath(); g.moveTo(padL+mW,Y); g.lineTo(padL+mW+TIC,Y); g.stroke();
      g.save(); g.translate(padL+mW+TIC+4, Y); g.rotate(-Math.PI/2); g.textAlign='center'; g.textBaseline='top'; g.fillText(fmtMetrosGrid(N),0,0); g.restore(); }
  }
  // --- Cabecera: título (opcional, en blanco si no se puso) + sistema ---
  g.textAlign='left'; g.textBaseline='alphabetic';
  const tit = (opts.titulo||'').trim();
  if(tit){ g.fillStyle='#111'; g.font='700 26px system-ui'; g.fillText(tit, padL, 40); }
  g.fillStyle='#555'; g.font='600 16px ui-monospace, monospace';
  g.fillText('Cuadrícula CRTM05 · EPSG:5367 · m', padL, 62);

  // --- Franja inferior: norte, escala, leyenda, fecha ---
  const sy = padT + mH;
  g.strokeStyle='#ccc'; g.lineWidth=1; g.beginPath(); g.moveTo(padL, sy+40); g.lineTo(pageW-padR, sy+40); g.stroke();
  // Norte
  const nx=padL+16, ny=sy+90;
  g.strokeStyle='#111'; g.fillStyle='#111'; g.lineWidth=2.5;
  g.beginPath(); g.moveTo(nx,ny+22); g.lineTo(nx,ny-22); g.stroke();
  g.beginPath(); g.moveTo(nx,ny-28); g.lineTo(nx-7,ny-14); g.lineTo(nx+7,ny-14); g.closePath(); g.fill();
  g.textAlign='center'; g.font='700 18px system-ui'; g.fillText('N', nx, ny+40);
  // Barra de escala (m/px de página).
  const mPx = 156543.03392*Math.cos(S.centro.lat*D2R)/Math.pow(2,S.zoom);   // m por px css
  const mPorPagPx = mPx / k;
  let obj = 150*mPorPagPx; const e10=Math.pow(10,Math.floor(Math.log10(obj)));
  const mult=[1,2,5,10].find(x=>e10*x>=obj)||10; const metros=e10*mult; const barPx=metros/mPorPagPx;
  const bx=nx+70, by=sy+96;
  g.strokeStyle='#111'; g.lineWidth=2.5; g.beginPath(); g.moveTo(bx,by-8); g.lineTo(bx,by); g.lineTo(bx+barPx,by); g.lineTo(bx+barPx,by-8); g.stroke();
  g.fillStyle='#111'; g.textAlign='left'; g.font='600 15px ui-monospace, monospace';
  g.fillText(metros>=1000?(metros/1000)+' km':metros+' m', bx, by-12);
  // Leyenda
  g.font='600 16px system-ui';
  const lx0 = bx + barPx + 60;
  const colW = (pageW - padR - lx0)/legCols;
  for(let i=0;i<leg.length;i++){
    const col=i%legCols, row=Math.floor(i/legCols);
    const ex = lx0 + col*colW, ey = sy+70 + row*34;
    g.fillStyle = leg[i].color || '#666'; g.strokeStyle='#111'; g.lineWidth=1;
    g.fillRect(ex, ey-14, 20, 16); g.strokeRect(ex, ey-14, 20, 16);
    g.fillStyle='#111'; g.textAlign='left'; g.textBaseline='alphabetic';
    let nom = leg[i].nombre||''; if(nom.length>28) nom=nom.slice(0,27)+'…';
    g.fillText(nom, ex+28, ey);
  }
  if(!leg.length){ g.fillStyle='#888'; g.fillText('(sin capas activas en la vista)', lx0, sy+72); }
  // Fecha de generación
  g.fillStyle='#555'; g.textAlign='right'; g.font='600 15px ui-monospace, monospace';
  g.fillText('Generado: '+new Date().toLocaleString('es-CR'), pageW-padR, pageH-14);

  return { canvas:cvE, geo:{ padL, padT, mW, mH, latN, latS, lonW, lonE } };
}

// PDF de una sola página con la imagen (JPEG) y un viewport georreferenciado
// OGC (WGS84) legible por QGIS/GDAL y Avenza.
async function construirPDF(canvas, geo){
  const dataURL = canvas.toDataURL('image/jpeg', 0.92);
  const bin = atob(dataURL.split(',')[1]);
  const jpg = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) jpg[i]=bin.charCodeAt(i);
  const iw=canvas.width, ih=canvas.height;
  const PT=72/150;                         // 150 dpi
  const PW=+(iw*PT).toFixed(2), PH=+(ih*PT).toFixed(2);
  const bx0=(geo.padL*PT).toFixed(2), bx1=((geo.padL+geo.mW)*PT).toFixed(2);
  const by1=(PH-geo.padT*PT).toFixed(2), by0=(PH-(geo.padT+geo.mH)*PT).toFixed(2);
  const gpts=[geo.latS,geo.lonW, geo.latN,geo.lonW, geo.latN,geo.lonE, geo.latS,geo.lonE].map(v=>v.toFixed(8)).join(' ');
  const wkt='GEOGCS["WGS 84",DATUM["WGS_1984",SPHEROID["WGS 84",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["degree",0.0174532925199433],AUTHORITY["EPSG","4326"]]';
  const vp=`/VP [ << /Type /Viewport /BBox [${bx0} ${by0} ${bx1} ${by1}] /Name (Mapa) /Measure << /Type /Measure /Subtype /GEO /Bounds [0 0 0 1 1 1 1 0] /GPTS [${gpts}] /LPTS [0 0 0 1 1 1 1 0] /GCS << /Type /GEOGCS /WKT (${wkt}) >> >> >> ]`;
  const content=`q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
  const enc=new TextEncoder(); const parts=[]; let len=0; const off=[];
  const push=s=>{ const b=(typeof s==='string')?enc.encode(s):s; parts.push(b); len+=b.length; };
  const obj=s=>{ off.push(len); push(s); };
  push('%PDF-1.7\n');
  obj('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  obj('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
  obj(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R ${vp} >>\nendobj\n`);
  obj(`4 0 obj\n<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
  off.push(len);
  push(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
  push(jpg); push('\nendstream\nendobj\n');
  const xrefStart=len;
  let xref='xref\n0 6\n0000000000 65535 f \n';
  for(let i=0;i<5;i++) xref += String(off[i]).padStart(10,'0')+' 00000 n \n';
  push(xref);
  push(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xrefStart}\n%%EOF`);
  return new Blob(parts, {type:'application/pdf'});
}

// Capas/puntos/tracks visibles dentro de la vista actual (para la leyenda).
function itemsLeyendaEnVista(){
  const b = boundsVista();   // {w,e,n,s}
  const inter = bb => !(bb[2]<b.w || bb[0]>b.e || bb[3]<b.s || bb[1]>b.n);
  const items = [];
  for(const c of S.capas){
    if(!c.visible) continue;
    if(c.tipo==='wms'){ items.push({ color:'#8899AA', nombre:c.nombre, tipo:'wms' }); continue; }
    const feats = c.geojson&&c.geojson.features || [];
    let dentro=false;
    for(const f of feats){ if(!f||!f.geometry) continue; if(!f._bbox) f._bbox=bboxGeom(f.geometry); if(inter(f._bbox)){ dentro=true; break; } }
    if(dentro) items.push({ color:c.color||'#E0A458', nombre:c.nombre, tipo:'vector' });
  }
  const ptsVis = S.puntos.some(p=> p.visible!==false && p.lon>=b.w && p.lon<=b.e && p.lat>=b.s && p.lat<=b.n);
  if(ptsVis) items.push({ color:'#DCE6E4', nombre:'Puntos del proyecto', tipo:'puntos' });
  const trkVis = S.tracks.some(t=> t.visible!==false && (t.pts||[]).some(p=> p.lon>=b.w && p.lon<=b.e && p.lat>=b.s && p.lat<=b.n));
  if(trkVis) items.push({ color:'#E0A458', nombre:'Tracks del proyecto', tipo:'tracks' });
  return items;

// Evalúa si un fix pasa los filtros de calidad. Criterios sin dato no rechazan.
function pasaFiltros(pos){
  const F = S.filtros; if(!F || !F.activo) return true;
  const acc = pos.coords.accuracy;
  if(acc!=null && F.exacMax>0 && acc > F.exacMax) return false;
  if(ultimoHdop!=null && F.hdopMax>0 && ultimoHdop > F.hdopMax) return false;
  if(ultimoSatsUsados!=null && F.satMin>0 && ultimoSatsUsados < F.satMin) return false;
  if(ultimoCn0Mean!=null && F.cn0Min>0 && ultimoCn0Mean < F.cn0Min) return false;
  return true;
}
let ultimoAvisoRechazo = 0;
function avisarRechazo(){
  if(navigator.vibrate){ try{ navigator.vibrate(60); }catch(e){} }
  const ahora = Date.now();
  if(ahora - ultimoAvisoRechazo > 4000){ ultimoAvisoRechazo = ahora; toast('✗ Punto filtrado (calidad baja)'); }
}

/* --- capas del usuario: GeoJSON / WFS / WMS --- */
const PALETA_CAPAS = ['#E0A458','#4FD1C5','#C75146','#6FCF6F','#B07CC6','#E06AA0','#8899AA'];
function colorCapa(i){ return PALETA_CAPAS[i % PALETA_CAPAS.length]; }

// HTTP por nativo (salta CORS). En navegador cae a fetch normal.
async function httpGet(url){
  const P = pluginGnss();
  if(P && P.httpGet){
    const r = await P.httpGet({ url });
    const bytes = Uint8Array.from(atob(r.dataBase64), c=> c.charCodeAt(0));
    return { status:r.status, contentType:r.contentType||'', bytes };
  }
  const resp = await fetch(url, {signal: AbortSignal.timeout(20000)});
  const bytes = new Uint8Array(await resp.arrayBuffer());
  return { status:resp.status, contentType: resp.headers.get('content-type')||'', bytes };
}
function bytesATexto(bytes){ return new TextDecoder('utf-8').decode(bytes); }
function sinQuery(u){ return (u||'').split('?')[0]; }

// Lee GetCapabilities y lista capas/feature types (maneja espacios de nombres por localName).
function parseCapabilities(xmlText, tag){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const out = [];
  const nodos = doc.getElementsByTagName('*');
  for(let i=0;i<nodos.length;i++){
    const el = nodos[i];
    if(el.localName!==tag) continue;
    let name=null, title=null;
    for(let j=0;j<el.children.length;j++){
      const ch = el.children[j];
      if(ch.localName==='Name' && !name) name = ch.textContent.trim();
      else if(ch.localName==='Title' && !title) title = ch.textContent.trim();
    }
    if(name) out.push({ name, title: title||name });
  }
  return out;
}
async function escanearWMS(url){
  const base = sinQuery(url);
  const cap = `${base}?SERVICE=WMS&REQUEST=GetCapabilities`;
  const r = await httpGet(cap);
  if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
  return parseCapabilities(bytesATexto(r.bytes), 'Layer');
}
async function escanearWFS(url){
  const base = sinQuery(url);
  const cap = `${base}?SERVICE=WFS&REQUEST=GetCapabilities`;
  const r = await httpGet(cap);
  if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
  return parseCapabilities(bytesATexto(r.bytes), 'FeatureType');
}
function urlWfsGeoJSON(base, typeName){
  const b = sinQuery(base);
  const p = new URLSearchParams({ service:'WFS', version:'2.0.0', request:'GetFeature',
    typeNames:typeName, outputFormat:'application/json', srsName:'EPSG:4326', count:'10000' });
  return `${b}?${p.toString()}`;
}
async function agregarCapaWFS(nombre, base, typeName){
  toast('Descargando capa WFS…');
  try{
    const r = await httpGet(urlWfsGeoJSON(base, typeName));
    if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
    if(r.bytes && !chequearTamano(r.bytes.length||r.bytes.byteLength||0)) return;
    const txt = bytesATexto(r.bytes);
    let gj;
    try{ gj = JSON.parse(txt); }
    catch(e){ toast('El servidor no devolvió GeoJSON (¿no soporta outputFormat=application/json?).'); return; }
    await guardarCapaVector(nombre||typeName, gj);
  }catch(e){ toast('No se pudo descargar el WFS: '+(e.message||e)); }
}

// Caja de Costa Rica (con margen) para reconocer una proyección tica.
const CR_BBOX = { latMin:7.5, latMax:11.7, lonMin:-86.5, lonMax:-82.0 };
const PROY_TICAS = ['crtm05','ln','ls'];
// Primera coordenada de una FeatureCollection (para muestrear la proyección).
function _primeraCoord(fc){
  const feats = fc.type==='FeatureCollection' ? (fc.features||[]) : fc.type==='Feature' ? [fc] : [];
  for(const f of feats){
    const g = f && f.geometry; if(!g) continue;
    let hit = null;
    const rec = a=>{ if(hit) return; if(typeof a[0]==='number'){ hit = a; } else for(const x of a){ rec(x); if(hit) return; } };
    if(g.type==='GeometryCollection'){ for(const gg of (g.geometries||[])){ if(gg&&gg.coordinates) rec(gg.coordinates); if(hit) break; } }
    else if(g.coordinates) rec(g.coordinates);
    if(hit) return hit;
  }
  return null;
}
// Detecta la proyección de origen: 'geo' si ya es lon/lat; si es proyectada,
// prueba las proyecciones ticas y devuelve la que caiga dentro de Costa Rica.
function detectarModoCapa(fc){
  const c = _primeraCoord(fc);
  if(!c) return { modo:'geo', dentroCR:false };
  const x = c[0], y = c[1];
  if(Math.abs(x)<=180 && Math.abs(y)<=90){
    const dentroCR = y>=CR_BBOX.latMin && y<=CR_BBOX.latMax && x>=CR_BBOX.lonMin && x<=CR_BBOX.lonMax;
    return { modo:'geo', dentroCR };
  }
  for(const m of PROY_TICAS){
    try{ const w = haciaWgs(x, y, m);
      if(w.lat>=CR_BBOX.latMin && w.lat<=CR_BBOX.latMax && w.lon>=CR_BBOX.lonMin && w.lon<=CR_BBOX.lonMax)
        return { modo:m, dentroCR:true };
    }catch(e){}
  }
  return { modo:'crtm05', dentroCR:false };   // proyectada desconocida: mejor esfuerzo
}
// Reproyecta EN SITIO las coordenadas de una FC desde una proyección tica a WGS84.
function reproyectarFC(fc, modo){
  if(modo==='geo') return;
  const rec = coords=>{
    if(typeof coords[0]==='number'){ const w = haciaWgs(coords[0], coords[1], modo); coords[0]=w.lon; coords[1]=w.lat; if(coords.length>2) coords.length=2; }
    else for(const c of coords) rec(c);
  };
  const feats = fc.type==='FeatureCollection' ? (fc.features||[]) : fc.type==='Feature' ? [fc] : [];
  for(const f of feats){ const g=f&&f.geometry; if(!g) continue;
    if(g.type==='GeometryCollection'){ for(const gg of (g.geometries||[])) if(gg&&gg.coordinates) rec(gg.coordinates); }
    else if(g.coordinates) rec(g.coordinates);
    if(f) f._bbox = null;   // invalidar caché de caja
  }
}

async function guardarCapaVector(nombre, gj, silencioso){
  // Normaliza a FeatureCollection (acepta Feature o geometría suelta).
  let fc = gj;
  if(!gj || !gj.type){ toast('El contenido no es GeoJSON válido.'); return null; }
  if(gj.type !== 'FeatureCollection'){
    fc = { type:'FeatureCollection', features: gj.type==='Feature' ? [gj] : [{type:'Feature',geometry:gj,properties:{}}] };
  }
  // Proyección de origen: la del shapefile (ya reproyectado) o autodetectada.
  let proyFuente, aviso = '';
  if(fc._proyFuente !== undefined){
    proyFuente = fc._proyFuente;   // el .shp ya vino reproyectado a WGS84
  } else {
    const det = detectarModoCapa(fc);
    proyFuente = det.modo;
    if(proyFuente !== 'geo'){
      reproyectarFC(fc, proyFuente);
      aviso = det.dentroCR
        ? `Detecté proyección ${proyFuente==='crtm05'?'CRTM05':proyFuente==='ln'?'Lambert Norte':'Lambert Sur'} y la ubiqué en Costa Rica.`
        : 'Proyección desconocida; asumí CRTM05. Si no encaja, cambiala con 🌐.';
    }
  }
  const capa = { id:nid(), nombre:(nombre||'Capa').slice(0,40), tipo:'geojson', visible:true, consultable:true,
                 color: colorCapa(S.capas.length), geojson: fc, proyFuente };
  await dbPut('capas', capa); S.capas.push(capa);
  toast(aviso || `Capa "${capa.nombre}": ${(fc.features||[]).length} elementos.`);
  // Siempre volar a donde está la capa.
  centrarEnCapa(capa); dibujar();
  if(!silencioso) panelCapas();
  return capa;
}
// Reinterpreta la proyección de origen de una capa y reproyecta a WGS84.
// Usa ida y vuelta a través de la proyección actual, así no guarda copia cruda.
async function reinterpretarCapa(capaId, nuevoModo){
  const c = S.capas.find(x=>x.id===capaId); if(!c || !c.geojson) return;
  const actual = c.proyFuente || 'geo';
  if(actual === nuevoModo){ panelCapas(); return; }
  const rec = coords=>{
    if(typeof coords[0]==='number'){
      // Recuperar la coordenada cruda (Este/Norte o lon/lat) desde WGS84 actual.
      let raw;
      if(actual==='geo') raw = [coords[0], coords[1]];
      else { const p = desdeWgs(coords[1], coords[0], actual); raw = [p.e, p.n]; }
      // Aplicar la nueva interpretación.
      if(nuevoModo==='geo'){ coords[0]=raw[0]; coords[1]=raw[1]; }
      else { const w = haciaWgs(raw[0], raw[1], nuevoModo); coords[0]=w.lon; coords[1]=w.lat; }
    } else for(const cc of coords) rec(cc);
  };
  const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : [c.geojson];
  for(const f of feats){ const g=f&&f.geometry; if(!g) continue;
    if(g.type==='GeometryCollection'){ for(const gg of (g.geometries||[])) if(gg&&gg.coordinates) rec(gg.coordinates); }
    else if(g.coordinates) rec(g.coordinates);
    if(f) f._bbox = null;
  }
  c.proyFuente = nuevoModo;
  await dbPut('capas', c);
  centrarEnCapa(c); dibujar(); panelCapas();
  toast('Proyección: ' + (nuevoModo==='geo'?'WGS84 (geográficas)':nuevoModo==='crtm05'?'CRTM05':nuevoModo==='ln'?'Lambert Norte':'Lambert Sur'));
}
// Selector de proyección de origen de una capa.
function panelProyeccion(capaId){
  const c = S.capas.find(x=>x.id===capaId); if(!c) return;
  const actual = c.proyFuente || 'geo';
  const opciones = [['geo','WGS84 · geográficas (lon/lat)'],['crtm05','CRTM05 · EPSG:5367'],['ln','Lambert Norte · EPSG:5456'],['ls','Lambert Sur · EPSG:5457']];
  abrirPanel('Proyección · '+c.nombre, `
    <div class="nota" style="border-color:var(--fix)">Elegí en qué proyección venían las coordenadas originales. La app las convierte a WGS84 y reencuadra el mapa. Por defecto se autodetecta.</div>
    ${opciones.map(([k,t])=>`<button class="ancho ${actual===k?'':'borde'}" data-pj="${k}" style="margin-top:8px;text-align:left">${t}${actual===k?'  ✓':''}</button>`).join('')}
  `);
  document.querySelectorAll('[data-pj]').forEach(b=> b.onclick = ()=> reinterpretarCapa(capaId, b.dataset.pj));
}
// Centra el mapa en la caja envolvente de una capa vectorial.
function centrarEnCapa(capa){
  const feats = capa.geojson.type==='FeatureCollection' ? (capa.geojson.features||[]) : [capa.geojson];
  let b=[Infinity,Infinity,-Infinity,-Infinity];
  for(const f of feats){ if(!f||!f.geometry) continue; const bb=bboxGeom(f.geometry); if(bb[0]<b[0])b[0]=bb[0]; if(bb[1]<b[1])b[1]=bb[1]; if(bb[2]>b[2])b[2]=bb[2]; if(bb[3]>b[3])b[3]=bb[3]; }
  if(!isFinite(b[0])) return;
  S.centro.lon = (b[0]+b[2])/2; S.centro.lat = (b[1]+b[3])/2; S.seguir = false;
  // Ajustar zoom aproximado al ancho de la caja.
  const anchoLon = Math.max(1e-4, b[2]-b[0]);
  S.zoom = Math.max(3, Math.min(18, Math.log2(360/anchoLon) + 0.5));
}

// --- KML -> GeoJSON ---
// Recorre <Placemark> (dentro de carpetas o no) y traduce Point, LineString,
// Polygon (con huecos), MultiGeometry y gx:Track.
// Busca descendientes por nombre local, ignorando el espacio de nombres
// (así encuentra tanto <coordinates> como <gx:coord>). Con respaldo por si
// el documento se parseó sin espacios de nombres.
function _localName(el, local){
  let r = [...el.getElementsByTagNameNS('*', local)];
  if(!r.length) r = [...el.getElementsByTagName(local)];
  return r;
}
function _txtHijo(el, local){ const n=_localName(el, local)[0]; return n ? n.textContent.trim() : ''; }
function _kmlCoords(txt){
  return (txt||'').trim().split(/\s+/).filter(Boolean).map(tp=>{
    const a = tp.split(',').map(Number);
    return [a[0], a[1]];   // lon, lat  (se ignora la altura)
  }).filter(c=> isFinite(c[0]) && isFinite(c[1]));
}
function kmlAGeoJSON(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('KML mal formado');
  const feats = [];
  for(const pm of _localName(doc.documentElement, 'Placemark')){
    const geoms = [];
    for(const g of _localName(pm,'Point')){ const c=_kmlCoords(_txtHijo(g,'coordinates'))[0]; if(c) geoms.push({type:'Point',coordinates:c}); }
    for(const g of _localName(pm,'LineString')){ const l=_kmlCoords(_txtHijo(g,'coordinates')); if(l.length>1) geoms.push({type:'LineString',coordinates:l}); }
    for(const g of _localName(pm,'Polygon')){
      const rings=[];
      const outer=_localName(g,'outerBoundaryIs')[0];
      if(outer){ const r=_kmlCoords(_txtHijo(outer,'coordinates')); if(r.length>2) rings.push(r); }
      for(const inner of _localName(g,'innerBoundaryIs')){ const r=_kmlCoords(_txtHijo(inner,'coordinates')); if(r.length>2) rings.push(r); }
      if(rings.length) geoms.push({type:'Polygon',coordinates:rings});
    }
    for(const g of _localName(pm,'Track')){   // gx:Track: cada <gx:coord> = "lon lat alt"
      const cs = _localName(g,'coord').map(c=>{ const a=c.textContent.trim().split(/\s+/).map(Number); return [a[0],a[1]]; }).filter(c=>isFinite(c[0]));
      if(cs.length>1) geoms.push({type:'LineString',coordinates:cs});
    }
    if(!geoms.length) continue;
    const props = { nombre: _txtHijo(pm,'name') || '', desc: _txtHijo(pm,'description') || '' };
    // ExtendedData -> propiedades
    for(const d of _localName(pm,'Data')){ const k=d.getAttribute('name'); if(k) props[k]=_txtHijo(d,'value'); }
    for(const sd of _localName(pm,'SimpleData')){ const k=sd.getAttribute('name'); if(k) props[k]=sd.textContent.trim(); }
    const geometry = geoms.length===1 ? geoms[0] : { type:'GeometryCollection', geometries:geoms };
    feats.push({ type:'Feature', geometry, properties:props });
  }
  if(!feats.length) throw new Error('El KML no tenía elementos con geometría');
  return { type:'FeatureCollection', features:feats };
}

// --- Lector ZIP (usa DecompressionStream del WebView, sin librerías) ---
function _bufDe(u8){ return u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength); }
async function _inflarRaw(bytes){
  if(typeof DecompressionStream==='undefined') throw new Error('Este dispositivo no puede descomprimir ZIP/KMZ.');
  const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function leerZip(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i=buf.byteLength-22; i>=0 && i > buf.byteLength-22-65536; i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('No es un ZIP válido');
  const cdOff = dv.getUint32(eocd+16, true), cdCount = dv.getUint16(eocd+10, true);
  const out = new Map();
  let p = cdOff;
  for(let n=0; n<cdCount; n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method   = dv.getUint16(p+10, true);
    const compSize = dv.getUint32(p+20, true);
    const nameLen  = dv.getUint16(p+28, true);
    const extraLen = dv.getUint16(p+30, true);
    const commLen  = dv.getUint16(p+32, true);
    const lho      = dv.getUint32(p+42, true);
    const name = new TextDecoder().decode(u8.subarray(p+46, p+46+nameLen));
    const lhNameLen  = dv.getUint16(lho+26, true);
    const lhExtraLen = dv.getUint16(lho+28, true);
    const dataStart  = lho + 30 + lhNameLen + lhExtraLen;
    const comp = u8.subarray(dataStart, dataStart+compSize);
    if(method===0)      out.set(name, comp.slice());
    else if(method===8) out.set(name, await _inflarRaw(comp));
    p += 46 + nameLen + extraLen + commLen;
  }
  return out;
}

// --- .prj (WKT) -> modo de proyección conocido de la app ---
function modoDePrj(prj){
  if(!prj) return null;
  const s = prj.toUpperCase();
  if(s.includes('PROJCS')){
    if(s.includes('LAMBERT')){
      const m = s.match(/LATITUDE_OF_ORIGIN[",\s]+(-?\d+(?:\.\d+)?)/);
      const lat0 = m ? parseFloat(m[1]) : 0;
      return lat0 > 10 ? 'ln' : 'ls';   // Lambert Norte (~10.47°) vs Sur (9°)
    }
    if(s.includes('CRTM') || s.includes('TRANSVERSE_MERCATOR')) return 'crtm05';
    return 'crtm05';   // proyectado desconocido: CRTM05 es lo más común en CR
  }
  return 'geo';   // geográficas
}

// --- Shapefile (.shp + .dbf + .prj) -> GeoJSON, reproyectando a WGS84 ---
function _areaAnillo(r){ let a=0; for(let i=0,j=r.length-1;i<r.length;j=i++){ a += r[j][0]*r[i][1] - r[i][0]*r[j][1]; } return a/2; }
function shpAGeoJSON(shpBuf, dbfRows, prj){
  const dv = new DataView(shpBuf), len = shpBuf.byteLength;
  const xmin = dv.getFloat64(36, true), ymin = dv.getFloat64(44, true);
  let modo = modoDePrj(prj);
  if(!modo || modo==='geo'){
    // Sin .prj: si los valores no parecen lon/lat, asumimos CRTM05.
    if(Math.abs(xmin) > 180 || Math.abs(ymin) > 90) modo = 'crtm05';
    else modo = 'geo';
  }
  const conv = (modo==='geo') ? (x,y)=>[x,y] : (x,y)=>{ const w=haciaWgs(x,y,modo); return [w.lon, w.lat]; };
  const feats = [];
  let off = 100, idx = 0;
  const BASE = {11:1,21:1, 3:3,13:3,23:3, 5:5,15:5,25:5, 8:8,18:8,28:8};
  while(off + 8 <= len){
    const contentLen = dv.getInt32(off+4, false);       // en palabras de 16 bits
    const rec = off + 8;
    const type = dv.getInt32(rec, true);
    const base = BASE[type] || type;
    let geom = null;
    if(base===1){
      geom = { type:'Point', coordinates: conv(dv.getFloat64(rec+4,true), dv.getFloat64(rec+12,true)) };
    } else if(base===8){
      const nPts = dv.getInt32(rec+36, true); let pp = rec+40; const pts=[];
      for(let i=0;i<nPts;i++){ pts.push(conv(dv.getFloat64(pp,true), dv.getFloat64(pp+8,true))); pp+=16; }
      geom = { type:'MultiPoint', coordinates:pts };
    } else if(base===3 || base===5){
      const nParts = dv.getInt32(rec+36, true), nPts = dv.getInt32(rec+40, true);
      let pp = rec+44; const parts=[];
      for(let i=0;i<nParts;i++){ parts.push(dv.getInt32(pp,true)); pp+=4; }
      const all=[]; for(let i=0;i<nPts;i++){ all.push(conv(dv.getFloat64(pp,true), dv.getFloat64(pp+8,true))); pp+=16; }
      const rings=[]; for(let i=0;i<nParts;i++){ rings.push(all.slice(parts[i], i+1<nParts?parts[i+1]:nPts)); }
      if(base===3){ geom = rings.length===1 ? {type:'LineString',coordinates:rings[0]} : {type:'MultiLineString',coordinates:rings}; }
      else {
        // Polígono: anillos horarios = exteriores; antihorarios = huecos.
        const polys=[];
        for(const r of rings){ if(_areaAnillo(r) < 0) polys.push([r]); else if(polys.length) polys[polys.length-1].push(r); else polys.push([r]); }
        geom = polys.length===1 ? {type:'Polygon',coordinates:polys[0]} : {type:'MultiPolygon',coordinates:polys};
      }
    }
    off = rec + contentLen*2;
    if(geom && type!==0) feats.push({ type:'Feature', geometry:geom, properties:(dbfRows && dbfRows[idx]) ? dbfRows[idx] : {} });
    idx++;
  }
  const fc = { type:'FeatureCollection', features:feats };
  fc._modo = modo;
  fc._proyFuente = modo;   // ya reproyectado a WGS84; recordar el origen para el selector 🌐
  return fc;
}

// --- DBF (dBASE III/IV) -> filas de atributos ---
function dbfLeer(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  const numRec = dv.getUint32(4, true), headerSize = dv.getUint16(8, true), recSize = dv.getUint16(10, true);
  const fields=[]; let p=32;
  while(p < headerSize && u8[p] !== 0x0D){
    let name=''; for(let i=0;i<11 && u8[p+i]!==0;i++) name += String.fromCharCode(u8[p+i]);
    fields.push({ name, type:String.fromCharCode(u8[p+11]), len:u8[p+16] });
    p += 32;
  }
  const dec = new TextDecoder('latin1');
  const rows=[]; let rp = headerSize;
  for(let r=0; r<numRec; r++){
    let cp = rp+1; const row={};
    for(const f of fields){
      const raw = dec.decode(u8.subarray(cp, cp+f.len)).replace(/\u0000/g,'').trim(); cp += f.len;
      if(f.type==='N' || f.type==='F') row[f.name] = raw==='' ? null : Number(raw);
      else if(f.type==='L') row[f.name] = /^[YyTt]$/.test(raw);
      else row[f.name] = raw;
    }
    rp += recSize;
    rows.push(row);   // se conservan todas para no desalinear con el .shp
  }
  return rows;
}

// --- Importar un ZIP que trae un shapefile (o un KMZ/GeoJSON camuflado) ---
async function importarShapefileZip(nombre, buf){
  const zip = await leerZip(buf);
  const keys = [...zip.keys()];
  const shpKey = keys.find(k=>/\.shp$/i.test(k));
  if(!shpKey){
    const kmlKey = keys.find(k=>/\.kml$/i.test(k));
    if(kmlKey){ await guardarCapaVector(nombre, kmlAGeoJSON(new TextDecoder().decode(zip.get(kmlKey)))); return; }
    const gjKey = keys.find(k=>/\.(geo)?json$/i.test(k));
    if(gjKey){ await guardarCapaVector(nombre, JSON.parse(new TextDecoder().decode(zip.get(gjKey)))); return; }
    throw new Error('El ZIP no trae .shp ni .kml');
  }
  const base = shpKey.replace(/\.[^.]+$/,'');
  const buscar = ext => zip.get(base+'.'+ext) || zip.get(base+'.'+ext.toUpperCase());
  const dbfU8 = buscar('dbf'), prjU8 = buscar('prj');
  const dbfRows = dbfU8 ? dbfLeer(_bufDe(dbfU8)) : null;
  const prj = prjU8 ? new TextDecoder().decode(prjU8) : null;
  const gj = shpAGeoJSON(_bufDe(zip.get(shpKey)), dbfRows, prj);
  const suf = (gj._modo && gj._modo!=='geo') ? ' ('+gj._modo.toUpperCase()+'→WGS84)' : '';
  await guardarCapaVector(nombre + suf, gj);
}

// Límite de tamaño para no desbordar la memoria del WebView (crash por OOM).
const CAPA_MB = 1048576;
const CAPA_WARN = 12*CAPA_MB, CAPA_MAX = 45*CAPA_MB;
function chequearTamano(bytes){
  const mb = Math.round(bytes/CAPA_MB);
  if(bytes > CAPA_MAX){
    toast('Capa demasiado pesada ('+mb+' MB). Máx ~45 MB: simplificala en mapshaper.org o QGIS, dividila por zona, o cargala como servicio WFS/WMS.');
    return false;
  }
  if(bytes > CAPA_WARN) toast('Capa grande ('+mb+' MB): la carga y el mapa pueden ir lentos.');
  return true;
}

// Importa una capa desde un archivo del teléfono: GeoJSON, KML, KMZ, SHP o ZIP.
async function agregarCapaArchivo(file){
  if(file && file.size!=null && !chequearTamano(file.size)) return;
  const nombre = file.name.replace(/\.(geojson|json|kml|kmz|shp|zip)$/i,'');
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  mostrarCargando('Leyendo archivo…');
  try{
    if(ext==='geojson' || ext==='json'){
      await guardarCapaVector(nombre, JSON.parse(await file.text()));
    } else if(ext==='kml'){
      await guardarCapaVector(nombre, kmlAGeoJSON(await file.text()));
    } else if(ext==='kmz'){
      const zip = await leerZip(await file.arrayBuffer());
      const kmlKey = [...zip.keys()].find(k=>/\.kml$/i.test(k));
      if(!kmlKey) throw new Error('El KMZ no contiene .kml');
      await guardarCapaVector(nombre, kmlAGeoJSON(new TextDecoder().decode(zip.get(kmlKey))));
    } else if(ext==='shp'){
      await guardarCapaVector(nombre, shpAGeoJSON(await file.arrayBuffer(), null, null));
    } else if(ext==='zip'){
      await importarShapefileZip(nombre, await file.arrayBuffer());
    } else {
      toast('Formato no reconocido. Usá GeoJSON, KML, KMZ, SHP o ZIP.');
    }
  }catch(e){ toast('No se pudo importar: '+(e.message||e)); }
  finally{ ocultarCargando(); }
}
async function agregarCapaURL(nombre, url){
  if(!url){ toast('Pegá la URL.'); return; }
  mostrarCargando('Descargando capa…');
  try{
    const r = await httpGet(url);
    if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
    if(r.bytes && !chequearTamano(r.bytes.length||r.bytes.byteLength||0)) return;
    let gj;
    try{ gj = JSON.parse(bytesATexto(r.bytes)); }
    catch(e){ toast('La URL no devolvió GeoJSON. Si es un servicio WFS/WMS, usá esa opción para escanear capas.'); return; }
    await guardarCapaVector(nombre || 'Capa', gj);
  }catch(e){ toast('No se pudo cargar: '+(e.message||e)); }
  finally{ ocultarCargando(); }
}
async function agregarCapaWMS(nombre, url, layerName, version){
  if(!url || !layerName){ toast('Faltan URL o nombre de capa.'); return; }
  const capa = { id:nid(), nombre:(nombre||layerName).slice(0,40), tipo:'wms', visible:true, consultable:true,
                 url, capa:layerName, version:version||'1.3.0', format:'image/png' };
  await dbPut('capas', capa); S.capas.push(capa); dibujar();
  toast(`Capa WMS "${capa.nombre}" agregada.`);
  panelCapas();
}
/* --- overlay de carga --- */
function mostrarCargando(txt){ document.getElementById('cargandoTxt').textContent = txt||'Cargando…'; document.getElementById('cargando').classList.add('on'); }
function ocultarCargando(){ document.getElementById('cargando').classList.remove('on'); }
/* --- consulta de capas (tabla de atributos) --- */
let ultimoT = null;
function latlonAPantalla(lat,lon){ if(!ultimoT) return null; const t=ultimoT; return { x:(lon2px(lon,t.zi)-t.x0)*t.esc, y:(lat2px(lat,t.zi)-t.y0)*t.esc }; }
function pantallaALatLon(px,py){ if(!ultimoT) return null; const t=ultimoT; const X=px/t.esc+t.x0, Y=py/t.esc+t.y0; return { lat:px2lat(Y,t.zi), lon:px2lon(X,t.zi) }; }
function distSegPx(px,py,a,b){ const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy; let t=l2?((px-a.x)*dx+(py-a.y)*dy)/l2:0; t=Math.max(0,Math.min(1,t)); return Math.hypot(px-(a.x+t*dx), py-(a.y+t*dy)); }
function puntoEnAnillo(lon,lat,ring){ let d=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1]; if(((yi>lat)!=(yj>lat)) && (lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)) d=!d; } return d; }
function puntoEnPolig(lon,lat,rings){ let dentro=false; for(const r of rings){ if(puntoEnAnillo(lon,lat,r)) dentro=!dentro; } return dentro; }
/* --- herramientas de mapa: medición, navegación y chincheta --- */
let modoMapa = 'consulta';   // 'consulta' | 'medir' | 'navegar'
let medicion = { pts:[], unidad:'m' };
let chincheta = null;        // {lat,lon} referencia manual
let chinchetaBuf = 0;        // radio del buffer en metros (0 = sin buffer)
let navDestino = null;       // {lat,lon}
let navRuta = null;          // { coords:[[lon,lat]...], dist, dur }

function fmtDist(m, unidad){
  if(unidad==='km' || (unidad==null && m>=1000)) return (m/1000).toFixed(m>=10000?1:2)+' km';
  return m.toFixed(m<100?1:0)+' m';
}
function setModoMapa(m){
  modoMapa = (modoMapa===m) ? 'consulta' : m;
  document.getElementById('btnMedir').dataset.on = modoMapa==='medir' ? '1' : '0';
  document.getElementById('btnNav').dataset.on   = modoMapa==='navegar' ? '1' : '0';
  if(modoMapa==='medir' && !medicion.pts.length) toast('Tocá el mapa para agregar puntos de medición.');
  if(modoMapa==='navegar' && !navDestino) toast('Tocá un punto de destino en el mapa.');
  actualizarHerramienta(); pedirDibujo();
}
function actualizarHerramienta(){
  const barra = document.getElementById('herramienta');
  const txt = document.getElementById('herrTexto');
  const btns = document.getElementById('herrBotones');
  if(modoMapa==='medir'){
    barra.classList.add('on');
    let d = 0; for(let i=1;i<medicion.pts.length;i++) d += distM(medicion.pts[i-1].lat, medicion.pts[i-1].lon, medicion.pts[i].lat, medicion.pts[i].lon);
    txt.innerHTML = `<b>Medición</b> · ${medicion.pts.length} punto(s)<br>Distancia: <b>${fmtDist(d, medicion.unidad)}</b>`;
    btns.innerHTML = `<button id="hUnidad">${medicion.unidad==='km'?'m':'km'}</button><button id="hDeshacer">Deshacer</button><button id="hLimpiar">Limpiar</button><button id="hSalir">Salir</button>`;
    document.getElementById('hUnidad').onclick = ()=>{ medicion.unidad = medicion.unidad==='km'?'m':'km'; actualizarHerramienta(); };
    document.getElementById('hDeshacer').onclick = ()=>{ medicion.pts.pop(); actualizarHerramienta(); pedirDibujo(); };
    document.getElementById('hLimpiar').onclick = ()=>{ medicion.pts = []; actualizarHerramienta(); pedirDibujo(); };
    document.getElementById('hSalir').onclick = ()=> setModoMapa('medir');
  } else if(modoMapa==='navegar'){
    barra.classList.add('on');
    let info = 'Tocá un punto de destino.';
    if(navDestino){
      let recta = S.fix ? distM(S.fix.coords.latitude, S.fix.coords.longitude, navDestino.lat, navDestino.lon) : null;
      info = `<b>Destino</b> ${navDestino.lat.toFixed(5)}, ${navDestino.lon.toFixed(5)}<br>` +
             (recta!=null ? `En línea recta: <b>${fmtDist(recta)}</b>` : 'Esperando posición GPS…');
      if(navRuta) info += `<br>Por calles: <b>${fmtDist(navRuta.dist)}</b> · ${Math.round(navRuta.dur/60)} min`;
    }
    txt.innerHTML = info;
    btns.innerHTML = `<button class="pri" id="hRuta">Ruta por calles</button><button id="hQuitar">Quitar destino</button><button id="hSalir">Salir</button>`;
    document.getElementById('hRuta').onclick = calcularRutaCalles;
    document.getElementById('hQuitar').onclick = ()=>{ navDestino=null; navRuta=null; actualizarHerramienta(); pedirDibujo(); };
    document.getElementById('hSalir').onclick = ()=> setModoMapa('navegar');
  } else {
    barra.classList.remove('on');
  }
}
async function calcularRutaCalles(){
  if(!navDestino){ toast('Tocá un destino primero.'); return; }
  if(!S.fix){ toast('Sin posición GPS todavía.'); return; }
  const o = S.fix.coords;
  mostrarCargando('Calculando ruta…');
  try{
    // OSRM público (a pie). Requiere internet.
    const url = `https://router.project-osrm.org/route/v1/foot/${o.longitude},${o.latitude};${navDestino.lon},${navDestino.lat}?overview=full&geometries=geojson`;
    const r = await httpGet(url);
    const j = JSON.parse(bytesATexto(r.bytes));
    if(j && j.routes && j.routes.length){
      const rt = j.routes[0];
      navRuta = { coords: rt.geometry.coordinates, dist: rt.distance, dur: rt.duration };
      actualizarHerramienta(); pedirDibujo();
    } else { toast('No se encontró ruta por calles.'); }
  }catch(e){ toast('No se pudo calcular la ruta (requiere internet).'); }
  finally{ ocultarCargando(); }
}
// Dibuja medición y navegación sobre el mapa.
function dibujarHerramientas(aPant){
  // Medición: polilínea + vértices.
  if(medicion.pts.length){
    ctx.strokeStyle = '#4FD1C5'; ctx.lineWidth = 3; ctx.setLineDash([]);
    ctx.beginPath();
    medicion.pts.forEach((p,i)=>{ const s=aPant(p.lat,p.lon); if(i===0)ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y); });
    ctx.stroke();
    for(const p of medicion.pts){ const s=aPant(p.lat,p.lon); ctx.beginPath(); ctx.arc(s.x,s.y,5,0,7); ctx.fillStyle='#4FD1C5'; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#0A1214'; ctx.stroke(); }
  }
  // Navegación: ruta por calles (si hay) + línea recta al destino.
  if(navRuta && navRuta.coords){
    ctx.strokeStyle = '#6FCF6F'; ctx.lineWidth = 4; ctx.setLineDash([]);
    ctx.beginPath();
    navRuta.coords.forEach((c,i)=>{ const s=aPant(c[1],c[0]); if(i===0)ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y); });
    ctx.stroke();
  }
  if(navDestino){
    const d = aPant(navDestino.lat, navDestino.lon);
    if(S.fix){
      const o = aPant(S.fix.coords.latitude, S.fix.coords.longitude);
      ctx.strokeStyle = '#E0A458'; ctx.lineWidth = 2; ctx.setLineDash([8,6]);
      ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(d.x,d.y); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.beginPath(); ctx.arc(d.x,d.y,7,0,7); ctx.fillStyle='#E0A458'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#0A1214'; ctx.stroke();
  }
  // Chincheta manual + buffer circular.
  if(chincheta){
    if(chinchetaBuf>0){
      const circ = circuloGeo(chincheta.lat, chincheta.lon, chinchetaBuf, 72);
      ctx.beginPath();
      circ.forEach((c,i)=>{ const s=aPant(c[1],c[0]); if(i===0)ctx.moveTo(s.x,s.y); else ctx.lineTo(s.x,s.y); });
      ctx.closePath();
      ctx.fillStyle = 'rgba(199,81,70,.14)'; ctx.fill();
      ctx.strokeStyle = '#C75146'; ctx.lineWidth = 2; ctx.stroke();
    }
    const s = aPant(chincheta.lat, chincheta.lon);
    // Pin: círculo con "pata".
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x-6, s.y-12); ctx.lineTo(s.x+6, s.y-12); ctx.closePath();
    ctx.fillStyle = '#C75146'; ctx.fill();
    ctx.beginPath(); ctx.arc(s.x, s.y-16, 8, 0, 7); ctx.fillStyle = '#C75146'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#0A1214'; ctx.stroke();
    ctx.beginPath(); ctx.arc(s.x, s.y-16, 3, 0, 7); ctx.fillStyle = '#0A1214'; ctx.fill();
  }
}
// Círculo geográfico (buffer) de radio R metros alrededor de un punto.
function circuloGeo(lat, lon, R, n){
  n = n || 64; const pts = [];
  const dR = R/6371000, la = lat*D2R, lo = lon*D2R;
  for(let i=0;i<=n;i++){
    const brg = 2*Math.PI*i/n;
    const la2 = Math.asin(Math.sin(la)*Math.cos(dR) + Math.cos(la)*Math.sin(dR)*Math.cos(brg));
    const lo2 = lo + Math.atan2(Math.sin(brg)*Math.sin(dR)*Math.cos(la), Math.cos(dR)-Math.sin(la)*Math.sin(la2));
    pts.push([lo2*R2D, la2*R2D]);
  }
  return pts;
}

// Distancia mínima (px) del toque a una polilínea (segmentos, no solo vértices).
function distSegAny(px, py, pts){
  let m = Infinity;
  for(let i=1;i<pts.length;i++){ if(pts[i-1] && pts[i]){ const d = distSegPx(px,py,pts[i-1],pts[i]); if(d<m) m=d; } }
  if(pts.length===1 && pts[0]) m = Math.hypot(px-pts[0].x, py-pts[0].y);
  return m;
}
// Distancia en px del toque a una geometría (0 si el toque cae dentro de un polígono).
function distGeomPx(g, px, py, ll){
  if(!g) return Infinity;
  const P = c=> latlonAPantalla(c[1],c[0]);
  switch(g.type){
    case 'Point': { const p=P(g.coordinates); return p?Math.hypot(px-p.x,py-p.y):Infinity; }
    case 'MultiPoint': return Math.min(...g.coordinates.map(c=>{ const p=P(c); return p?Math.hypot(px-p.x,py-p.y):Infinity; }));
    case 'LineString': return distSegAny(px,py,g.coordinates.map(P));
    case 'MultiLineString': return Math.min(...g.coordinates.map(l=> distSegAny(px,py,l.map(P))));
    case 'Polygon': return puntoEnPolig(ll.lon,ll.lat,g.coordinates) ? 0 : Math.min(...g.coordinates.map(r=> distSegAny(px,py,r.map(P))));
    case 'MultiPolygon': return g.coordinates.some(poly=> puntoEnPolig(ll.lon,ll.lat,poly)) ? 0
                              : Math.min(...g.coordinates.map(poly=> Math.min(...poly.map(r=> distSegAny(px,py,r.map(P))))));
    case 'GeometryCollection': return Math.min(...(g.geometries||[]).map(gg=> distGeomPx(gg,px,py,ll)));
  }
  return Infinity;
}
function geomEsPoligono(g){
  if(!g) return false;
  if(g.type==='Polygon' || g.type==='MultiPolygon') return true;
  if(g.type==='GeometryCollection') return (g.geometries||[]).some(geomEsPoligono);
  return false;
}
function consultarEnPantalla(px,py){
  const ll = pantallaALatLon(px,py); if(!ll) return;
  // Margen en grados equivalente a la tolerancia en px, para descartar rápido
  // los elementos lejanos por su caja envolvente (capas grandes).
  const TOL = 44;
  const p1 = pantallaALatLon(px-TOL, py-TOL), p2 = pantallaALatLon(px+TOL, py+TOL);
  const loMar = p1&&p2 ? Math.abs(p2.lon-p1.lon) : 0.01;
  const laMar = p1&&p2 ? Math.abs(p1.lat-p2.lat) : 0.01;

  // 1) Elemento vectorial consultable MÁS CERCANO (punto, línea o polígono).
  //    A prueba de fallos: si el cálculo de distancia falla en una geometría,
  //    se ignora ese elemento; y como respaldo se guarda el más chico cuya
  //    caja envolvente contiene el toque (garantiza acierto en polígonos).
  let mejor=null, mejorDist=TOL, mejorCapa=null;
  let respaldo=null, respaldoArea=Infinity, respaldoCapa=null;
  for(let i=S.capas.length-1;i>=0;i--){
    const c = S.capas[i];
    if(!c.visible || c.tipo==='wms' || c.consultable===false || !c.geojson) continue;
    const feats = c.geojson.type==='FeatureCollection' ? (c.geojson.features||[]) : c.geojson.type==='Feature' ? [c.geojson] : [];
    for(const f of feats){
      if(!f || !f.geometry) continue;
      if(!f._bbox){ try{ f._bbox = bboxGeom(f.geometry); }catch(e){ continue; } }
      const b = f._bbox;
      if(!b || b[2]<ll.lon-loMar || b[0]>ll.lon+loMar || b[3]<ll.lat-laMar || b[1]>ll.lat+laMar) continue;
      // Respaldo SOLO para polígonos: ¿el toque cae dentro de su caja?
      if(geomEsPoligono(f.geometry) && ll.lon>=b[0] && ll.lon<=b[2] && ll.lat>=b[1] && ll.lat<=b[3]){
        const area = Math.max(1e-12, (b[2]-b[0])*(b[3]-b[1]));
        if(area < respaldoArea){ respaldoArea = area; respaldo = f; respaldoCapa = c; }
      }
      let d = Infinity;
      try{ d = distGeomPx(f.geometry, px, py, ll); }catch(e){ d = Infinity; }
      if(d < mejorDist){ mejorDist = d; mejor = f; mejorCapa = c; if(d===0) break; }
    }
    if(mejor && mejorDist===0) break;
  }
  if(mejor){ mostrarAtributos(mejorCapa, [mejor]); return; }
  if(respaldo){ mostrarAtributos(respaldoCapa, [respaldo]); return; }
  // 2) Punto del proyecto (marcado o promediado).
  let mejorP=null, mejorD=30;
  for(const p of S.puntos){ const s=latlonAPantalla(p.lat,p.lon); if(!s) continue; const d=Math.hypot(px-s.x,py-s.y); if(d<mejorD){ mejorD=d; mejorP=p; } }
  if(mejorP){ mostrarPunto(mejorP); return; }
  // 3) WMS: preguntar al servidor.
  for(let i=S.capas.length-1;i>=0;i--){
    const c = S.capas[i];
    if(!c.visible || c.tipo!=='wms' || c.consultable===false) continue;
    consultarWMS(c, px, py); return;
  }
  // 4) Nada cerca: dar retroalimentación en vez de quedarse mudo.
  const hayConsultables = S.capas.some(c=> c.visible && c.consultable!==false);
  if(S.capas.length && !hayConsultables) toast('Activá la lupa 🔍 en la capa para poder consultarla.');
  else if(hayConsultables) toast('No hay ningún elemento consultable en ese punto.');
}

function lon2merc(lon){ return lon*MERC_MAX/180; }
function lat2merc(lat){ const y = Math.log(Math.tan((90+lat)*Math.PI/360))/(Math.PI/180); return y*MERC_MAX/180; }
function wmsFeatureInfoUrl(layer, w, h, iPx, jPx, bbox){
  const v = layer.version || '1.3.0';
  const base = layer.url.split('?')[0];
  const p = new URLSearchParams({
    SERVICE:'WMS', VERSION:v, REQUEST:'GetFeatureInfo',
    LAYERS: layer.capa||'', QUERY_LAYERS: layer.capa||'', STYLES:'',
    FORMAT: layer.format||'image/png', INFO_FORMAT:'application/json',
    FEATURE_COUNT:'5', WIDTH:String(w), HEIGHT:String(h)
  });
  const crs = (v==='1.3.0') ? 'CRS=EPSG:3857' : 'SRS=EPSG:3857';
  const ij  = (v==='1.3.0') ? `I=${iPx}&J=${jPx}` : `X=${iPx}&Y=${jPx}`;
  return `${base}?${p.toString()}&${crs}&BBOX=${bbox}&${ij}`;
}
async function consultarWMS(capa, px, py){
  if(!ultimoT){ return; }
  mostrarCargando('Consultando capa…');
  try{
    const t = ultimoT;
    const oLon = px2lon(t.x0, t.zi), eLon = px2lon(t.x0 + W/t.esc, t.zi);
    const nLat = px2lat(t.y0, t.zi), sLat = px2lat(t.y0 + H/t.esc, t.zi);
    const bbox = `${lon2merc(oLon)},${lat2merc(sLat)},${lon2merc(eLon)},${lat2merc(nLat)}`;
    const url = wmsFeatureInfoUrl(capa, Math.round(W), Math.round(H), Math.round(px), Math.round(py), bbox);
    const r = await httpGet(url);
    const txt = bytesATexto(r.bytes);
    let gj = null; try{ gj = JSON.parse(txt); }catch(e){}
    if(gj && gj.features && gj.features.length){
      mostrarAtributos(capa, gj.features);
    } else {
      const limpio = txt.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      if(limpio && limpio.length > 2 && !/ServiceException|error/i.test(limpio.slice(0,80))){
        abrirPanel('Info · '+capa.nombre, `<div class="res"><div class="v" style="font-size:12px;white-space:pre-wrap;word-break:break-word">${escHtml(limpio.slice(0,1500))}</div></div>`);
      } else {
        toast('Sin datos en ese punto (o el servidor no soporta consulta).');
      }
    }
  }catch(e){ toast('No se pudo consultar la capa.'); }
  finally{ ocultarCargando(); }
}

async function escanearYListar(tipo){
  const url = document.getElementById('capUrl').value.trim();
  if(!url){ toast('Pegá la URL del servicio.'); return; }
  const cont = document.getElementById('capLista');
  cont.innerHTML = '<div class="k" style="margin-top:8px"><span class="spin" style="width:14px;height:14px;border-width:2px"></span> Escaneando el servicio…</div>';
  mostrarCargando('Escaneando '+tipo.toUpperCase()+'…');
  try{
    const capas = tipo==='wms' ? await escanearWMS(url) : await escanearWFS(url);
    if(!capas.length){ cont.innerHTML = '<div class="nota" style="border-color:var(--sangre)">No se encontraron capas. ¿La URL es del servicio '+tipo.toUpperCase()+'?</div>'; return; }
    cont.innerHTML = `<label>Capas disponibles (${capas.length})</label>
      <select id="capSel">${capas.map(c=>`<option value="${c.name.replace(/"/g,'&quot;')}">${(c.title||c.name).slice(0,60)}</option>`).join('')}</select>
      <button class="ancho" id="capAddSel">Agregar capa seleccionada</button>`;
    document.getElementById('capAddSel').onclick = ()=>{
      const name = document.getElementById('capSel').value;
      const title = document.getElementById('capSel').selectedOptions[0].textContent;
      if(tipo==='wms') agregarCapaWMS(title, url, name, '1.3.0');

    cont.innerHTML = '<div class="nota" style="border-color:var(--sangre)">No se pudo escanear: '+((e&&e.message)||e)+'. Verificá la URL del servicio.</div>';
  }finally{ ocultarCargando(); }
}

/* --- diagnosticos gnss (F0) --- */
// Constelaciones GnssStatus: 1=GPS 2=SBAS 3=GLONASS 4=QZSS 5=BEIDOU 6=GALILEO 7=IRNSS
const CONSTEL = {
  1:{n:'GPS',c:'#4FD1C5'}, 2:{n:'SBAS',c:'#8899AA'}, 3:{n:'GLONASS',c:'#C75146'},
  4:{n:'QZSS',c:'#B07CC6'}, 5:{n:'BeiDou',c:'#6FCF6F'}, 6:{n:'Galileo',c:'#E0A458'},
  7:{n:'IRNSS',c:'#E06AA0'}, 0:{n:'?',c:'#6E8B86'}
};
// Clasifica la frecuencia portadora (Hz) en banda GNSS.
function bandDe(freqHz){
  if(!freqHz) return null;
  const m = freqHz/1e6;
  if(Math.abs(m-1176.45)<10) return 'L5';   // GPS L5 / Galileo E5a / BeiDou B2a
  if(Math.abs(m-1207.14)<8)  return 'E5b';  // Galileo E5b / BeiDou B2b
  if(Math.abs(m-1202.025)<5) return 'L3';   // GLONASS L3
  if(Math.abs(m-1227.60)<10) return 'L2';   // GPS L2C
  if(Math.abs(m-1575.42)<10) return 'L1';   // GPS L1 / Galileo E1 / BeiDou B1C
  if(Math.abs(m-1561.098)<5) return 'B1I';  // BeiDou B1I
  if(m>1592 && m<1615)       return 'G1';   // GLONASS L1 (FDMA)
  if(m>1240 && m<1256)       return 'G2';   // GLONASS L2 (FDMA)
  return m.toFixed(0);
}
let gnssState = { satellites: [], location: null, dop: {}, gga: {}, listening: false };
let diagSamples = [];
let diagInterval = null;
let diagCleanup = null;

  abrirPanel('Diagnóstico GNSS (Fase 0)', `

        <div class="res"><div class="k">En fix</div><div class="v" id="gnssUsed">—</div></div>
        <div class="res"><div class="k">L5 detectados</div><div class="v" id="gnssL5">—</div></div>
        <div class="res"><div class="k">Proveedor</div><div class="v" id="gnssProv" style="font-size:11px">—</div></div>
        <div class="res"><div class="k">Exactitud horiz.</div><div class="v" id="gnssAccuracy">—</div></div>
        <div class="res"><div class="k">Exactitud vert.</div><div class="v" id="gnssVAccuracy">—</div></div>
        <div class="res"><div class="k">HDOP</div><div class="v" id="gnssHdop">—</div></div>

        <div class="res"><div class="k">PDOP</div><div class="v" id="gnssPdop">—</div></div>
        <div class="res"><div class="k">Sep. geoide</div><div class="v" id="gnssGeoid">—</div></div>

      <div class="nota">HDOP/VDOP vienen de NMEA (sentencia GSA). Si quedan en "—", tu chip no emite NMEA a la app; la exactitud en metros sí es fiable. Parate quieto ~1 min y exportá el CSV para comparar contra el Garmin.</div>
    </div>

  diagSamples = [];

  if(pluginGnss()){

      gnssState.listening = true;

      const hLoc = await Gnss.addListener('location',   (d)=> updateLocationUI(d.data));
      const hDop = await Gnss.addListener('dop',        (d)=> updateDopUI(d.data));
      const hGga = await Gnss.addListener('gga',        (d)=> updateGgaUI(d.data));
      // muestreo 1 Hz para el CSV
      diagInterval = setInterval(tomarMuestraDiag, 1000);
      // limpieza al cerrar el panel
      diagCleanup = async ()=>{

        diagAbierto = false;

    } catch(e){

      document.getElementById('gnssStatus').innerHTML = '<div class="nota" style="border-color:var(--sangre);">Plugin GNSS no disponible. Requiere API 24+ (Android 7+) y permiso de ubicación.</div>';

  } else {
    document.getElementById('gnssStatus').innerHTML = '<div class="nota" style="border-color:var(--sangre);">Capacitor no disponible. Ejecutá desde el APK, no desde el navegador.</div>';

function updateGnssUI(data){
  gnssState.satellites = data.satellites || [];
  const total = data.count || 0;
  const used = data.usedInFix || 0;
  // Conteo de bandas por frecuencia portadora.
  const tally = {};
  for(const s of gnssState.satellites){
    const b = bandDe(s.carrierFreq);
    if(b) tally[b] = (tally[b]||0) + 1;
  }
  const l5count = tally['L5'] || 0;
  document.getElementById('gnssTotal').textContent = total;
  document.getElementById('gnssUsed').textContent = used;
  document.getElementById('gnssL5').textContent = l5count;
  // Mostrar bandas ordenadas por cantidad, resaltando si hay L5.
  const orden = Object.keys(tally).sort((a,b)=> tally[b]-tally[a]);
  const bandasTxt = orden.length
    ? orden.map(b=> `${b}×${tally[b]}`).join('  ·  ')
    : 'sin datos de frecuencia';
  const bEl = document.getElementById('gnssBandas');
  if(bEl){ bEl.textContent = bandasTxt; bEl.style.color = l5count>0 ? 'var(--fix)' : 'var(--niebla)'; }

  // ordenar por C/N0 desc para leer los más fuertes primero
  const sats = gnssState.satellites.slice().sort((a,b)=> (b.cn0||0)-(a.cn0||0));
  let satHtml = '';
  for(const s of sats){
    const con = CONSTEL[s.constellation] || CONSTEL[0];
    const cn0 = s.cn0 || 0;
    const w = Math.max(2, Math.min(100, cn0*2)); // 0-50 dBHz -> 0-100%
    const freq = s.carrierFreq ? `${(s.carrierFreq/1e6).toFixed(0)}` : '';
    const l5 = s.isL5 ? ' L5' : '';
    const fixMark = s.usedInFix ? '●' : '○';
    satHtml += `<div style="display:flex;align-items:center;gap:6px;padding:3px 0;font-family:var(--mono);font-size:10px">
      <span style="color:${con.c};width:14px">${fixMark}</span>
      <span style="width:58px">${con.n.slice(0,3)}${String(s.svid).padStart(2,'0')}</span>
      <span style="flex:1;background:var(--cauce);height:8px;border-radius:4px;overflow:hidden"><i style="display:block;height:100%;width:${w}%;background:${con.c}"></i></span>
      <span style="width:34px;text-align:right">${cn0?cn0.toFixed(0):'—'}</span>
      <span style="width:30px;text-align:right;color:var(--musgo)">${freq}${l5}</span>
    </div>`;
  }
  document.getElementById('gnssSatList').innerHTML = satHtml || '<div style="color:var(--musgo);">Buscando satélites… (el primer fix GPS puro puede tardar 30-60s)</div>';
}
function updateLocationUI(data){
  gnssState.location = data;
  document.getElementById('gnssAccuracy').textContent = data.accuracy!=null ? `${data.accuracy.toFixed(1)}m` : '—';
  document.getElementById('gnssVAccuracy').textContent = data.verticalAccuracy ? `${data.verticalAccuracy.toFixed(1)}m` : '—';
  document.getElementById('gnssProv').textContent = data.provider || '—';
}
function updateDopUI(d){
  gnssState.dop = d;
  if(d.hdop!=null) document.getElementById('gnssHdop').textContent = d.hdop.toFixed(2);
  if(d.vdop!=null) document.getElementById('gnssVdop').textContent = d.vdop.toFixed(2);
  if(d.pdop!=null) document.getElementById('gnssPdop').textContent = d.pdop.toFixed(2);
}
function updateGgaUI(d){
  gnssState.gga = d;
  if(d.geoidSeparation!=null) document.getElementById('gnssGeoid').textContent = d.geoidSeparation.toFixed(1)+'m';
  if(d.hdop!=null && document.getElementById('gnssHdop').textContent==='—') document.getElementById('gnssHdop').textContent = d.hdop.toFixed(2);
}
function tomarMuestraDiag(){
  const loc = gnssState.location; if(!loc) return;
  const sats = gnssState.satellites || [];
  const cn0s = sats.filter(s=> s.cn0>0).map(s=> s.cn0);
  const tally = {};
  for(const s of sats){ const b = bandDe(s.carrierFreq); if(b) tally[b]=(tally[b]||0)+1; }
  const bandas = Object.keys(tally).sort((a,b)=> tally[b]-tally[a]).map(b=> `${b}x${tally[b]}`).join(' ');
  const row = {
    t: new Date().toISOString(),
    lat: loc.latitude, lon: loc.longitude,
    alt: loc.altitude, accH: loc.accuracy, accV: loc.verticalAccuracy,
    total: sats.length, usados: sats.filter(s=> s.usedInFix).length,
    l5: tally['L5'] || 0,
    cn0min: cn0s.length? Math.min(...cn0s):null, cn0max: cn0s.length? Math.max(...cn0s):null,
    hdop: gnssState.dop.hdop, vdop: gnssState.dop.vdop, pdop: gnssState.dop.pdop,
    geoid: gnssState.gga.geoidSeparation, prov: loc.provider, bandas: bandas
  };
  diagSamples.push(row);
  document.getElementById('diagCount').textContent = diagSamples.length;
}
function exportarDiagCSV(){
  if(!diagSamples.length){ toast('Sin muestras todavía. Esperá unos segundos.'); return; }
  const enc = ['timestamp','lat','lon','altura_elip_m','exac_h_m','exac_v_m','sats_total','sats_usados','l5','cn0_min','cn0_max','hdop','vdop','pdop','geoide_m','proveedor','bandas'];
  const num = (v,d=6)=> v==null?'':(typeof v==='number'? v.toFixed(d):v);
  const filas = diagSamples.map(r=> [
    r.t, num(r.lat,7), num(r.lon,7), num(r.alt,1), num(r.accH,1), num(r.accV,1),
    r.total??'', r.usados??'', r.l5??'', num(r.cn0min,1), num(r.cn0max,1),
    num(r.hdop,2), num(r.vdop,2), num(r.pdop,2), num(r.geoid,1), r.prov||'', r.bandas||''
  ].join(','));
  bajar('diagnostico_gnss_'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.csv',
        enc.join(',')+'\n'+filas.join('\n'), 'text/csv');
}

(async ()=>{
  await abrirDB();
  await migrarAGeoJSON();
  S.modo = await dbGet('conf','modo') || 'geo';
  S.capa = await dbGet('conf','capa') || 'sat';
  const filtGuardados = await dbGet('conf','filtros');
  if(filtGuardados) S.filtros = Object.assign(S.filtros, filtGuardados);
  try{ S.capas = await dbAll('capas') || []; }catch(e){ S.capas = []; }
  // Última ubicación conocida: evita arrancar en una zona random (Quepos por defecto).
  const uc = await dbGet('conf','ultimoCentro');
  if(uc && uc.lat!=null){ S.centro.lat = uc.lat; S.centro.lon = uc.lon; if(uc.zoom) S.zoom = uc.zoom; }
  document.querySelectorAll('#modo button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.m===S.modo));
  document.getElementById('btnCapa').textContent = CAPAS[S.capa].nom;
  document.getElementById('coordSys').textContent = PROY[S.modo].nom;
  const pa = await dbGet('conf','proyActivo');
  if(pa && await dbGet('proyectos', pa)) await cargarProyecto(pa);
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
  // Mostrar "buscando GPS" hasta el primer fix.
  document.getElementById('cargaGps').classList.add('on');
  document.getElementById('cargaGpsCerrar').onclick = ()=> document.getElementById('cargaGps').classList.remove('on');
  medir(); dibujarAnillo(null);
  window.addEventListener('resize', medir);
  window.addEventListener('online',  ()=> dibujar());
  window.addEventListener('offline', ()=>{ document.getElementById('estadoRed').textContent = 'SIN RED · MAPA CACHÉ'; });
  // Capacitor: pedir permiso de ubicación nativo ANTES de arrancar la fuente
  // (el GPS puro nativo también requiere ACCESS_FINE_LOCATION).
  try{
    const Geo = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Geolocation;
    if(Geo) await Geo.requestPermissions();
  }catch(e){}
  await arrancarGPS();
})();
