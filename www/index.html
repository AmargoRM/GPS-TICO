<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A1214">
<title>Garúa Campo</title>
<style>
:root{
  --abismo:#0A1214;
  --lecho:#122023;
  --cauce:#1B3136;
  --niebla:#DCE6E4;
  --musgo:#6E8B86;
  --fix:#4FD1C5;
  --alerta:#E0A458;
  --sangre:#C75146;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", "DejaVu Sans Mono", monospace;
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--abismo);color:var(--niebla);font-family:var(--ui);overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ---------- barra superior ---------- */
#top{display:flex;align-items:stretch;background:var(--lecho);border-bottom:1px solid var(--cauce);flex:none}
#proyBtn{flex:1;min-width:0;background:none;border:none;color:var(--niebla);text-align:left;padding:8px 12px;font-family:var(--ui)}
#proyBtn .lbl{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--musgo)}
#proyBtn .val{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modo{display:flex;flex:none}
#modo button{background:none;border:none;border-left:1px solid var(--cauce);color:var(--musgo);font-family:var(--mono);font-size:10px;letter-spacing:.06em;padding:0 9px}
#modo button[aria-pressed="true"]{background:var(--cauce);color:var(--fix)}

/* ---------- mapa ---------- */
#mapaWrap{flex:1;position:relative;min-height:0;background:var(--abismo)}
#mapa{width:100%;height:100%;display:block;touch-action:none}
#capaBtns{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.flot{background:rgba(18,32,35,.92);border:1px solid var(--cauce);color:var(--niebla);border-radius:6px;padding:8px 10px;font-size:11px;font-family:var(--mono);backdrop-filter:blur(6px)}
button.flot:active{background:var(--cauce)}
#estadoRed{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--musgo);background:rgba(10,18,20,.8);padding:4px 7px;border-radius:4px}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--cauce);color:var(--niebla);font-size:12px;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1}

/* ---------- lectura ---------- */
#lectura{flex:none;background:var(--lecho);border-top:1px solid var(--cauce);padding:10px 12px 6px}
#coordFila{display:flex;align-items:center;gap:12px}
#anillo{flex:none}
#coords{flex:1;min-width:0}
#coordSys{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--musgo);margin-bottom:3px}
#coordA,#coordB{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.28;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#coordC{font-family:var(--mono);font-size:11px;color:var(--musgo);margin-top:2px}
#metricas{display:flex;gap:0;margin-top:9px;border-top:1px solid var(--cauce);padding-top:7px}
.met{flex:1;text-align:center;border-right:1px solid var(--cauce)}
.met:last-child{border-right:none}
.met .n{font-family:var(--mono);font-size:14px;font-weight:600}
.met .u{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--musgo)}
#acciones{display:flex;gap:8px;padding:8px 12px 10px;background:var(--lecho);flex:none}
#acciones button{flex:1;border:1px solid var(--cauce);background:var(--cauce);color:var(--niebla);border-radius:8px;padding:13px 4px;font-size:13px;font-weight:600;font-family:var(--ui)}
#acciones button:active{opacity:.65}
#btnTrack[data-on="1"]{background:var(--sangre);border-color:var(--sangre)}
#btnMenu{flex:0 0 52px !important;background:var(--lecho) !important;color:var(--musgo) !important}

/* ---------- paneles ---------- */
#velo{position:fixed;inset:0;background:rgba(10,18,20,.72);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
#velo.on{opacity:1;pointer-events:auto}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:var(--lecho);border-top:1px solid var(--fix);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.3,1);z-index:11;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#panel.on{transform:translateY(0)}
#panelHead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;flex:none}
#panelTitulo{font-size:15px;font-weight:700}
#panelCerrar{background:none;border:none;color:var(--musgo);font-size:22px;padding:0 6px}
#panelCuerpo{overflow-y:auto;padding:0 16px 20px;-webkit-overflow-scrolling:touch}

.fila{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--cauce)}
.fila:last-child{border-bottom:none}
.fila .cuerpo{flex:1;min-width:0}
.fila .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .s{font-size:11px;color:var(--musgo);font-family:var(--mono);margin-top:2px}
.mini{background:var(--cauce);border:none;color:var(--niebla);border-radius:6px;padding:7px 11px;font-size:11px;font-family:var(--ui);font-weight:600;flex:none}
.mini.rojo{background:transparent;color:var(--sangre);border:1px solid var(--sangre)}
.mini.verde{background:var(--fix);color:var(--abismo)}
input,select,textarea{width:100%;background:var(--abismo);border:1px solid var(--cauce);color:var(--niebla);border-radius:7px;padding:11px;font-family:var(--mono);font-size:14px;margin-top:5px}
label{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--musgo);margin-top:13px}
.ancho{width:100%;background:var(--fix);color:var(--abismo);border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:700;margin-top:16px;font-family:var(--ui)}
.ancho.borde{background:transparent;border:1px solid var(--cauce);color:var(--niebla)}
.nota{font-size:11px;line-height:1.55;color:var(--musgo);margin-top:12px;border-left:2px solid var(--alerta);padding-left:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{background:var(--abismo);border:1px solid var(--cauce);border-radius:8px;padding:11px;margin-top:9px}
.res .k{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--musgo)}
.res .v{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:3px;word-break:break-all}
.vacio{text-align:center;color:var(--musgo);font-size:12px;padding:34px 10px;line-height:1.6}
.barra{height:4px;background:var(--cauce);border-radius:2px;overflow:hidden;margin-top:10px}
.barra i{display:block;height:100%;background:var(--fix);width:0;transition:width .2s}
</style>
</head>
<body>

<div id="top">
  <button id="proyBtn"><span class="lbl">Proyecto</span><span class="val" id="proyNom">—</span></button>
  <div id="modo">
    <button data-m="geo" aria-pressed="true">GEO</button>
    <button data-m="crtm05" aria-pressed="false">CRTM05</button>
    <button data-m="ln" aria-pressed="false">LAM·N</button>
    <button data-m="ls" aria-pressed="false">LAM·S</button>
  </div>
</div>

<div id="mapaWrap">
  <canvas id="mapa"></canvas>
  <div id="estadoRed">BUSCANDO SEÑAL</div>
  <div id="capaBtns">
    <button class="flot" id="btnCapa">SATÉLITE</button>
    <button class="flot" id="btnCentrar">◎</button>
  </div>
  <div id="toast"></div>
</div>

<div id="lectura">
  <div id="coordFila">
    <canvas id="anillo" width="112" height="112" style="width:56px;height:56px"></canvas>
    <div id="coords">
      <div id="coordSys">Geográficas · WGS84</div>
      <div id="coordA">—</div>
      <div id="coordB">—</div>
      <div id="coordC"></div>
    </div>
  </div>
  <div id="metricas">
    <div class="met"><div class="n" id="mExac">—</div><div class="u">Exactitud m</div></div>
    <div class="met"><div class="n" id="mAlt">—</div><div class="u" id="mAltU">Altura m</div></div>
    <div class="met"><div class="n" id="mVel">—</div><div class="u">km/h</div></div>
    <div class="met"><div class="n" id="mRec">—</div><div class="u">Track m</div></div>
  </div>
</div>

<div id="acciones">
  <button id="btnWp">Marcar punto</button>
  <button id="btnTrack" data-on="0">Grabar track</button>
  <button id="btnMenu">☰</button>
</div>

<div id="velo"></div>
<div id="panel">
  <div id="panelHead"><div id="panelTitulo"></div><button id="panelCerrar">×</button></div>
  <div id="panelCuerpo"></div>
</div>

<script>
"use strict";

/* =======================================================================
   1. GEODESIA
   Implementado a mano, sin librerías externas, para que funcione
   100% sin internet. Fórmulas: Snyder / EPSG guidance note 7-2.
   ======================================================================= */

const D2R = Math.PI/180, R2D = 180/Math.PI;

const ELI = {
  wgs84:   { a: 6378137.0,   f: 1/298.257223563 },
  clarke66:{ a: 6378206.4,   f: 1/294.978698213898 }
};

// --- Transverse Mercator (EPSG 9807) ---
function tmFwd(lat, lon, P){
  const {a,f} = P.eli, e2 = 2*f - f*f, ep2 = e2/(1-e2);
  const phi = lat*D2R, lam = lon*D2R, lam0 = P.lon0*D2R, phi0 = P.lat0*D2R;
  const N = a/Math.sqrt(1 - e2*Math.sin(phi)**2);
  const T = Math.tan(phi)**2;
  const C = ep2*Math.cos(phi)**2;
  const A = (lam-lam0)*Math.cos(phi);
  const M  = meridArc(phi, a, e2);
  const M0 = meridArc(phi0, a, e2);
  const x = P.fe + P.k0*N*(A + (1-T+C)*A**3/6 + (5-18*T+T*T+72*C-58*ep2)*A**5/120);
  const y = P.fn + P.k0*(M-M0 + N*Math.tan(phi)*(A*A/2 + (5-T+9*C+4*C*C)*A**4/24
            + (61-58*T+T*T+600*C-330*ep2)*A**6/720));
  return {e:x, n:y};
}
function tmInv(x, y, P){
  const {a,f} = P.eli, e2 = 2*f - f*f, ep2 = e2/(1-e2);
  const lam0 = P.lon0*D2R, phi0 = P.lat0*D2R;
  const M = meridArc(phi0,a,e2) + (y-P.fn)/P.k0;
  const mu = M/(a*(1 - e2/4 - 3*e2**2/64 - 5*e2**3/256));
  const e1 = (1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const p1 = mu + (3*e1/2 - 27*e1**3/32)*Math.sin(2*mu)
           + (21*e1**2/16 - 55*e1**4/32)*Math.sin(4*mu)
           + (151*e1**3/96)*Math.sin(6*mu) + (1097*e1**4/512)*Math.sin(8*mu);
  const C1 = ep2*Math.cos(p1)**2, T1 = Math.tan(p1)**2;
  const N1 = a/Math.sqrt(1 - e2*Math.sin(p1)**2);
  const R1 = a*(1-e2)/Math.pow(1 - e2*Math.sin(p1)**2, 1.5);
  const D = (x-P.fe)/(N1*P.k0);
  const phi = p1 - (N1*Math.tan(p1)/R1)*(D*D/2 - (5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24
            + (61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lam = lam0 + (D - (1+2*T1+C1)*D**3/6
            + (5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/Math.cos(p1);
  return {lat: phi*R2D, lon: lam*R2D};
}
function meridArc(phi, a, e2){
  return a*((1 - e2/4 - 3*e2**2/64 - 5*e2**3/256)*phi
    - (3*e2/8 + 3*e2**2/32 + 45*e2**3/1024)*Math.sin(2*phi)
    + (15*e2**2/256 + 45*e2**3/1024)*Math.sin(4*phi)
    - (35*e2**3/3072)*Math.sin(6*phi));
}

// --- Lambert Conformal Conic 1SP (EPSG 9801) ---
function lccT(phi, e){
  const s = e*Math.sin(phi);
  return Math.tan(Math.PI/4 - phi/2)/Math.pow((1-s)/(1+s), e/2);
}
function lccFwd(lat, lon, P){
  const {a,f} = P.eli, e2 = 2*f - f*f, e = Math.sqrt(e2);
  const phi = lat*D2R, lam = lon*D2R, phi0 = P.lat0*D2R, lam0 = P.lon0*D2R;
  const m0 = Math.cos(phi0)/Math.sqrt(1 - e2*Math.sin(phi0)**2);
  const t0 = lccT(phi0,e), t = lccT(phi,e);
  const n = Math.sin(phi0);
  const F = m0/(n*Math.pow(t0,n));
  const r  = a*F*Math.pow(t,n)*P.k0;
  const r0 = a*F*Math.pow(t0,n)*P.k0;
  const th = n*(lam-lam0);
  return { e: P.fe + r*Math.sin(th), n: P.fn + r0 - r*Math.cos(th) };
}
function lccInv(x, y, P){
  const {a,f} = P.eli, e2 = 2*f - f*f, e = Math.sqrt(e2);
  const phi0 = P.lat0*D2R, lam0 = P.lon0*D2R;
  const m0 = Math.cos(phi0)/Math.sqrt(1 - e2*Math.sin(phi0)**2);
  const t0 = lccT(phi0,e), n = Math.sin(phi0);
  const F = m0/(n*Math.pow(t0,n));
  const r0 = a*F*Math.pow(t0,n)*P.k0;
  const dx = x-P.fe, dy = r0 - (y-P.fn);
  const rp = Math.sign(n)*Math.sqrt(dx*dx + dy*dy);
  const th = Math.atan2(Math.sign(n)*dx, Math.sign(n)*dy);
  const tp = Math.pow(rp/(a*F*P.k0), 1/n);
  const lam = th/n + lam0;
  let phi = Math.PI/2 - 2*Math.atan(tp);
  for(let i=0;i<12;i++){
    const s = e*Math.sin(phi);
    const np = Math.PI/2 - 2*Math.atan(tp*Math.pow((1-s)/(1+s), e/2));
    if(Math.abs(np-phi) < 1e-12){ phi = np; break; }
    phi = np;
  }
  return {lat: phi*R2D, lon: lam*R2D};
}

// --- Helmert 7 parámetros, convención Position Vector ---
// Ocotepeque 1935 -> CR05 (EPSG:6890). Rotaciones en segundos de arco, escala en ppm.
const OCO2CR05 = { dx:213.116, dy:9.358, dz:-74.946, rx:1.14e-05, ry:-2.98e-07, rz:3.1e-05, s:5.22 };
const SEC2RAD = Math.PI/(180*3600);

function geo2ecef(lat, lon, h, eli){
  const {a,f} = eli, e2 = 2*f - f*f;
  const p = lat*D2R, l = lon*D2R;
  const N = a/Math.sqrt(1 - e2*Math.sin(p)**2);
  return [ (N+h)*Math.cos(p)*Math.cos(l), (N+h)*Math.cos(p)*Math.sin(l), (N*(1-e2)+h)*Math.sin(p) ];
}
function ecef2geo(X, Y, Z, eli){
  const {a,f} = eli, e2 = 2*f - f*f, b = a*(1-f), ep2 = (a*a - b*b)/(b*b);
  const p = Math.hypot(X,Y), th = Math.atan2(Z*a, p*b);
  const lat = Math.atan2(Z + ep2*b*Math.sin(th)**3, p - e2*a*Math.cos(th)**3);
  const lon = Math.atan2(Y,X);
  const N = a/Math.sqrt(1 - e2*Math.sin(lat)**2);
  return { lat: lat*R2D, lon: lon*R2D, h: p/Math.cos(lat) - N };
}
function helmert(X,Y,Z,P,inv){
  const rx=P.rx*SEC2RAD, ry=P.ry*SEC2RAD, rz=P.rz*SEC2RAD, s=P.s*1e-6;
  if(!inv){
    return [ P.dx + (1+s)*( X - rz*Y + ry*Z),
             P.dy + (1+s)*( rz*X + Y - rx*Z),
             P.dz + (1+s)*(-ry*X + rx*Y + Z) ];
  }
  const x=(X-P.dx)/(1+s), y=(Y-P.dy)/(1+s), z=(Z-P.dz)/(1+s);
  return [ x + rz*y - ry*z, -rz*x + y + rx*z, ry*x - rx*y + z ];
}
function ocoToWgs(lat,lon){
  const [X,Y,Z] = geo2ecef(lat,lon,0,ELI.clarke66);
  const [A,B,C] = helmert(X,Y,Z,OCO2CR05,false);
  return ecef2geo(A,B,C,ELI.wgs84);
}
function wgsToOco(lat,lon){
  const [X,Y,Z] = geo2ecef(lat,lon,0,ELI.wgs84);
  const [A,B,C] = helmert(X,Y,Z,OCO2CR05,true);
  return ecef2geo(A,B,C,ELI.clarke66);
}

// --- Definiciones oficiales de Costa Rica ---
const CRTM05 = { eli:ELI.wgs84, lat0:0, lon0:-84, k0:0.9999, fe:500000, fn:0 };
const LAM_N  = { eli:ELI.clarke66, lat0:10+28/60, lon0:-(84+20/60), k0:0.99995696, fe:500000, fn:271820.522 };
const LAM_S  = { eli:ELI.clarke66, lat0:9,        lon0:-(83+40/60), k0:0.99995696, fe:500000, fn:327987.436 };

const PROY = {
  geo:    { nom:'Geográficas · WGS84',              epsg:'EPSG:4326' },
  crtm05: { nom:'CRTM05 · CR05',                    epsg:'EPSG:5367' },
  ln:     { nom:'Lambert Norte · Ocotepeque',       epsg:'EPSG:5456' },
  ls:     { nom:'Lambert Sur · Ocotepeque',         epsg:'EPSG:5457' }
};

function desdeWgs(lat, lon, modo){
  if(modo==='geo')    return {lat, lon};
  if(modo==='crtm05') return tmFwd(lat, lon, CRTM05);
  const o = wgsToOco(lat, lon);
  return lccFwd(o.lat, o.lon, modo==='ln' ? LAM_N : LAM_S);
}
function haciaWgs(a, b, modo){
  if(modo==='geo')    return {lat:a, lon:b};
  if(modo==='crtm05') return tmInv(a, b, CRTM05);
  const g = lccInv(a, b, modo==='ln' ? LAM_N : LAM_S);
  return ocoToWgs(g.lat, g.lon);
}

/* --- formato --- */
function gms(v, esLat){
  const h = v<0 ? (esLat?'S':'W') : (esLat?'N':'E');
  v = Math.abs(v);
  const g = Math.floor(v), m = Math.floor((v-g)*60), s = ((v-g)*60-m)*60;
  return `${g}° ${String(m).padStart(2,'0')}' ${s.toFixed(2).padStart(5,'0')}" ${h}`;
}
function fmtCoord(lat, lon, modo){
  if(modo==='geo'){
    return { a:gms(lat,true), b:gms(lon,false), c:`${lat.toFixed(6)}, ${lon.toFixed(6)}` };
  }
  const p = desdeWgs(lat, lon, modo);
  return { a:`E  ${p.e.toFixed(2)}`, b:`N  ${p.n.toFixed(2)}`, c:PROY[modo].epsg + ' · metros' };
}
function distM(a1,o1,a2,o2){
  const R=6371008.8, dp=(a2-a1)*D2R, dl=(o2-o1)*D2R;
  const x = Math.sin(dp/2)**2 + Math.cos(a1*D2R)*Math.cos(a2*D2R)*Math.sin(dl/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

/* =======================================================================
   2. ALMACENAMIENTO (IndexedDB)
   ======================================================================= */
let DB = null;
function abrirDB(){
  return new Promise((ok, mal)=>{
    const r = indexedDB.open('garua-campo', 2);
    r.onupgradeneeded = ()=>{
      const d = r.result;
      if(!d.objectStoreNames.contains('proyectos')) d.createObjectStore('proyectos',{keyPath:'id'});
      if(!d.objectStoreNames.contains('puntos'))    d.createObjectStore('puntos',{keyPath:'id'}).createIndex('proy','proy');
      if(!d.objectStoreNames.contains('tracks'))    d.createObjectStore('tracks',{keyPath:'id'}).createIndex('proy','proy');
      if(!d.objectStoreNames.contains('tiles'))     d.createObjectStore('tiles');
      if(!d.objectStoreNames.contains('conf'))      d.createObjectStore('conf');
      if(!d.objectStoreNames.contains('capas'))     d.createObjectStore('capas',{keyPath:'id'}); // capas del usuario (F: capas)
    };
    r.onsuccess = ()=>{ DB = r.result; ok(DB); };
    r.onerror = ()=> mal(r.error);
  });
}
function tx(store, modo='readonly'){ return DB.transaction(store, modo).objectStore(store); }
function pedir(req){ return new Promise((ok,mal)=>{ req.onsuccess=()=>ok(req.result); req.onerror=()=>mal(req.error); }); }
const dbGet   = (s,k)=> pedir(tx(s).get(k));
const dbAll   = (s)=> pedir(tx(s).getAll());
const dbPut   = (s,v,k)=> pedir(tx(s,'readwrite').put(v,k));
const dbDel   = (s,k)=> pedir(tx(s,'readwrite').delete(k));
const porIndice = (s,i,v)=> pedir(tx(s).index(i).getAll(v));
const nid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);

// Conversión a GeoJSON
function puntoAFeature(p){
  return { type:'Feature', geometry:{type:'Point',coordinates:[p.lon,p.lat]},
    properties:{id:p.id,proy:p.proy,nom:p.nom,alt:p.alt,exac:p.exac,t:p.t,timestamp:p.timestamp||p.t} };
}
function trackAFeature(t){
  const coords = t.pts.map(p=>[p.lon,p.lat]);
  return { type:'Feature', geometry:{type:'LineString',coordinates:coords},
    properties:{id:t.id,proy:t.proy,nom:t.nom,dist:t.dist,ini:t.ini,puntos:t.pts.length} };
}
async function migrarAGeoJSON(){
  const migrado = await dbGet('conf','geojson_v1');
  if(migrado) return;
  try{
    const tracks = await dbAll('tracks');
    for(const t of tracks){
      if(!t.geojson){
        const feature = trackAFeature(t);
        t.geojson = feature;
        await dbPut('tracks', t);
      }
    }
    const puntos = await dbAll('puntos');
    for(const p of puntos){
      if(!p.geojson){
        const feature = puntoAFeature(p);
        p.geojson = feature;
        await dbPut('puntos', p);
      }
    }
    await dbPut('conf', true, 'geojson_v1');
  }catch(e){ console.error('Migración GeoJSON:', e); }
}

const S = {
  modo: 'geo',
  capa: 'sat',
  fuente: 'fused',     // fuente de posición: 'fused' | 'gps' (F1)
  filtros: { activo:false, preset:'normal', hdopMax:5, satMin:6, exacMax:10, cn0Min:20, avisar:true }, // F5
  proy: null,          // proyecto activo
  fix: null,           // último fix normalizado (coords + metadatos)
  capas: [],           // capas del usuario (GeoJSON/WFS/WMS)
  grabando: null,      // track en curso
  seguir: true,        // centrar mapa en el fix
  centro: { lat: 9.4318, lon: -84.1620 },   // Quepos
  zoom: 15,
  puntos: [],
  tracks: []
};

const CAPAS = {
  sat: { nom:'SATÉLITE', url:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`, max:19, cred:'Esri, Maxar, Earthstar Geographics' },
  osm: { nom:'CALLES',   url:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`, max:19, cred:'© OpenStreetMap contributors' }
};

/* =======================================================================
   4. MAPA (slippy map propio sobre canvas, sin librerías)
   ======================================================================= */
const cv = document.getElementById('mapa'), ctx = cv.getContext('2d');
let DPR = 1, W = 0, H = 0;
const memTiles = new Map();       // cache en RAM
const pidiendo = new Set();

function lon2px(lon,z){ return (lon+180)/360 * 256 * 2**z; }
function lat2px(lat,z){
  const s = Math.sin(lat*D2R);
  return (0.5 - Math.log((1+s)/(1-s))/(4*Math.PI)) * 256 * 2**z;
}
function px2lon(x,z){ return x/(256*2**z)*360 - 180; }
function px2lat(y,z){
  const n = Math.PI - 2*Math.PI*y/(256*2**z);
  return R2D*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));
}

function medir(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  const r = cv.parentElement.getBoundingClientRect();
  W = r.width; H = r.height;
  cv.width = W*DPR; cv.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  dibujar();
}

// tileGen() es SINCRÓNICA: devuelve el tile de la caché en RAM si está,
// o null y dispara la carga en segundo plano (que al terminar redibuja).
// Sirve para el mapa base y para capas WMS del usuario.
function tileGen(k, url, nativo){
  if(memTiles.has(k)) return memTiles.get(k);
  if(pidiendo.has(k)) return null;
  pidiendo.add(k);
  cargarTileURL(k, url, nativo);
  return null;
}
async function cargarTileURL(k, url, nativo){
  try{
    let blob = await dbGet('tiles', k);
    if(!blob){
      if(!navigator.onLine){ pidiendo.delete(k); return; }
      try{
        if(nativo){
          // WMS: bajar por nativo para saltar CORS.
          const r = await httpGet(url);
          if(r.status<200 || r.status>=400) throw 0;
          blob = new Blob([r.bytes], {type: r.contentType || 'image/png'});
        } else {
          const r = await fetch(url, {signal: AbortSignal.timeout(8000)});
          if(!r.ok) throw 0;
          blob = await r.blob();
        }
        dbPut('tiles', blob, k).catch(()=>{});
      }catch(e){
        pidiendo.delete(k); return;
      }
    }
    const img = await createImageBitmap(blob);
    if(memTiles.size > 400){ for(const kk of Array.from(memTiles.keys()).slice(0,150)) memTiles.delete(kk); }
    memTiles.set(k, img);
    pidiendo.delete(k);
    dibujar();
  }catch(e){ pidiendo.delete(k); }
}
function tile(z,x,y,capa){
  const n = 2**z;
  x = ((x%n)+n)%n;
  if(y<0 || y>=n) return null;
  return tileGen(`${capa}/${z}/${x}/${y}`, CAPAS[capa].url(z,x,y));
}
// Capa WMS del usuario: construye la petición GetMap con la bbox del tile en
// Web Mercator (EPSG:3857) y la cachea igual que el mapa base.
const MERC_MAX = 20037508.342789244;
function wmsUrl(layer, z, x, y){
  const n = 2**z;
  const tileSize = (MERC_MAX*2) / n;
  const minx = -MERC_MAX + x*tileSize;
  const maxx = minx + tileSize;
  const maxy = MERC_MAX - y*tileSize;
  const miny = maxy - tileSize;
  const v = layer.version || '1.3.0';
  const base = layer.url.split('?')[0];
  const p = new URLSearchParams({
    SERVICE:'WMS', REQUEST:'GetMap', VERSION:v,
    LAYERS: layer.capa||'', STYLES:'',
    FORMAT: layer.format||'image/png', TRANSPARENT:'true',
    WIDTH:'256', HEIGHT:'256'
  });
  // EPSG:3857 usa orden X,Y en ambas versiones.
  const crs = (v==='1.3.0') ? ('CRS=EPSG:3857') : ('SRS=EPSG:3857');
  return `${base}?${p.toString()}&${crs}&BBOX=${minx},${miny},${maxx},${maxy}`;
}
function tileWMS(z,x,y,layer){
  const n = 2**z;
  x = ((x%n)+n)%n;
  if(y<0 || y>=n) return null;
  return tileGen(`wms_${layer.id}/${z}/${x}/${y}`, wmsUrl(layer, z, x, y), true);
}

// Dibuja las capas vectoriales del usuario (GeoJSON/WFS) sobre el mapa.
function dibujarCapasVector(aPant){
  for(const capa of S.capas){
    if(!capa.visible || capa.tipo==='wms' || !capa.geojson) continue;
    const fc = capa.geojson;
    const feats = fc.type==='FeatureCollection' ? (fc.features||[])
                : fc.type==='Feature' ? [fc] : [];
    const color = capa.color || '#E0A458';
    for(const f of feats) dibujarGeom(f && f.geometry, aPant, color);
  }
}
function dibujarGeom(g, aPant, color){
  if(!g) return;
  const linea = (coords, cerrar)=>{
    ctx.beginPath();
    for(let i=0;i<coords.length;i++){ const p = aPant(coords[i][1], coords[i][0]); if(i===0) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y); }
    if(cerrar){ ctx.closePath(); ctx.fillStyle = color+'33'; ctx.fill(); }
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  };
  const punto = (c)=>{ const p = aPant(c[1],c[0]); ctx.beginPath(); ctx.arc(p.x,p.y,4,0,7); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle='#0A1214'; ctx.stroke(); };
  switch(g.type){
    case 'Point': punto(g.coordinates); break;
    case 'MultiPoint': g.coordinates.forEach(punto); break;
    case 'LineString': linea(g.coordinates, false); break;
    case 'MultiLineString': g.coordinates.forEach(l=> linea(l,false)); break;
    case 'Polygon': g.coordinates.forEach(r=> linea(r,true)); break;
    case 'MultiPolygon': g.coordinates.forEach(poly=> poly.forEach(r=> linea(r,true))); break;
    case 'GeometryCollection': (g.geometries||[]).forEach(gg=> dibujarGeom(gg, aPant, color)); break;
  }
}

function dibujar(){
  if(!W) return;
  ctx.fillStyle = '#0A1214'; ctx.fillRect(0,0,W,H);

  const zi = Math.max(2, Math.min(CAPAS[S.capa].max, Math.round(S.zoom)));
  const esc = 2**(S.zoom - zi);
  const ts = 256*esc;
  const cx = lon2px(S.centro.lon, zi), cy = lat2px(S.centro.lat, zi);
  const x0 = cx - (W/2)/esc, y0 = cy - (H/2)/esc;
  const tx0 = Math.floor(x0/256), ty0 = Math.floor(y0/256);
  const tx1 = Math.floor((x0 + W/esc)/256), ty1 = Math.floor((y0 + H/esc)/256);

  ctx.imageSmoothingEnabled = true;
  let hayTiles = false;
  for(let ty=ty0; ty<=ty1; ty++){
    for(let tx=tx0; tx<=tx1; tx++){
      const img = tile(zi,tx,ty,S.capa);
      const sx = (tx*256 - x0)*esc, sy = (ty*256 - y0)*esc;
      if(img instanceof Promise || !img){
        ctx.fillStyle = '#1B2528';
        ctx.fillRect(Math.round(sx), Math.round(sy), Math.ceil(ts), Math.ceil(ts));
      } else {
        hayTiles = true;
        ctx.drawImage(img, Math.round(sx), Math.round(sy), Math.ceil(ts)+1, Math.ceil(ts)+1);
      }
    }
  }
  // Capas WMS del usuario (raster, encima del mapa base).
  let hayWMS = false;
  for(const capa of S.capas){
    if(!capa.visible || capa.tipo!=='wms') continue;
    for(let ty=ty0; ty<=ty1; ty++){
      for(let tx=tx0; tx<=tx1; tx++){
        const img = tileWMS(zi,tx,ty,capa);
        if(img && !(img instanceof Promise)){
          hayWMS = true;
          const sx = (tx*256 - x0)*esc, sy = (ty*256 - y0)*esc;
          ctx.drawImage(img, Math.round(sx), Math.round(sy), Math.ceil(ts)+1, Math.ceil(ts)+1);
        }
      }
    }
  }
  if(!hayTiles && !hayWMS){
    ctx.fillStyle = '#0A1214';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#6E8B8666';
    ctx.font = '12px ' + getComputedStyle(document.body).fontFamily;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('(mapa sin conexión)', W/2, H/2);
  }
  const aPant = (lat,lon)=>({
    x: (lon2px(lon,zi) - x0)*esc,
    y: (lat2px(lat,zi) - y0)*esc
  });

  // Capas vectoriales del usuario (GeoJSON / WFS), debajo de puntos y tracks.
  dibujarCapasVector(aPant);

  // tracks guardados
  ctx.lineJoin = ctx.lineCap = 'round';
  for(const t of S.tracks){
    if(!t.pts || t.pts.length<2) continue;
    ctx.strokeStyle = 'rgba(224,164,88,.8)'; ctx.lineWidth = 2.5;
    trazar(t.pts, aPant);
  }
  // track en grabación
  if(S.grabando && S.grabando.pts.length>1){
    ctx.strokeStyle = '#C75146'; ctx.lineWidth = 4;
    trazar(S.grabando.pts, aPant);
  }
  // puntos
  for(const p of S.puntos){
    const s = aPant(p.lat, p.lon);
    if(s.x<-30||s.x>W+30||s.y<-30||s.y>H+30) continue;
    if(p.promediado){
      // punto promediado: anillo doble en color fix, para distinguirlo.
      ctx.beginPath(); ctx.arc(s.x, s.y, 8, 0, 7);
      ctx.lineWidth = 2; ctx.strokeStyle = '#4FD1C5'; ctx.stroke();
      ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, 7);
      ctx.fillStyle = '#4FD1C5'; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = '#0A1214'; ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(s.x, s.y, 6, 0, 7);
      ctx.fillStyle = '#DCE6E4'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#0A1214'; ctx.stroke();
    }
    ctx.fillStyle = '#DCE6E4'; ctx.font = '600 11px system-ui'; ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(10,18,20,.9)'; ctx.lineWidth = 3;
    ctx.strokeText(p.nom, s.x, s.y-11); ctx.fillText(p.nom, s.x, s.y-11);
  }
  // posición actual
  if(S.fix){
    const c = S.fix.coords, s = aPant(c.latitude, c.longitude);
    const mPorPx = 156543.03392*Math.cos(c.latitude*D2R)/2**S.zoom;
    const rad = c.accuracy/mPorPx;
    if(rad > 3 && rad < 3000){
      ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, 7);
      ctx.fillStyle = 'rgba(79,209,197,.10)'; ctx.fill();
      ctx.strokeStyle = 'rgba(79,209,197,.55)'; ctx.lineWidth = 1; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, 7);
    ctx.fillStyle = '#4FD1C5'; ctx.fill();
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#0A1214'; ctx.stroke();
  }
  // escala + créditos
  const mPx = 156543.03392*Math.cos(S.centro.lat*D2R)/2**S.zoom;
  let objetivo = 80*mPx;
  const p10 = 10**Math.floor(Math.log10(objetivo));
  const mult = [1,2,5,10].find(m=> p10*m >= objetivo) || 10;
  const metros = p10*mult, anchoPx = metros/mPx;
  ctx.strokeStyle = '#DCE6E4'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(12, H-16); ctx.lineTo(12, H-10); ctx.lineTo(12+anchoPx, H-10); ctx.lineTo(12+anchoPx, H-16);
  ctx.stroke();
  ctx.fillStyle = '#DCE6E4'; ctx.font = '600 10px ' + 'ui-monospace, monospace'; ctx.textAlign = 'left';
  ctx.strokeStyle = 'rgba(10,18,20,.9)'; ctx.lineWidth = 3;
  const et = metros>=1000 ? (metros/1000)+' km' : metros+' m';
  ctx.strokeText(et, 12, H-20); ctx.fillText(et, 12, H-20);
  ctx.font = '9px system-ui'; ctx.textAlign = 'right';
  ctx.strokeText(CAPAS[S.capa].cred, W-8, H-8); 
  ctx.fillStyle = 'rgba(220,230,228,.7)'; ctx.fillText(CAPAS[S.capa].cred, W-8, H-8);
}
function trazar(pts, aPant){
  ctx.beginPath();
  let primero = true;
  for(const p of pts){
    const s = aPant(p.lat, p.lon);
    if(primero){ ctx.moveTo(s.x, s.y); primero = false; } else ctx.lineTo(s.x, s.y);
  }
  ctx.stroke();
}

/* --- gestos --- */
let toques = new Map(), ultDist = 0, arrastrando = false;
cv.addEventListener('pointerdown', e=>{
  cv.setPointerCapture(e.pointerId);
  toques.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(toques.size===2){ const [a,b]=[...toques.values()]; ultDist = Math.hypot(a.x-b.x, a.y-b.y); }
});
cv.addEventListener('pointermove', e=>{
  if(!toques.has(e.pointerId)) return;
  const prev = toques.get(e.pointerId);
  toques.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(toques.size===1){
    const dx = e.clientX-prev.x, dy = e.clientY-prev.y;
    if(Math.abs(dx)+Math.abs(dy) > 2){ arrastrando = true; S.seguir = false; }
    mover(-dx, -dy);
  } else if(toques.size===2){
    const [a,b] = [...toques.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    if(ultDist>0){ S.zoom = Math.max(2, Math.min(19, S.zoom + Math.log2(d/ultDist))); }
    ultDist = d; S.seguir = false; dibujar();
  }
});
['pointerup','pointercancel'].forEach(ev=> cv.addEventListener(ev, e=>{
  toques.delete(e.pointerId); ultDist = 0;
  setTimeout(()=> arrastrando = false, 50);
}));
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  S.zoom = Math.max(2, Math.min(19, S.zoom - Math.sign(e.deltaY)*0.4));
  S.seguir = false; dibujar();
}, {passive:false});
function mover(dx, dy){
  const z = S.zoom;
  const x = lon2px(S.centro.lon,z) + dx, y = lat2px(S.centro.lat,z) + dy;
  S.centro.lon = px2lon(x,z);
  S.centro.lat = Math.max(-85, Math.min(85, px2lat(y,z)));
  dibujar();
}

const ac = document.getElementById('anillo'), actx = ac.getContext('2d');
function dibujarAnillo(exac){
  actx.clearRect(0,0,112,112);
  const cx = 56, cy = 56;
  const bueno = exac!=null && exac<=5, medio = exac!=null && exac<=15;
  const col = exac==null ? '#6E8B86' : bueno ? '#4FD1C5' : medio ? '#E0A458' : '#C75146';
  for(let i=4; i>=1; i--){
    actx.beginPath(); actx.arc(cx, cy, i*12.5, 0, 7);
    actx.strokeStyle = col; actx.globalAlpha = 0.10 + (5-i)*0.05; actx.lineWidth = 2;
    actx.stroke();
  }
  actx.globalAlpha = 1;
  const frac = exac==null ? 0 : Math.max(0.05, Math.min(1, 1 - Math.log10(Math.max(exac,1))/2));
  actx.beginPath(); actx.arc(cx, cy, 48, -Math.PI/2, -Math.PI/2 + frac*Math.PI*2);
  actx.strokeStyle = col; actx.lineWidth = 5; actx.lineCap = 'round'; actx.stroke();
  actx.beginPath(); actx.arc(cx, cy, 7, 0, 7); actx.fillStyle = col; actx.fill();
}

let wakeLock = null;
async function mantenerPantalla(){
  if(navigator.wakeLock && navigator.wakeLock.request){
    try{ wakeLock = await navigator.wakeLock.request('screen'); return; }catch(e){}
  }
  const KA = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake;
  if(KA){ try{ await KA.keepAwake(); }catch(e){} }
}
async function liberarPantalla(){
  if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
  const KA = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KeepAwake;
  if(KA){ try{ await KA.allowSleep(); }catch(e){} }
}
/* --- fuente de posición: fused (WebView) o GPS puro (nativo) --- */
// S.fuente: 'fused' = navigator.geolocation (GPS+WiFi+celda, rápido)
//           'gps'   = LocationManager GPS_PROVIDER nativo (solo satélites)
let watchFusedId = null;
let gnssStarted = false;      // listener nativo activo (compartido con diagnóstico)
let diagAbierto = false;      // panel de diagnóstico abierto
let mainLocSub = null;        // suscripción del app al evento 'location' nativo
let mainGgaSub = null;        // suscripción del app al evento 'gga' (altura ortométrica)
let mainDopSub = null;        // suscripción a 'dop' (HDOP para calidad de ocupación)
let mainStatSub = null;       // suscripción a 'gnssStatus' (C/N0 medio)
let ultimoGeoide = null;      // separación del geoide más reciente (NMEA), metros
let ultimoMslNmea = null;     // altura ortométrica más reciente vía NMEA GGA, metros
let ultimoHdop = null;        // HDOP más reciente (NMEA), para promediado
let ultimoCn0Mean = null;     // C/N0 medio de satélites en fix, para promediado
let ultimoSatsUsados = null;  // satélites usados en el fix, para filtros (F5)

function pluginGnss(){ return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Gnss; }

function arrancarFused(){
  if(watchFusedId!=null) return;
  if(!navigator.geolocation){ toast('Este navegador no expone GPS.'); return; }
  watchFusedId = navigator.geolocation.watchPosition((pos)=>{
    if(S.fuente==='fused') alFix(posDesdeFused(pos));
  }, alErrorGPS, { enableHighAccuracy:true, maximumAge:0, timeout:30000 });
}
function detenerFused(){
  if(watchFusedId!=null){ navigator.geolocation.clearWatch(watchFusedId); watchFusedId=null; }
}
async function gnssStart(){
  const P = pluginGnss(); if(!P) return false;
  if(!gnssStarted){ await P.startGnssListener(); gnssStarted = true; }
  return true;
}
async function gnssStopSiOcioso(){
  const P = pluginGnss(); if(!P) return;
  if(S.fuente!=='gps' && !diagAbierto && gnssStarted){
    try{ await P.stopGnssListener(); }catch(e){}
    gnssStarted = false;
  }
}
async function aplicarFuente(){
  await dbPut('conf', S.fuente, 'fuente');
  if(S.fuente==='gps'){
    const ok = await gnssStart();
    if(!ok){ S.fuente='fused'; toast('GPS puro no disponible en este equipo; uso posición fusionada.'); }
  }
  if(S.fuente==='gps') detenerFused(); else arrancarFused();
  await gnssStopSiOcioso();
}
// Convierten cada fuente a la forma de un Position del navegador (coords + timestamp)
// altElip = altura elipsoidal (WGS84, cruda del GPS)
// altOrto = altura ortométrica (sobre el geoide/nivel del mar; la que importa)
function posDesdeFused(pos){
  const alt = pos.coords.altitude;
  return { coords: pos.coords, timestamp: pos.timestamp,
    fuente:'fused', vexac: pos.coords.altitudeAccuracy, sexac:null, bexac:null, mock:false, provider:'fused',
    altElip: alt!=null?alt:null, altOrto:null, altOrtoFuente:null, geoide: ultimoGeoide };
}
function posDesdeNativo(d){
  const altElip = (d.altitude!=null?d.altitude:null);
  // Ortométrica: preferir la del sistema (MSL_API, API 34); si no, la de NMEA GGA.
  let altOrto = null, altOrtoFuente = null;
  if(d.mslAltitude!=null){ altOrto = d.mslAltitude; altOrtoFuente = 'MSL_API'; }
  else if(ultimoMslNmea!=null){ altOrto = ultimoMslNmea; altOrtoFuente = 'NMEA_GGA'; }
  return {
    coords: { latitude:d.latitude, longitude:d.longitude, altitude:altElip,
              accuracy:d.accuracy, altitudeAccuracy:(d.verticalAccuracy!=null?d.verticalAccuracy:null),
              speed:(d.speed!=null?d.speed:null), heading:(d.bearing!=null?d.bearing:null) },
    timestamp: d.timestamp || Date.now(),
    fuente:'gps', vexac:d.verticalAccuracy, sexac:d.speedAccuracy, bexac:d.bearingAccuracy,
    mock:!!d.isMock, provider:d.provider,
    altElip: altElip, altOrto: altOrto, altOrtoFuente: altOrtoFuente, geoide: ultimoGeoide };
}
async function arrancarGPS(){
  S.fuente = await dbGet('conf','fuente') || 'fused';
  // Suscripciones únicas del app a los eventos nativos (se activan según S.fuente).
  const P = pluginGnss();
  if(P && !mainLocSub){
    mainLocSub = await P.addListener('location', (ev)=>{
      if(S.fuente==='gps') alFix(posDesdeNativo(ev.data));
    });
    // La altura ortométrica y el geoide llegan por NMEA GGA; los guardamos
    // aunque no estemos mostrando el diagnóstico, para tenerlos al marcar puntos.
    mainGgaSub = await P.addListener('gga', (ev)=>{
      if(ev.data.geoidSeparation!=null) ultimoGeoide = ev.data.geoidSeparation;
      if(ev.data.mslAltitude!=null) ultimoMslNmea = ev.data.mslAltitude;
      if(ev.data.hdop!=null) ultimoHdop = ev.data.hdop;
    });
    // HDOP y C/N0 para las estadísticas de calidad del promediado (F3).
    mainDopSub = await P.addListener('dop', (ev)=>{
      if(ev.data.hdop!=null) ultimoHdop = ev.data.hdop;
    });
    mainStatSub = await P.addListener('gnssStatus', (ev)=>{
      const sats = (ev.data && ev.data.satellites) || [];
      const usados = sats.filter(s=> s.usedInFix);
      ultimoSatsUsados = (ev.data && ev.data.usedInFix!=null) ? ev.data.usedInFix : usados.length;
      const cn = usados.filter(s=> s.cn0>0).map(s=> s.cn0);
      ultimoCn0Mean = cn.length ? cn.reduce((a,b)=>a+b,0)/cn.length : null;
    });
    // Botón "Detener" de la notificación del servicio en primer plano.
    await P.addListener('stopTrackRequested', async ()=>{
      if(S.grabando) await alternarTrack();
    });
    // Acciones del widget en arranque en caliente (app ya abierta).
    await P.addListener('widgetAction', (ev)=> manejarAccionWidget(ev && ev.action));
    // Acción del widget en arranque en frío (guardada por MainActivity).
    try{
      const pend = await P.consumePendingWidgetAction();
      if(pend && pend.action) setTimeout(()=> manejarAccionWidget(pend.action), 600);
    }catch(e){}
  }
  await aplicarFuente();
}
function alFix(pos){
  S.fix = pos;
  const c = pos.coords;
  const src = pos.fuente==='gps' ? 'GPS PURO' : 'FUSED';
  let estado = (navigator.onLine ? 'EN LÍNEA' : 'SIN RED') + ' · ' + src + ' · FIX ' + new Date(pos.timestamp).toLocaleTimeString('es-CR',{hour12:false});
  if(S.grabando && S.filtros && S.filtros.activo)
    estado += ` · ✓${S.grabando.aceptados||0} ✗${S.grabando.rechazados||0}`;
  document.getElementById('estadoRed').textContent = estado;
  const f = fmtCoord(c.latitude, c.longitude, S.modo);
  document.getElementById('coordSys').textContent = PROY[S.modo].nom;
  document.getElementById('coordA').textContent = f.a;
  document.getElementById('coordB').textContent = f.b;
  // Métrica de altura: mostrar ORTOMÉTRICA si la tenemos (la que importa),
  // si no, la elipsoidal, con la etiqueta que corresponda.
  if(pos.altOrto!=null){
    document.getElementById('mAlt').textContent = pos.altOrto.toFixed(0);
    document.getElementById('mAltU').textContent = 'Alt orto m';
  } else if(pos.altElip!=null){
    document.getElementById('mAlt').textContent = pos.altElip.toFixed(0);
    document.getElementById('mAltU').textContent = 'Alt elip m';
  } else {
    document.getElementById('mAlt').textContent = '—';
    document.getElementById('mAltU').textContent = 'Altura m';
  }
  // Línea terciaria: coordenada + exactitud vertical + ambas alturas + mock.
  let cExtra = f.c;
  if(pos.vexac!=null) cExtra += '  ·  ↕±' + pos.vexac.toFixed(1) + 'm';
  if(pos.altOrto!=null && pos.altElip!=null) cExtra += '  ·  elip ' + pos.altElip.toFixed(0) + 'm';
  if(pos.mock) cExtra += '  ·  ⚠ MOCK';
  document.getElementById('coordC').textContent = cExtra;
  document.getElementById('mExac').textContent = c.accuracy!=null ? c.accuracy.toFixed(1) : '—';
  document.getElementById('mVel').textContent  = c.speed!=null ? (c.speed*3.6).toFixed(1) : '—';
  dibujarAnillo(c.accuracy);
  if(pendientePuntoWidget){ pendientePuntoWidget = false; marcarPuntoRapido(); }
  if(S.grabando) grabarPunto(pos);
  if(ocupacion && ocupacion.activa) ocupacion.muestras.push({
    lat:c.latitude, lon:c.longitude, acc:(c.accuracy!=null?c.accuracy:null),
    altElip:pos.altElip, altOrto:pos.altOrto, altOrtoFuente:pos.altOrtoFuente,
    geoide:pos.geoide, hdop:ultimoHdop, cn0:ultimoCn0Mean
  });
  if(S.seguir){ S.centro.lat = c.latitude; S.centro.lon = c.longitude; }
  dibujar();
}
function alErrorGPS(e){

    (e.code===1 ? 'PERMISO DENEGADO' : e.code===2 ? 'SIN POSICIÓN' : 'TIEMPO AGOTADO');
}

/* =======================================================================
   6b. PROMEDIADO ESTÁTICO (ocupación de punto) — Fase 3
   ======================================================================= */
let ocupacion = null;   // { activa, muestras:[], t0, durMs, timer, nom, desc }

const M_POR_GRADO = 111320;   // metros por grado de latitud (aprox)

// Media ponderada por exactitud (w = 1/acc^2) + desviación estándar en metros.
// Descarta atípicos a > 3σ de la media, en una pasada.
function calcOcupacion(muestras){
  if(!muestras.length) return null;
  const mediaPond = (arr)=>{
    let sw=0, slat=0, slon=0;
    for(const m of arr){
      const w = (m.acc && m.acc>0) ? 1/(m.acc*m.acc) : 1;
      sw += w; slat += m.lat*w; slon += m.lon*w;
    }
    return { lat:slat/sw, lon:slon/sw };
  };
  const disp = (arr, ctr)=>{
    // distancia de cada muestra a la media, en metros
    const mLon = M_POR_GRADO*Math.cos(ctr.lat*D2R);
    return arr.map(m=>{
      const dx = (m.lon-ctr.lon)*mLon, dy = (m.lat-ctr.lat)*M_POR_GRADO;
      return Math.sqrt(dx*dx+dy*dy);
    });
  };
  // 1ª media con todas
  let ctr = mediaPond(muestras);
  let d = disp(muestras, ctr);
  const sigma = Math.sqrt(d.reduce((a,b)=>a+b*b,0)/d.length) || 0;
  // descartar atípicos > 3σ
  const aceptadas = muestras.filter((m,i)=> sigma===0 || d[i] <= 3*sigma);
  const rechazadas = muestras.length - aceptadas.length;
  ctr = mediaPond(aceptadas);
  // desviación estándar final (separada lat/lon, en metros)
  const mLon = M_POR_GRADO*Math.cos(ctr.lat*D2R);
  let sLat2=0, sLon2=0, sD2=0;
  for(const m of aceptadas){
    const dy=(m.lat-ctr.lat)*M_POR_GRADO, dx=(m.lon-ctr.lon)*mLon;
    sLat2 += dy*dy; sLon2 += dx*dx; sD2 += dx*dx+dy*dy;
  }
  const n = aceptadas.length;
  const div = n>1 ? n-1 : 1;
  const prom = (sel)=>{ const v = aceptadas.map(sel).filter(x=> x!=null); return v.length? v.reduce((a,b)=>a+b,0)/v.length : null; };
  return {
    lat: ctr.lat, lon: ctr.lon,
    altElip: prom(m=>m.altElip), altOrto: prom(m=>m.altOrto),
    altOrtoFuente: (aceptadas.find(m=>m.altOrtoFuente)||{}).altOrtoFuente || null,
    geoide: prom(m=>m.geoide),
    accMean: prom(m=>m.acc), hdopMean: prom(m=>m.hdop), cn0Mean: prom(m=>m.cn0),
    stdLat: Math.sqrt(sLat2/div), stdLon: Math.sqrt(sLon2/div), stdM: Math.sqrt(sD2/div),
    n: n, aceptadas: n, rechazadas: rechazadas
  };
}

function iniciarOcupacion(nom, desc, durSeg){
  ocupacion = { activa:true, muestras:[], t0:Date.now(), durMs:durSeg*1000, nom, desc, dur:durSeg };
  renderOcupacion();
  ocupacion.timer = setInterval(()=>{
    if(!ocupacion || !ocupacion.activa) return;
    renderOcupacion();
    if(Date.now()-ocupacion.t0 >= ocupacion.durMs) finalizarOcupacion();
  }, 300);
}
function renderOcupacion(){
  if(!ocupacion) return;
  const el = Math.min(1, (Date.now()-ocupacion.t0)/ocupacion.durMs);
  const seg = Math.round((Date.now()-ocupacion.t0)/1000);
  const r = calcOcupacion(ocupacion.muestras);
  const cont = document.getElementById('ocuBody');
  if(!cont) return;
  const f = r ? fmtCoord(r.lat, r.lon, S.modo) : null;
  cont.innerHTML = `
    <div class="barra"><i style="width:${(el*100).toFixed(0)}%"></i></div>
    <div class="k" style="margin-top:6px">${seg}s / ${ocupacion.dur}s · ${ocupacion.muestras.length} muestras</div>
    ${r ? `
      <div class="res"><div class="k">${PROY[S.modo].nom} (media)</div><div class="v">${f.a}<br>${f.b}</div></div>
      <div class="grid2">
        <div class="res"><div class="k">Desv. estándar</div><div class="v">± ${r.stdM.toFixed(2)} m</div></div>
        <div class="res"><div class="k">Muestras usadas</div><div class="v">${r.aceptadas} <span style="color:var(--musgo);font-size:11px">(−${r.rechazadas})</span></div></div>
        <div class="res"><div class="k">Alt orto (media)</div><div class="v">${r.altOrto!=null?r.altOrto.toFixed(1)+' m':'—'}</div></div>
        <div class="res"><div class="k">HDOP medio</div><div class="v">${r.hdopMean!=null?r.hdopMean.toFixed(2):'—'}</div></div>
      </div>` : '<div class="vacio">Esperando fixes…</div>'}
    <div class="nota" style="border-color:var(--alerta)">⚠️ El promediado reduce el ruido aleatorio, NO el sesgo por multipath (rebote en paredes/árboles). Una desviación baja NO garantiza exactitud absoluta.</div>
    <button class="ancho" id="ocuStop">Detener y guardar ahora</button>
    <button class="ancho borde" id="ocuCancel">Cancelar</button>
  `;
  document.getElementById('ocuStop').onclick = finalizarOcupacion;
  document.getElementById('ocuCancel').onclick = cancelarOcupacion;
}
async function finalizarOcupacion(){
  if(!ocupacion) return;
  ocupacion.activa = false;
  if(ocupacion.timer){ clearInterval(ocupacion.timer); ocupacion.timer=null; }
  const r = calcOcupacion(ocupacion.muestras);
  if(!r){ toast('No se capturaron fixes. Cancelado.'); ocupacion=null; cerrarPanel(); return; }
  const p = {
    id:nid(), proy:S.proy.id, nom:ocupacion.nom, desc:ocupacion.desc,
    lat:r.lat, lon:r.lon, alt:r.altElip, exac:(r.accMean!=null?r.accMean:r.stdM),
    altElip:r.altElip, altOrto:r.altOrto, altOrtoFuente:r.altOrtoFuente, geoide:r.geoide,
    vexac:null, fuente:S.fuente,
    promediado:true, muestras:r.n, desvStd:r.stdM, stdLat:r.stdLat, stdLon:r.stdLon,
    hdopMedio:r.hdopMean, cn0Medio:r.cn0Mean, duracion:ocupacion.dur,
    t:Date.now()
  };
  await dbPut('puntos', p);
  S.puntos.push(p);
  const nMuestras = r.n;
  ocupacion = null;
  cerrarPanel(); dibujar();
  toast(`Punto promediado: ${nMuestras} muestras · ±${r.stdM.toFixed(2)} m`);
}
function cancelarOcupacion(){
  if(ocupacion && ocupacion.timer) clearInterval(ocupacion.timer);
  ocupacion = null;
  cerrarPanel();
  toast('Ocupación cancelada.');
}

/* =======================================================================
   7. TRACKS
   ======================================================================= */
const FILTRO = { exacMax: 30, distMin: 3 };
function grabarPunto(pos){
  const c = pos.coords;
  // Filtro de calidad configurable (F5). Si está apagado, mantiene el
  // límite de seguridad histórico de 30 m.
  if(S.filtros && S.filtros.activo){
    if(!pasaFiltros(pos)){
      S.grabando.rechazados = (S.grabando.rechazados||0) + 1;
      if(S.filtros.avisar) avisarRechazo();
      return;
    }
  } else if(c.accuracy > FILTRO.exacMax){
    return;
  }
  const pts = S.grabando.pts;
  const ult = pts[pts.length-1];
  if(ult){
    const d = distM(ult.lat, ult.lon, c.latitude, c.longitude);
    if(d < FILTRO.distMin) return;
    S.grabando.dist += d;
  }
  S.grabando.aceptados = (S.grabando.aceptados||0) + 1;
  const pt = { lat:c.latitude, lon:c.longitude, alt:c.altitude, exac:c.accuracy,
               vexac: pos.vexac!=null?pos.vexac:null, fuente: pos.fuente||'fused',
               altElip: pos.altElip!=null?pos.altElip:null, altOrto: pos.altOrto!=null?pos.altOrto:null,
               altOrtoFuente: pos.altOrtoFuente||null, geoide: pos.geoide!=null?pos.geoide:null,
               t:pos.timestamp };
  pts.push(pt);
  S.grabando.geojson.geometry.coordinates.push([pt.lon, pt.lat]);
  S.grabando.geojson.properties = { nom: S.grabando.nom, dist: S.grabando.dist, puntos: pts.length };
  document.getElementById('mRec').textContent = S.grabando.dist.toFixed(0);
  if(pts.length % 10 === 0) dbPut('tracks', JSON.parse(JSON.stringify(S.grabando)));
  // Actualizar la notificación del servicio cada 5 puntos.
  if(pts.length % 5 === 0){
    const P = pluginGnss();
    if(P && P.updateTrackingNotification){
      const min = Math.round((Date.now()-S.grabando.ini)/60000);
      try{ P.updateTrackingNotification({ text: `${pts.length} pts · ${S.grabando.dist.toFixed(0)} m · ${min} min` }); }catch(e){}
    }
  }
}
let fuentePrevTrack = null;   // fuente a restaurar al terminar el track
async function alternarTrack(){
  const b = document.getElementById('btnTrack');
  if(S.grabando){
    await dbPut('tracks', JSON.parse(JSON.stringify(S.grabando)));
    const rech = S.grabando.rechazados||0;
    toast(`Track guardado · ${S.grabando.pts.length} puntos · ${S.grabando.dist.toFixed(0)} m` + (rech?` · ${rech} filtrados`:''));
    S.grabando = null;
    b.dataset.on = '0'; b.textContent = 'Grabar track';
    await detenerServicioTrack();
    await liberarPantalla();
    // Restaurar la fuente que el usuario tenía antes del track.
    if(fuentePrevTrack && fuentePrevTrack !== S.fuente){ S.fuente = fuentePrevTrack; await aplicarFuente(); }
    fuentePrevTrack = null;
    if(S.proy) await cargarProyecto(S.proy.id);
  } else {
    if(!S.proy){
      const proy = { id:nid(), nom:'Temporal ' + new Date().toLocaleDateString('es-CR'), pts:[], tracks:[] };
      await dbPut('proyectos', proy);
      S.proy = proy;
      document.getElementById('proyBtn').querySelector('.val').textContent = proy.nom;
    }
    S.grabando = { id:nid(), proy:S.proy.id, nom:'Track ' + new Date().toLocaleString('es-CR'), pts:[], dist:0, ini:Date.now(),
      aceptados:0, rechazados:0,
      filtroConfig: (S.filtros && S.filtros.activo) ? JSON.parse(JSON.stringify(S.filtros)) : null,
      geojson:{type:'Feature',geometry:{type:'LineString',coordinates:[]},properties:{}} };
    b.dataset.on = '1'; b.textContent = 'Detener';
    await mantenerPantalla();
    await iniciarServicioTrack();
    dibujar();
  }
  dibujar();
}

// Inicia el servicio en primer plano y fuerza GPS puro (lectura nativa fiable
// con la pantalla apagada). Guarda la fuente previa para restaurarla al parar.
async function iniciarServicioTrack(){
  const P = pluginGnss();
  if(!P){ toast('Grabando. (Pantalla encendida; sin servicio nativo)'); return; }
  try{
    await P.requestNotifPermission();
    // GPS puro: la lectura nativa sigue en background; navigator.geolocation no.
    if(S.fuente!=='gps'){ fuentePrevTrack = S.fuente; S.fuente='gps'; await aplicarFuente(); }
    else fuentePrevTrack = null;
    await P.startForegroundTracking({ text: 'Grabando… tocá para volver a la app' });
    toast('Grabando. Podés apagar la pantalla; sigue registrando.');
  }catch(e){
    console.log('servicio track error', e);
    toast('Grabando. (No se pudo iniciar el servicio de fondo)');
  }
}
async function detenerServicioTrack(){
  const P = pluginGnss();
  if(!P) return;
  try{ await P.stopForegroundTracking(); }catch(e){}
}

let pendientePuntoWidget = false;
async function marcarPuntoRapido(){
  if(!S.fix){ pendientePuntoWidget = true; toast('Esperando posición para el punto…'); return; }
  if(!S.proy){
    const proy = { id:nid(), nom:'Temporal ' + new Date().toLocaleDateString('es-CR'), pts:[], tracks:[] };
    await dbPut('proyectos', proy); S.proy = proy;
    document.getElementById('proyBtn').querySelector('.val').textContent = proy.nom;
  }
  const c = S.fix.coords, fx = S.fix;
  const n = S.puntos.length + 1;
  const p = {
    id:nid(), proy:S.proy.id, nom:'W'+String(n).padStart(3,'0'), desc:'(widget)',
    lat:c.latitude, lon:c.longitude, alt:c.altitude, exac:c.accuracy,
    vexac: fx.vexac!=null?fx.vexac:null, fuente: fx.fuente||'fused',

  };

async function manejarAccionWidget(action){
  if(!action) return;
  if(action==='start'){ if(!S.grabando) await alternarTrack(); else toast('Ya estás grabando.'); }
  else if(action==='stop'){ if(S.grabando) await alternarTrack(); else toast('No hay track activo.'); }
  else if(action==='punto'){ await marcarPuntoRapido(); }
}

/* --- convertidor --- */
function panelConv(){
  abrirPanel('Convertir coordenadas', `
    <label>Sistema de entrada</label>
    <select id="cvIn"><option value="geo">Geográficas (grados decimales)</option><option value="crtm05">CRTM05</option><option value="ln">Lambert Norte</option><option value="ls">Lambert Sur</option></select>
    <div class="grid2">
      <div><label id="cvLA">Latitud</label><input id="cvA" inputmode="decimal" placeholder="9.431800"></div>
      <div><label id="cvLB">Longitud</label><input id="cvB" inputmode="decimal" placeholder="-84.162000"></div>
    </div>
    <button class="ancho" id="cvOk">Convertir</button>
    <button class="ancho borde" id="cvAqui">Usar mi posición actual</button>
    <div id="cvRes"></div>
  `);
  const sel = document.getElementById('cvIn');
  sel.onchange = ()=>{
    const g = sel.value==='geo';
    document.getElementById('cvLA').textContent = g ? 'Latitud' : 'Este (E)';
    document.getElementById('cvLB').textContent = g ? 'Longitud' : 'Norte (N)';
    document.getElementById('cvA').placeholder = g ? '9.431800' : '486123.45';
    document.getElementById('cvB').placeholder = g ? '-84.162000' : '1042876.10';
  };
  const correr = ()=>{
    const a = parseFloat(document.getElementById('cvA').value);
    const b = parseFloat(document.getElementById('cvB').value);
    if(isNaN(a)||isNaN(b)){ toast('Faltan números válidos.'); return; }
    const m = sel.value;
    const w = m==='geo' ? {lat:a, lon:b} : haciaWgs(a, b, m);
    if(Math.abs(w.lat)>90 || w.lon<-180 || w.lon>180){ toast('Esas coordenadas no caen en la Tierra. Revisá el orden E/N.'); return; }
    const c05 = tmFwd(w.lat, w.lon, CRTM05);
    const o = wgsToOco(w.lat, w.lon);
    const ln = lccFwd(o.lat, o.lon, LAM_N), ls = lccFwd(o.lat, o.lon, LAM_S);
    const fuera = w.lat<5 || w.lat>12 || w.lon<-88 || w.lon>-81;
    document.getElementById('cvRes').innerHTML = `
      <div class="res"><div class="k">Geográficas · WGS84</div><div class="v">${w.lat.toFixed(7)}, ${w.lon.toFixed(7)}<br>${gms(w.lat,true)}<br>${gms(w.lon,false)}</div></div>
      <div class="res"><div class="k">CRTM05 · EPSG:5367</div><div class="v">E ${c05.e.toFixed(3)}<br>N ${c05.n.toFixed(3)}</div></div>
      <div class="res"><div class="k">Lambert Norte · EPSG:5456</div><div class="v">E ${ln.e.toFixed(3)}<br>N ${ln.n.toFixed(3)}</div></div>
      <div class="res"><div class="k">Lambert Sur · EPSG:5457</div><div class="v">E ${ls.e.toFixed(3)}<br>N ${ls.n.toFixed(3)}</div></div>
      ${fuera ? '<div class="nota">Este punto queda fuera de Costa Rica. Las proyecciones se calculan igual, pero los valores no tienen sentido práctico.</div>' : ''}
      <div class="nota">Lambert usa Helmert de 7 parámetros (Ocotepeque→CR05, EPSG:6890), igual que QGIS por defecto. El método oficial del IGN pasa por polinomios CRTM90→CRTM98→CRTM05 y da un resultado distinto, típicamente de 1 a varios metros. Para topografía legal, verificá contra la herramienta oficial.</div>
    `;
  };
  document.getElementById('cvOk').onclick = correr;
  document.getElementById('cvAqui').onclick = ()=>{
    if(!S.fix){ toast('Sin posición todavía.'); return; }
    sel.value = 'geo'; sel.onchange();
    document.getElementById('cvA').value = S.fix.coords.latitude.toFixed(7);
    document.getElementById('cvB').value = S.fix.coords.longitude.toFixed(7);
    correr();
  };
}

/* --- offline --- */
function tilesDelArea(zMin, zMax){
  const lista = [];
  const oesteN = px2lon(lon2px(S.centro.lon,S.zoom) - W/2, S.zoom);
  const esteN  = px2lon(lon2px(S.centro.lon,S.zoom) + W/2, S.zoom);
  const norteN = px2lat(lat2px(S.centro.lat,S.zoom) - H/2, S.zoom);
  const surN   = px2lat(lat2px(S.centro.lat,S.zoom) + H/2, S.zoom);
  for(let z=zMin; z<=zMax; z++){
    const x0 = Math.floor(lon2px(oesteN,z)/256), x1 = Math.floor(lon2px(esteN,z)/256);
    const y0 = Math.floor(lat2px(norteN,z)/256), y1 = Math.floor(lat2px(surN,z)/256);
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) lista.push([z,x,y]);
  }
  return lista;
}
async function panelOffline(){
  const conteo = await pedir(tx('tiles').count());
  abrirPanel('Mapa sin conexión', `
    <div class="nota" style="border-color:var(--fix)">Se descarga solo el área que estás viendo en el mapa. Encuadrá primero la zona, después abrí esto.</div>
    <label>Zoom máximo a descargar</label>
    <select id="offZ">
      <option value="16">16 — calles y ríos principales</option>
      <option value="17" selected>17 — recomendado para campo</option>
      <option value="18">18 — detalle alto, pesa 4×</option>
      <option value="19">19 — máximo, pesa 16×</option>
    </select>
    <div class="res"><div class="k">Estimado</div><div class="v" id="offEst">—</div></div>
    <div class="barra"><i id="offBar"></i></div>
    <button class="ancho" id="offOk">Descargar área visible</button>
    <div class="res" style="margin-top:20px"><div class="k">Ya guardado</div><div class="v">${conteo} tiles en este teléfono</div></div>
    <button class="ancho borde" id="offBorrar">Borrar todo el mapa descargado</button>
    <div class="nota">Los tiles de Google Maps no se pueden descargar: sus Términos de Servicio lo prohíben expresamente y Play retira las apps que lo hacen. Por eso esta app usa Esri World Imagery y OpenStreetMap. Descargá áreas de trabajo, no provincias enteras: la descarga masiva viola las políticas de uso de ambos servicios.</div>
  `);
  const est = ()=>{
    const n = tilesDelArea(Math.max(2,Math.round(S.zoom)-2), +document.getElementById('offZ').value).length;
    document.getElementById('offEst').textContent = `${n} tiles · ~${(n*22/1024).toFixed(1)} MB`;
    return n;
  };
  document.getElementById('offZ').onchange = est; est();
  document.getElementById('offBorrar').onclick = async ()=>{
    if(!confirm('Se borran TODOS los tiles descargados de todas las áreas. El mapa dejará de verse sin internet hasta que descargues de nuevo. ¿Seguir?')) return;
    await pedir(tx('tiles','readwrite').clear()); memTiles.clear();
    cerrarPanel(); dibujar(); toast('Mapa descargado borrado.');
  };
  document.getElementById('offOk').onclick = async ()=>{
    const lista = tilesDelArea(Math.max(2,Math.round(S.zoom)-2), +document.getElementById('offZ').value);
    const btn = document.getElementById('offOk'), bar = document.getElementById('offBar');
    btn.disabled = true;
    let hechos = 0, fallos = 0;
    for(let i=0; i<lista.length; i+=6){
      await Promise.all(lista.slice(i,i+6).map(async ([z,x,y])=>{
        const k = `${S.capa}/${z}/${x}/${y}`;
        try{
          if(await dbGet('tiles', k)) return;
          const r = await fetch(CAPAS[S.capa].url(z,x,y));
          if(!r.ok) throw 0;
          await dbPut('tiles', await r.blob(), k);
        }catch(e){ fallos++; }
        finally{ hechos++; }
      }));
      bar.style.width = (hechos/lista.length*100) + '%';
      btn.textContent = `Descargando ${hechos}/${lista.length}`;
    }
    btn.textContent = 'Listo';
    toast(fallos ? `Descargado con ${fallos} tiles fallidos.` : `Área guardada: ${hechos} tiles.`);
    dibujar();
  };
}

    <select id="exSys"><option value="crtm05">CRTM05 (EPSG:5367)</option><option value="ln">Lambert Norte (EPSG:5456)</option><option value="ls">Lambert Sur (EPSG:5457)</option><option value="geo">Geográficas (WGS84)</option></select>

  `);
  document.getElementById('exCsv').onclick = ()=>{
    const m = document.getElementById('exSys').value;
    const colsCal = ['tipo','muestras','desv_std_m','hdop_medio','cn0_medio','duracion_s'];
    const enc = m==='geo' ? ['nombre','lat','lon','altura_orto_m','altura_elip_m','geoide_m','altura_fuente','exactitud_m','exac_vert_m','fuente',...colsCal,'fecha','descripcion']
                          : ['nombre','este','norte','altura_orto_m','altura_elip_m','geoide_m','altura_fuente','exactitud_m','exac_vert_m','fuente',...colsCal,'fecha','descripcion','epsg'];
    const filas = S.puntos.map(p=>{
      const c = m==='geo' ? [p.lat.toFixed(7), p.lon.toFixed(7)]
                          : (q=> [q.e.toFixed(3), q.n.toFixed(3)])(desdeWgs(p.lat,p.lon,m));
      const orto = p.altOrto!=null ? p.altOrto.toFixed(1) : '';
      const elip = p.altElip!=null ? p.altElip.toFixed(1) : (p.alt!=null?p.alt.toFixed(1):'');
      const cal = [ p.promediado?'promediado':'instantaneo', p.muestras!=null?p.muestras:'',
                    p.desvStd!=null?p.desvStd.toFixed(2):'', p.hdopMedio!=null?p.hdopMedio.toFixed(2):'',
                    p.cn0Medio!=null?p.cn0Medio.toFixed(1):'', p.duracion!=null?p.duracion:'' ];
      const base = [p.nom, ...c, orto, elip, p.geoide!=null?p.geoide.toFixed(1):'', p.altOrtoFuente||'',
                    p.exac.toFixed(1), p.vexac!=null?p.vexac.toFixed(1):'', p.fuente||'fused', ...cal,
                    new Date(p.t).toISOString(), p.desc||''];
      if(m!=='geo') base.push(PROY[m].epsg);
      return base.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',');
    });
    bajar(S.proy.nom+'.csv', enc.join(',')+'\n'+filas.join('\n'), 'text/csv');
  };
  document.getElementById('exGpx').onclick = ()=>{
    const esc = s => String(s||'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
    let g = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Garua Campo" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${esc(S.proy.nom)}</name></metadata>\n`;
    // GPX <ele> es altura sobre el nivel del mar: usamos la ortométrica si está.
    const ele = o => (o.altOrto!=null ? o.altOrto : (o.altElip!=null ? o.altElip : o.alt));
    for(const p of S.puntos){
      const e = ele(p);
      g += `<wpt lat="${p.lat}" lon="${p.lon}">${e!=null?`<ele>${e.toFixed(1)}</ele>`:''}<time>${new Date(p.t).toISOString()}</time><name>${esc(p.nom)}</name><desc>${esc(p.desc)}</desc></wpt>\n`;
    }
    for(const t of S.tracks){
      g += `<trk><name>${esc(t.nom)}</name><trkseg>\n`;
      for(const q of t.pts){ const e = ele(q); g += `<trkpt lat="${q.lat}" lon="${q.lon}">${e!=null?`<ele>${e.toFixed(1)}</ele>`:''}<time>${new Date(q.t).toISOString()}</time></trkpt>\n`; }
      g += `</trkseg></trk>\n`;
    }
    bajar(S.proy.nom+'.gpx', g+'</gpx>', 'application/gpx+xml');
  };
  document.getElementById('exGeo').onclick = ()=>{
    const fc = { type:'FeatureCollection', name:S.proy.nom, crs:{type:'name',properties:{name:'urn:ogc:def:crs:OGC:1.3:CRS84'}}, features:[] };
    for(const p of S.puntos){
      const zOrto = p.altOrto!=null ? p.altOrto : null;
      const zElip = p.altElip!=null ? p.altElip : (p.alt!=null?p.alt:null);
      fc.features.push({ type:'Feature',
        properties:{ nombre:p.nom, desc:p.desc,
          altura_orto_m:zOrto, altura_elip_m:zElip, geoide_m:(p.geoide!=null?p.geoide:null),
          altura_fuente:(p.altOrtoFuente||null), exactitud_m:p.exac, exac_vert_m:(p.vexac!=null?p.vexac:null),
          fuente:(p.fuente||'fused'),
          tipo:(p.promediado?'promediado':'instantaneo'), muestras:(p.muestras!=null?p.muestras:null),
          desv_std_m:(p.desvStd!=null?p.desvStd:null), hdop_medio:(p.hdopMedio!=null?p.hdopMedio:null),
          cn0_medio:(p.cn0Medio!=null?p.cn0Medio:null), duracion_s:(p.duracion!=null?p.duracion:null),
          fecha:new Date(p.t).toISOString() },
        geometry:{ type:'Point', coordinates:[p.lon, p.lat, (zOrto!=null?zOrto:(zElip!=null?zElip:0))] } });
    }
    for(const t of S.tracks) fc.features.push({ type:'Feature',
      properties:{ nombre:t.nom, distancia_m:Math.round(t.dist), puntos:t.pts.length,
        puntos_aceptados:(t.aceptados!=null?t.aceptados:null), puntos_filtrados:(t.rechazados!=null?t.rechazados:null),
        filtro: t.filtroConfig ? `HDOP<=${t.filtroConfig.hdopMax} sat>=${t.filtroConfig.satMin} exac<=${t.filtroConfig.exacMax}m CN0>=${t.filtroConfig.cn0Min}` : null },
      geometry:{ type:'LineString', coordinates:t.pts.map(q=>[q.lon,q.lat,q.alt||0]) } });
    bajar(S.proy.nom+'.geojson', JSON.stringify(fc,null,1), 'application/geo+json');
  };
}
async function bajar(nom, txt, tipo){
  const safe = nom.replace(/[^\w\-. áéíóúñÁÉÍÓÚÑ]/g,'_');
  const P = window.Capacitor && window.Capacitor.Plugins;
  // En el APK, <a download> con blob NO funciona en el WebView de Android.
  // Escribimos el archivo con Filesystem y abrimos el menú Compartir.
  if(P && P.Filesystem){
    try{
      const res = await P.Filesystem.writeFile({
        path: safe,
        data: txt,
        directory: 'CACHE',
        encoding: 'utf8'
      });
      if(P.Share){
        // IMPORTANTE: compartir SOLO el archivo (url). Si se manda 'text'
        // junto, con extensiones que Android no reconoce (.gpx/.geojson) el
        // menú prioriza el texto y descarta el archivo.
        await P.Share.share({ title: safe, url: res.uri, dialogTitle: 'Guardar o compartir ' + safe });
      } else {
        toast('Guardado en caché: ' + safe);
      }
      return;
    }catch(e){
      console.log('Filesystem/Share error:', e);
      toast('No se pudo guardar el archivo: ' + (e && e.message ? e.message : e));
      return;
    }
  }
  // Navegador de escritorio: descarga clásica.
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:tipo}));
  a.download = safe;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
  toast('Archivo descargado.');
}

// Evalúa si un fix pasa los filtros de calidad. Criterios sin dato no rechazan.
function pasaFiltros(pos){
  const F = S.filtros; if(!F || !F.activo) return true;
  const acc = pos.coords.accuracy;
  if(acc!=null && F.exacMax>0 && acc > F.exacMax) return false;
  if(ultimoHdop!=null && F.hdopMax>0 && ultimoHdop > F.hdopMax) return false;
  if(ultimoSatsUsados!=null && F.satMin>0 && ultimoSatsUsados < F.satMin) return false;
  if(ultimoCn0Mean!=null && F.cn0Min>0 && ultimoCn0Mean < F.cn0Min) return false;
  return true;
}

/* --- capas del usuario: GeoJSON / WFS / WMS --- */
const PALETA_CAPAS = ['#E0A458','#4FD1C5','#C75146','#6FCF6F','#B07CC6','#E06AA0','#8899AA'];
function colorCapa(i){ return PALETA_CAPAS[i % PALETA_CAPAS.length]; }

// HTTP por nativo (salta CORS). En navegador cae a fetch normal.
async function httpGet(url){
  const P = pluginGnss();
  if(P && P.httpGet){
    const r = await P.httpGet({ url });
    const bytes = Uint8Array.from(atob(r.dataBase64), c=> c.charCodeAt(0));
    return { status:r.status, contentType:r.contentType||'', bytes };
  }
  const resp = await fetch(url, {signal: AbortSignal.timeout(20000)});
  const bytes = new Uint8Array(await resp.arrayBuffer());
  return { status:resp.status, contentType: resp.headers.get('content-type')||'', bytes };
}
function bytesATexto(bytes){ return new TextDecoder('utf-8').decode(bytes); }
function sinQuery(u){ return (u||'').split('?')[0]; }

// Lee GetCapabilities y lista capas/feature types (maneja espacios de nombres por localName).
function parseCapabilities(xmlText, tag){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const out = [];
  const nodos = doc.getElementsByTagName('*');
  for(let i=0;i<nodos.length;i++){
    const el = nodos[i];
    if(el.localName!==tag) continue;
    let name=null, title=null;
    for(let j=0;j<el.children.length;j++){
      const ch = el.children[j];
      if(ch.localName==='Name' && !name) name = ch.textContent.trim();
      else if(ch.localName==='Title' && !title) title = ch.textContent.trim();
    }
    if(name) out.push({ name, title: title||name });
  }
  return out;
}
async function escanearWMS(url){
  const base = sinQuery(url);
  const cap = `${base}?SERVICE=WMS&REQUEST=GetCapabilities`;
  const r = await httpGet(cap);
  if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
  return parseCapabilities(bytesATexto(r.bytes), 'Layer');
}
async function escanearWFS(url){
  const base = sinQuery(url);
  const cap = `${base}?SERVICE=WFS&REQUEST=GetCapabilities`;
  const r = await httpGet(cap);
  if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
  return parseCapabilities(bytesATexto(r.bytes), 'FeatureType');
}
function urlWfsGeoJSON(base, typeName){
  const b = sinQuery(base);
  const p = new URLSearchParams({ service:'WFS', version:'2.0.0', request:'GetFeature',
    typeNames:typeName, outputFormat:'application/json', srsName:'EPSG:4326', count:'10000' });
  return `${b}?${p.toString()}`;
}
async function agregarCapaWFS(nombre, base, typeName){
  toast('Descargando capa WFS…');
  try{
    const r = await httpGet(urlWfsGeoJSON(base, typeName));
    if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
    const txt = bytesATexto(r.bytes);
    let gj;
    try{ gj = JSON.parse(txt); }
    catch(e){ toast('El servidor no devolvió GeoJSON (¿no soporta outputFormat=application/json?).'); return; }
    await guardarCapaVector(nombre||typeName, gj);
  }catch(e){ toast('No se pudo descargar el WFS: '+(e.message||e)); }
}

async function guardarCapaVector(nombre, gj){
  // Normaliza a FeatureCollection (acepta Feature o geometría suelta).
  let fc = gj;
  if(!gj || !gj.type){ toast('El contenido no es GeoJSON válido.'); return; }
  if(gj.type !== 'FeatureCollection'){
    fc = { type:'FeatureCollection', features: gj.type==='Feature' ? [gj] : [{type:'Feature',geometry:gj,properties:{}}] };
  }
  const capa = { id:nid(), nombre:(nombre||'Capa').slice(0,40), tipo:'geojson', visible:true,
                 color: colorCapa(S.capas.length), geojson: fc };
  await dbPut('capas', capa); S.capas.push(capa); dibujar();
  toast(`Capa "${capa.nombre}": ${(fc.features||[]).length} elementos.`);
  panelCapas();
}
function agregarCapaArchivo(file){
  const reader = new FileReader();
  reader.onload = ()=>{ try{ guardarCapaVector(file.name.replace(/\.(geo)?json$/i,''), JSON.parse(reader.result)); }
                        catch(e){ toast('Archivo GeoJSON inválido.'); } };
  reader.onerror = ()=> toast('No se pudo leer el archivo.');
  reader.readAsText(file);
}
async function agregarCapaURL(nombre, url){
  if(!url){ toast('Pegá la URL.'); return; }
  toast('Descargando capa…');
  try{
    const r = await httpGet(url);
    if(r.status<200||r.status>=400) throw new Error('HTTP '+r.status);
    let gj;
    try{ gj = JSON.parse(bytesATexto(r.bytes)); }
    catch(e){ toast('La URL no devolvió GeoJSON. Si es un servicio WFS/WMS, usá esa opción para escanear capas.'); return; }
    await guardarCapaVector(nombre || 'Capa', gj);
  }catch(e){ toast('No se pudo cargar: '+(e.message||e)); }
