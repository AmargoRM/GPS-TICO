name: APK debug (descargable)

# Compila un APK de depuracion (firmado con la debug key de Android, sin
# necesidad de secrets) y lo publica como Release de GitHub, para poder
# descargarlo directo desde git. Corre al hacer push a la rama de la
# funcion "Ir a un punto" y tambien manualmente desde la pestana Actions.
on:
  push:
    branches:
      - claude/manual-point-marking-wfsqwr
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Sincronizar web con el proyecto Android
        run: npx cap sync android

      - name: Compilar el APK de depuracion
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar el APK con nombre estable
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gps-tico-debug.apk

      - name: Subir el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps-tico-debug-apk-${{ github.run_number }}
          path: gps-tico-debug.apk
          if-no-files-found: error

      - name: Publicar el APK como Release descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-debug --yes --cleanup-tag || true
          gh release create apk-debug gps-tico-debug.apk \
            --title "GPS TICO - APK debug" \
            --target "$GITHUB_SHA" \
            --notes "APK de depuracion con la funcion 'Ir a un punto' (marcar chincheta escribiendo coordenadas en cualquiera de los formatos de la app). Para instalar en el telefono, habilita 'Instalar apps de origenes desconocidos' y abri el archivo. Al ser un build de depuracion no esta firmado con la llave de produccion."
