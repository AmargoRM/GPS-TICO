name: Build APK Android

# Corre al hacer push a main, y tambien manualmente desde la pestaña Actions
# (boton "Run workflow", donde podes elegir la rama).
on:
  push:
    branches:
      - main
      - claude/gps-tico-capacitor-apk-djrkna
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Verificar que la firma este configurada
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Agregá los 4 secrets en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Decodificar la keystore desde el secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "Keystore escrita: $(wc -c < "$RUNNER_TEMP/release.keystore") bytes"

      - name: Estampar número de build en la app (para auto-actualización)
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/g" www/index.html
          echo "Build estampado: ${{ github.run_number }}"

      - name: Sincronizar web con el proyecto Android
        run: npx cap sync android

      - name: Compilar y firmar el APK de release
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Subir el APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps-tico-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Preparar el APK con nombre estable
        run: cp android/app/build/outputs/apk/release/app-release.apk gps-tico.apk

      - name: Generar version.json (para auto-actualización)
        run: |
          echo "{\"build\": ${{ github.run_number }}, \"apk\": \"gps-tico.apk\", \"fecha\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > version.json
          cat version.json

      - name: Limpiar el Release debug viejo (evita instalar por error un APK con otra firma)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-debug --yes --cleanup-tag || true

      - name: Publicar el APK firmado como Release descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-release --yes --cleanup-tag || true
          gh release create apk-release gps-tico.apk version.json \
            --title "GPS TICO - APK (release firmado)" \
            --target "$GITHUB_SHA" \
            --notes "APK de release firmado con la llave de produccion. Se instala/actualiza directamente encima de una version anterior firmada con la misma llave (no hace falta desinstalar). Descarga el archivo gps-tico.apk y abrilo en el telefono."
